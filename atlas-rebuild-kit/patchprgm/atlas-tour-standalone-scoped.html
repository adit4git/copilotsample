function contentRow(hit){
  const clickable = !!hit.pdf_url;
  return `<div class="row" ${clickable?`data-pdf-url="${hit.pdf_url}" data-pdf-title="${esc(hit.title)}"`:''} style="${clickable?'cursor:pointer':'cursor:default'};align-items:flex-start;gap:12px">
    <div style="flex-shrink:0;padding-top:2px">${I.chat}</div>
    <div style="min-width:0;flex:1">
      <div style="font-weight:600;font-size:13px">${esc(hit.title)}${hit.page?` <span class="mono" style="font-size:11px;color:var(--muted)">(p.${esc(String(hit.page))})</span>`:''}</div>
      <div class="sub" style="margin-top:3px;font-size:12px">${esc(hit.snippet).slice(0,180)}${hit.snippet.length>180?'\u2026':''}</div>
      ${hit.flags.length ? `<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${hit.flags.map(contentFlagPill).join('')}</div>` : ''}
      ${clickable ? `<div class="u" style="margin-top:7px;font-size:12px">Preview PDF (${hit.pages||'?'} pages) ${I.arrow}</div>` : ''}
    </div>
  </div>`;
}
function openPdfPreview(url, title){
  const existing = document.getElementById('pdfModalOverlay'); if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'pdfModalOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,18,24,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:28px';
  overlay.innerHTML = `<div style="background:var(--paper);border-radius:var(--r-l);width:min(880px,100%);height:min(90vh,1000px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)">
    <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-shrink:0">
      <div style="background:color-mix(in srgb, var(--brand) 12%, transparent);color:var(--brand);border-radius:var(--r-s);padding:6px 8px">${I.chat}</div>
      <div style="font-weight:600;font-size:14px;flex:1;min-width:0">${esc(title)}</div>
      <button class="btn sm" id="pdfModalClose">Close</button>
    </div>
    <iframe src="${url}" style="flex:1;border:none;width:100%;background:#525659"></iframe>
  </div>`;
  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  document.getElementById('pdfModalClose').onclick = () => overlay.remove();
}
async function viewVehicleCompare(householdId, model, products, amount){
  const container = document.getElementById('view');
  container.innerHTML = '<div class="empty" style="padding:32px;text-align:center;color:var(--muted)">Comparing vehicles\u2026</div>';
  await ensureVerdicts(householdId);
  const c = byId(householdId);
  if(!c || c.advisor_id !== state.fa){ setView('book'); return; }
  const qs = new URLSearchParams();
  if(products && products.length) qs.set('products', products.join(','));
  else if(model) qs.set('model', model);
  if(amount) qs.set('amount', amount);
  let brief;
  try{ brief = await api(`/api/compare/${householdId}?${qs.toString()}`); }
  catch(e){ container.innerHTML = `<div class="empty" style="padding:32px;color:var(--red)">Could not build comparison: ${esc(e.message)}</div>`; return; }
  const cmp = brief.comparison;
  state.compareCurrentIds = cmp.implementations.map(r=>r.product_id);
  const vehicleRows = cmp.implementations.map(row => {
    const perf = row.performance;
    return `<tr>
      <td><b>${esc(row.ticker || row.vehicle.replace('_',' '))}</b><div class="sub" style="font-size:11.5px;max-width:280px">${esc(row.name)}</div></td>
      <td>${row.vehicle.replace('_',' ').toLowerCase()}<div class="sub" style="font-size:11px">${esc(row.sleeve)}</div></td>
      <td class="r mono">${row.fee_bps!=null?row.fee_bps+' bps<div class="sub" style="font-size:11px">'+fmt$(row.annual_fee_dollars)+'/yr</div>':'<span class="sub">per Strategy Profile</span>'}</td>
      <td class="r mono">${perf?(perf.returns['1y']*100).toFixed(1)+'% <span class="sub" style="font-size:11px">1y</span>':'<span class="sub">\u2014</span>'}</td>

    <div class="cbp" style="padding:0">
      <table class="hh-tbl"><thead><tr><th>Tax-managed option</th><th class="r">Fee premium</th><th class="r">Breakeven harvest</th><th>Assessment</th></tr></thead><tbody>
      ${bes.map(b=>`<tr><td><b>${esc(b.product_name)}</b></td><td class="r mono">${b.fee_premium_bps} bps<div class="sub" style="font-size:11px">${fmt$(b.fee_premium_annual_dollars)}/yr</div></td>
        <td class="r mono">${(b.breakeven_harvest_needed_pct_of_assets*100).toFixed(2)}%<div class="sub" style="font-size:11px">${fmt$(b.breakeven_harvest_needed_annual_dollars)}/yr</div></td>
        <td style="font-size:12.5px;color:var(--fg-2)">${esc(b.assessment)}</td></tr>`).join('')}
      </tbody></table>
      <div class="sub" style="padding:10px 17px 13px;font-size:11.5px">Breakeven = fee premium \u00f7 23.8% blended rate. Typical first-year harvest range ${(bes[0].illustrative_typical_first_year_harvest_range_pct[0]*100).toFixed(1)}\u2013${(bes[0].illustrative_typical_first_year_harvest_range_pct[1]*100).toFixed(1)}% is illustrative, not a published figure.</div>
    </div>
  </div>` : `<div class="sub" style="margin-top:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:var(--r-m);font-size:12.5px">Add a tax-managed option (SMA or direct indexing) and a client-presentable ETF to see the fee-premium breakeven.</div>`;
  const pickerCard = `<div class="card" style="margin-top:16px">
    <div class="ch"><h3>Vehicles in this comparison</h3><span class="r" style="font-size:12px;color:var(--muted)">${cmp.implementations.length} selected \u00b7 add any product from the shelf</span></div>
    <div class="cbp">
      <div class="pchips">${cmp.implementations.map(productChip).join('')}</div>
      <div class="cmp-controls">
        <div class="ac-wrap">
          <input id="cmpSearch" class="ac-input" type="text" autocomplete="off" placeholder="Add a product \u2014 ticker, fund, manager or asset class\u2026" aria-label="Search the product shelf">
          <div class="ac-menu" id="cmpMenu" hidden></div>

        <label class="cmp-amt">Amount <input id="cmpAmount" type="text" value="${Math.round(cmp.amount).toLocaleString()}"></label>

    </div>
  </div>
  ${pickerCard}
  <div class="card" style="margin-top:14px">
    <div class="ch"><h3>Implementation comparison</h3><span class="r" style="font-size:12px;color:var(--muted)">reference basis: ${esc(cmp.reference_basis||'')}, as of ${esc(cmp.reference_as_of||'')}</span></div>
    <div class="cbp" style="padding:0;overflow-x:auto">
      <table class="hh-tbl"><thead><tr><th>Product</th><th>Vehicle</th><th class="r">Fee</th><th class="r">Return</th><th class="r">Return</th><th>TLH</th><th>Flags</th></tr></thead>
      <tbody>${vehicleRows}</tbody></table>
    </div>
  </div>

  ${beCard}

  ${brief.switching_cost_note ? `<div style="margin-top:14px;padding:12px 14px;background:color-mix(in srgb, var(--blue) 8%, transparent);border-left:3px solid var(--blue);border-radius:6px;font-size:12.5px">${esc(brief.switching_cost_note)}${brief.switching_cost_basis?' '+esc(brief.switching_cost_basis):''} <span class="u" data-transition="${c.id}:${brief.switching_cost.offering}">View transition scenario ${I.arrow}</span></div>` : ''}

  <div class="card" style="margin-top:14px">
    <div class="ch"><h3>Client-approved content</h3><span class="r" style="font-size:12px;color:var(--muted)">${brief.client_content.length} document${brief.client_content.length===1?'':'s'}</span></div>
    <div class="cbp" style="padding:8px 17px">
      ${brief.content_gap
        ? `<div style="padding:12px;background:color-mix(in srgb, var(--amber) 10%, transparent);border-left:3px solid var(--amber);border-radius:6px;font-size:13px">${esc(brief.content_gap_message)}</div>`
        : brief.client_content.map(contentRow).join('')}
    </div>
  </div>

  ${brief.advisor_content.length ? `<div class="card" style="margin-top:14px">
    <div class="ch"><h3>Advisor-only context</h3><span class="r" style="font-size:12px;color:var(--muted)">not for client distribution</span></div>
    <div class="cbp" style="padding:8px 17px">${brief.advisor_content.map(contentRow).join('')}</div>
  </div>` : ''}

  <div style="margin-top:14px;font-size:11.5px;color:var(--muted);text-align:center;padding:14px">
    Content retrieval shown here uses catalog metadata and keyword matching over a seeded content set \u2014 a production deployment would call a real multimodal retrieval pipeline (e.g. Voyage embeddings for prose, ColPali for chart/table-heavy pages) over the full document corpus. Performance and fee figures are illustrative program data, not live pricing.
  </div>`;
  wireComparePicker();
}

/* ================= VIEW: PRODUCT SHELF ================= */
function shelfFilters(){ return state.shelfFilters || (state.shelfFilters = {q:'', vehicle:'', sleeve:'', max_minimum:'', tlh:''}); }
let shelfSleeves = null, shelfTimer = null;
async function viewShelf(){
  const v = document.getElementById('view');
  if(!shelfSleeves){ try{ shelfSleeves = (await api('/api/products/sleeves')).sleeves; }catch(e){ shelfSleeves = []; } }
  const f = shelfFilters();
  state.shelfSelected = state.shelfSelected || new Set();
  const focus = state.focusHousehold && byId(state.focusHousehold) ? state.focusHousehold : '';
  const opt = (val, label, cur) => `<option value="${val}" ${String(cur)===String(val)?'selected':''}>${label}</option>`;
  v.innerHTML = `
  <div class="cli-head reveal" style="margin-bottom:0">
    <div style="min-width:200px">
      <div class="eyebrow" style="margin-bottom:4px">PRODUCT SHELF</div>
      <div class="nm serif">Every ETF, SMA and direct-indexing product</div>
      <div class="sub" style="color:var(--muted)">Filter the shelf, select products, and compare them for any client.</div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="cbp shelf-filters">
      <div class="ac-wrap" style="flex:2 1 260px"><input id="shelfQ" class="ac-input" type="text" autocomplete="off" placeholder="Ticker, fund, manager or asset class\u2026" value="${esc(f.q||'')}"></div>
      <select id="shelfVehicle" class="shelf-sel">${opt('', 'All vehicles', f.vehicle)}${opt('ETF','ETFs',f.vehicle)}${opt('SMA','SMAs',f.vehicle)}${opt('DIRECT_INDEXING','Direct indexing / TEM SMS',f.vehicle)}${opt('ETF_MODEL','ETF models',f.vehicle)}${opt('FUND_MODEL','Fund models',f.vehicle)}</select>
      <select id="shelfSleeve" class="shelf-sel">${opt('', 'All sleeves', f.sleeve)}${shelfSleeves.map(s=>opt(s, s, f.sleeve)).join('')}</select>
      <select id="shelfMin" class="shelf-sel">${opt('', 'Any minimum', f.max_minimum)}${opt('0','No minimum',f.max_minimum)}${opt('100000','Up to $100K',f.max_minimum)}${opt('250000','Up to $250K',f.max_minimum)}</select>
      <label class="shelf-chk"><input id="shelfTlh" type="checkbox" ${f.tlh?'checked':''}> Tax-loss harvesting only</label>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="ch"><h3 id="shelfCount">Loading\u2026</h3>
      <span class="r shelf-compare">
        <select id="shelfHH" class="shelf-sel"><option value="">Compare for client\u2026</option>${myBook().map(c=>`<option value="${c.id}" ${c.id===focus?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
        <button class="btn sm primary" id="shelfCompareBtn">Compare selected</button>
      </span>
    </div>
    <div class="cbp" style="padding:0;overflow-x:auto" id="shelfTable"></div>
  </div>`;
  const reload = () => loadShelfRows();
  document.getElementById('shelfQ').addEventListener('input', e => { f.q = e.target.value; clearTimeout(shelfTimer); shelfTimer = setTimeout(reload, 160); });
  document.getElementById('shelfVehicle').onchange = e => { f.vehicle = e.target.value; reload(); };
  document.getElementById('shelfSleeve').onchange = e => { f.sleeve = e.target.value; reload(); };
  document.getElementById('shelfMin').onchange = e => { f.max_minimum = e.target.value; reload(); };
  document.getElementById('shelfTlh').onchange = e => { f.tlh = e.target.checked ? 'true' : ''; reload(); };
  document.getElementById('shelfCompareBtn').onclick = () => {
    const hid = document.getElementById('shelfHH').value; const ids = [...state.shelfSelected];
    if(!hid){ document.getElementById('shelfHH').focus(); return; }
    if(!ids.length) return;
    openVehicleCompare(hid, null, ids);
  };
  await loadShelfRows();
}
async function loadShelfRows(){
  const f = shelfFilters(); const qs = new URLSearchParams({limit:'300'});
  if(f.q) qs.set('q', f.q); if(f.vehicle) qs.set('vehicle', f.vehicle); if(f.sleeve) qs.set('sleeve', f.sleeve);
  if(f.max_minimum !== '' && f.max_minimum !== undefined) qs.set('max_minimum', f.max_minimum); if(f.tlh) qs.set('tlh_capable', 'true');
  let rows = [], total = 0;
  try{ const res = await api(`/api/products/search?${qs.toString()}`); rows = res.results; total = res.total ?? rows.length; }catch(e){ rows = []; }
  const countText = () => `${total>rows.length?`Showing ${rows.length} of ${total} products \u2014 refine the filters to see the rest`:`${rows.length} product${rows.length===1?'':'s'}`}${sel.size?` \u00b7 ${sel.size} selected`:''}`;
  const sel = state.shelfSelected;
  const box = document.getElementById('shelfTable'); if(!box) return;
  document.getElementById('shelfCount').textContent = countText();
  box.innerHTML = rows.length ? `<table class="hh-tbl"><thead><tr><th></th><th>Product</th><th>Vehicle</th><th>Sleeve</th><th class="r">Fee</th><th class="r">Minimum</th><th>TLH</th><th>TEM overlays</th><th>Source</th><th>Client use</th></tr></thead><tbody>
    ${rows.map(p=>`<tr>
      <td><input type="checkbox" class="shelf-pick" data-pid="${p.product_id}" ${sel.has(p.product_id)?'checked':''} aria-label="Select ${esc(p.name)}"></td>
      <td><b>${esc(p.ticker || (p.vehicle==='SMA'?'SMA':'DI'))}</b><div class="sub" style="font-size:11.5px;max-width:300px">${esc(p.name)}</div></td>
      <td>${p.vehicle.replace('_',' ').toLowerCase()}</td>
      <td style="font-size:12.5px">${esc(p.sleeve)}</td>
      <td class="r mono" style="white-space:nowrap">${p.fee_bps!=null?p.fee_bps+' bps':'<span class="sub">in profile</span>'}</td>
      <td class="r mono" style="white-space:nowrap">${p.minimum ? fmtM(p.minimum) : '\u2014'}</td>
      <td>${p.tlh_capable?'<span class="chip eligible dot">Yes</span>':'<span class="chip na">No</span>'}</td>
      <td class="mono" style="font-size:12px">${p.tem_overlays&&p.tem_overlays.length?p.tem_overlays.join(', '):'<span class="sub">\u2014</span>'}</td>
      <td style="font-size:12.5px">${p.model_label ? esc(p.model_label) : (p.source&&p.source.startsWith('MLIAP') ? '<span class="sub">MLIAP catalog</span>' : '<span class="sub">off-model</span>')}</td>
      <td>${p.client_presentable?'<span class="chip eligible dot">Presentable</span>':'<span class="pill amber">Not client-safe</span>'}</td>
    </tr>`).join('')}</tbody></table>`
    : `<div class="empty" style="padding:28px;text-align:center;color:var(--muted)">No products match these filters.</div>`;
  box.querySelectorAll('.shelf-pick').forEach(cb => cb.onchange = () => {
    cb.checked ? sel.add(cb.dataset.pid) : sel.delete(cb.dataset.pid);
    document.getElementById('shelfCount').textContent = countText();
  });
}

/* ================= BROKERAGE-TO-ADVISORY CONVERSION MAP ================= */
const CONV_OUTCOME = {
  HOLD: {label:'Held as-is', short:'Held', cls:'o-hold'}, SELL: {label:'Sold on entry', short:'Sold', cls:'o-sell'}, EXCHANGE: {label:'Share-class exchange', short:'Exchanged', cls:'o-exch'},
  MOVE_OUT: {label:'Stays in brokerage', short:'Stays out', cls:'o-out'}, REVIEW: {label:'Confirm', short:'Confirm', cls:'o-review'},
};
let CONV = null;
async function loadConversion(id){
  const slot = document.getElementById('convSlot'); if(!slot) return;
  let m; try{ m = await api(`/api/conversion/${id}?fa=${state.fa}`); }catch(e){ return; }
  if(!m.applicable){ slot.innerHTML = ''; return; }
  CONV = {data: m, strategy: (CONV && CONV.data.household_id === id && CONV.strategy) || m.most_held_as_is, cell: null};
  paintConversion();
}
function convSrc(docs){ return (docs || []).map(d => `IAP Brochure p.${d.pdf_page} \u2014 ${esc(d.section)}`).join('<br>'); }
function paintConversion(){
  const slot = document.getElementById('convSlot'); if(!slot || !CONV) return;
  const m = CONV.data, S = Object.fromEntries(m.strategies.map(s => [s.strategy, s])), sel = S[CONV.strategy];
  const head = `With a <b>${esc(sel.label)}</b>: ${fmtM(sel.hold_mv)} comes over as-is`
    + (sel.exchange_mv ? `, ${fmtM(sel.exchange_mv)} is exchanged into an eligible share class` : '')
    + (sel.sell_mv ? `, ${fmtM(sel.sell_mv)} is sold on entry (about ${fmtM(sel.realized_gain)} of gains, ~${fmtM(sel.est_tax)} tax at ${Math.round(m.tax_rate*1000)/10}%${sel.tet_stageable_gain ? `; TET can stage ${fmtM(sel.tet_stageable_gain)}` : ''})` : '')
    + (sel.move_out_mv ? `, ${fmtM(sel.move_out_mv)} stays in brokerage` : '')
    + (sel.review_mv ? `, ${fmtM(sel.review_mv)} needs confirming` : '') + '.';
  const gates = sel.gates.map(g => `<span class="conv-gate${g.blocking?' blocking':''}" title="${esc(g.rule_id)}">${g.blocking?'\u26d4':'\u2460'} ${esc(g.message)}</span>`).join('');
  const th = m.strategies.map(s => `<th class="conv-th${s.strategy===CONV.strategy?' sel':''}${s.available?'':' na'}" data-conv-strategy="${s.strategy}" title="${esc(s.authority)}">${esc(s.short)}${s.available?'':' <span class="sub">(not qualified)</span>'}</th>`).join('');
  const rows = m.holdings.map(h => `<tr><td><b class="mono">${esc(h.sym)}</b><div class="sub" style="font-size:11.5px">${esc(h.name)}</div><span class="conv-kind">${esc(h.kind_label)}${h.concentrated?' \u00b7 concentrated':''}</span></td>
      <td class="r mono">${fmtM(h.mv)}<div class="sub" style="font-size:11px">${h.weight}%</div></td>
      ${m.strategies.map(s => { const c = m.cells[`${h.sym}|${s.strategy}`], o = CONV_OUTCOME[c.outcome] || CONV_OUTCOME.REVIEW;
        const on = CONV.cell === `${h.sym}|${s.strategy}`;
        return `<td class="${s.strategy===CONV.strategy?'sel':''}"><button class="conv-cell ${o.cls}${on?' on':''}" data-conv-cell="${esc(h.sym)}|${s.strategy}" title="${o.label}">${o.short}${c.tet_stageable?'<span class="conv-tet">TET</span>':''}${c.assumption?'<span class="conv-asm">*</span>':''}</button></td>`; }).join('')}</tr>`).join('');
  const foot = (lbl, f) => `<tr class="conv-sum"><td colspan="2">${lbl}</td>${m.strategies.map(s => `<td class="r mono${s.strategy===CONV.strategy?' sel':''}">${f(s)}</td>`).join('')}</tr>`;
  let detail = `<div class="sub">Click any cell to see the rule behind it.</div>`;
  if(CONV.cell){
    const [sym, st] = CONV.cell.split('|'), c = m.cells[CONV.cell], h = m.holdings.find(x => x.sym === sym), o = CONV_OUTCOME[c.outcome] || CONV_OUTCOME.REVIEW;
    detail = `<div class="conv-dh"><b>${esc(h.name)}</b> under <b>${esc(S[st].label)}</b> <span class="conv-cell ${o.cls} static">${o.label}</span></div>
      <p>${esc(c.message)}</p>
      ${c.notes.map(n => `<p class="conv-note"><span class="mono">${esc(n.rule_id)}</span> ${esc(n.message)}</p>`).join('')}
      ${c.realized_gain ? `<p class="conv-note">Realized gain if sold: <b>${fmt$(c.realized_gain)}</b> (~${fmt$(Math.round(c.realized_gain*m.tax_rate))} tax, illustrative).</p>` : ''}
      <div class="conv-src"><span class="mono">${esc(c.rule_id || 'no rule')}</span>${c.assumption ? ' \u00b7 <b>illustrative assumption</b>' : ''}<br>${convSrc(c.source_doc)}</div>`;
  }
  slot.innerHTML = `<div class="card conv" style="margin-bottom:14px">
    <div class="ch"><h3 id="conversion">Brokerage \u2192 advisory conversion map</h3><span class="r" style="font-size:12px;color:var(--muted)">${fmt$(m.total_mv)} brokerage account \u00b7 rule-based</span></div>
    <div class="cbp">
      <p class="conv-headline">${head}</p>
      <div class="conv-gates">${gates}</div>

let tourState = null;
function startTour(){ tourGo(0); }
function endTour(){ tourState = null; paintTour(); document.body.classList.remove('touring'); }
function tourNext(){ if(tourState && !tourState.busy){ if(tourState.i < TOUR.length - 1) tourGo(tourState.i + 1); else endTour(); } }
function tourBack(){ if(tourState && !tourState.busy && tourState.i > 0) tourGo(tourState.i - 1); }
async function tourGo(i){
  const s = TOUR[i];
  tourState = {i, busy: true}; document.body.classList.add('touring'); paintTour();
  try{
    if(s.prompt){
      if(state.view !== 'chat') setView('chat');
      await sleep(400);
      await sendChat(s.prompt);
      await sleep(300);
      if(state.view === 'chat' && s.fallback){ state.fromChat = {q: s.prompt, view: s.view}; await s.fallback(); }
    } else if(s.go){ await s.go(); }
    await sleep(700);
    if(s.anchor) scrollToAnchor(s.anchor);
  } finally {
    if(tourState && tourState.i === i){ tourState.busy = false; paintTour(); }
  }
}
function paintTour(){
  let p = document.getElementById('tourPanel');
  if(!tourState){ if(p) p.remove(); return; }
  if(!p){ p = document.createElement('div'); p.id = 'tourPanel'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Guided tour'); document.body.appendChild(p); }
  const s = TOUR[tourState.i], n = TOUR.length, last = tourState.i === n - 1, busy = tourState.busy;
  p.innerHTML = `<div class="tour-top"><span>Guided tour \u00b7 ${tourState.i + 1} of ${n}</span><button class="tour-x" data-tour="exit" aria-label="Exit tour">\u00d7</button></div>
    <div class="tour-bar"><i style="width:${Math.round((tourState.i + 1) / n * 100)}%"></i></div>
    <h4>${esc(s.title)}</h4><p>${esc(s.text)}</p>
    ${s.prompt ? `<div class="tour-prompt">${I.chat}<span>\u201c${esc(s.prompt)}\u201d</span></div>` : ''}
    ${s.look && s.look.length ? `<div class="tour-look"><b>Look for</b><ul>${s.look.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    <div class="tour-foot">${busy ? '<span class="tour-busy"><span class="typing"><i></i><i></i><i></i></span> Atlas is working\u2026</span>' : '<span></span>'}
      <span class="tour-btns"><button class="btn sm" data-tour="back" ${tourState.i === 0 || busy ? 'disabled' : ''}>Back</button>
      <button class="btn sm primary" data-tour="next" ${busy ? 'disabled' : ''}>${last ? 'Finish' : 'Next'}${last ? '' : ' ' + I.arrow}</button></span></div>`;
}

async function render(){
  // Track which household the advisor is working on, so Ask Atlas can resolve
  // "this client" without the advisor retyping a name.
  if(state.view==='client' && state.client) state.focusHousehold = state.client;
  else if(state.view==='draftReview' && state.draftTarget) state.focusHousehold = state.draftTarget.householdId;
  else if(state.view==='transition' && state.transitionTarget) state.focusHousehold = state.transitionTarget.householdId;
  else if(state.view==='vehicleCompare' && state.compareTarget) state.focusHousehold = state.compareTarget.householdId;
  else if(state.view==='today' || state.view==='book') state.focusHousehold = null;
  if(state.view!=='chat') state.lastView = state.view;
  paintNav();
  const crumbs = {today:'Today', book:'Book of Business', chat:'Ask Atlas', tax:'Tax Overlay Desk', crosssell:'Cross-Sell Radar', shelf:'Product Shelf', guide:'Atlas Guide', client:'Book of Business', draftReview:'Book of Business', transition:'Book of Business', vehicleCompare:'Book of Business'};
  const cr = document.getElementById('crumb');
  if(state.view==='client') cr.innerHTML = `<span style="color:var(--muted)">Book of Business /</span> <b>${byId(state.client)?byId(state.client).name:''}</b>`;
  else if(state.view==='draftReview'){ const t=byId(state.draftTarget&&state.draftTarget.householdId); cr.innerHTML = `<span style="color:var(--muted)">Book of Business / ${t?t.name:''} /</span> <b>Draft</b>`; }
  else if(state.view==='transition'){ const t=byId(state.transitionTarget&&state.transitionTarget.householdId); cr.innerHTML = `<span style="color:var(--muted)">Book of Business / ${t?t.name:''} /</span> <b>Transition</b>`; }
  else if(state.view==='vehicleCompare'){ const t=byId(state.compareTarget&&state.compareTarget.householdId); cr.innerHTML = `<span style="color:var(--muted)">Book of Business / ${t?t.name:''} /</span> <b>Compare vehicles</b>`; }
  else cr.innerHTML = `<b>${crumbs[state.view]||'Today'}</b>`;
  const v = document.getElementById('view');
  if(state.view === 'today') v.innerHTML = viewToday();
  else if(state.view === 'book') v.innerHTML = viewBook();
  else if(state.view === 'chat'){ v.innerHTML = viewChat(); requestAnimationFrame(() => { scrollChat(); const ta = document.getElementById('chatInput'); if(ta) ta.focus(); }); }
  else if(state.view === 'tax') v.innerHTML = viewTax();
  else if(state.view === 'crosssell') v.innerHTML = viewCrossSell();
  else if(state.view === 'shelf') await viewShelf();
  else if(state.view === 'guide') v.innerHTML = viewGuide();
  else if(state.view === 'client'){ await viewClient(state.client); await loadConversion(state.client); }
  else if(state.view === 'draftReview') await viewDraftReview(state.draftTarget.householdId, state.draftTarget.kind);
  else if(state.view === 'transition') await viewTransition(state.transitionTarget.householdId, state.transitionTarget.offering);
  else if(state.view === 'vehicleCompare') await viewVehicleCompare(state.compareTarget.householdId, state.compareTarget.model, state.compareTarget.products, state.compareTarget.amount);
  decorateView();
}

  const convS = e.target.closest('[data-conv-strategy]'); if(convS && CONV){ CONV.strategy = convS.dataset.convStrategy; CONV.cell = null; paintConversion(); return; }
  const tn = e.target.closest('[data-tour]'); if(tn){ const k = tn.dataset.tour; if(k==='next') tourNext(); else if(k==='back') tourBack(); else endTour(); return; }
  const hd = e.target.closest('[data-howto-dismiss]'); if(hd){ dismissHowto(hd.dataset.howtoDismiss); return; }
  if(e.target.closest('[data-howto-reset]')){ try{ localStorage.removeItem(HOWTO_KEY); }catch(_){} render(); return; }
  if(e.target.closest('[data-nav],[data-client],[data-transition],[data-compare],[data-draft]')) state.fromChat = null;
  const ex = e.target.closest('[data-explain]'); if(ex){ e.stopPropagation(); showExplain(ex.dataset.client, ex.dataset.offering, ex); return; }
  const nav = e.target.closest('[data-nav]'); if(nav){ setView(nav.dataset.nav); return; }
  const dr = e.target.closest('[data-draft]'); if(dr){ const [hid,kind] = dr.dataset.draft.split(':'); openDraft(hid, kind||'meeting_prep'); return; }
  const tr = e.target.closest('[data-transition]'); if(tr){ const [hid,off] = tr.dataset.transition.split(':'); openTransition(hid, off); return; }
  const aa = e.target.closest('[data-agent-action]'); if(aa){ runAgentAction(AGENT_ACTIONS[aa.dataset.agentAction]); return; }
  const cc = e.target.closest('[data-clear-context]'); if(cc){ state.focusHousehold = null; paintChat(); return; }
  const ca = e.target.closest('[data-cmp-add]'); if(ca){ compareWithIds([...(state.compareCurrentIds||[]), ca.dataset.cmpAdd]); return; }
  const cr = e.target.closest('[data-cmp-remove]'); if(cr){ compareWithIds((state.compareCurrentIds||[]).filter(x=>x!==cr.dataset.cmpRemove)); return; }
  if(!e.target.closest('.ac-wrap')){ const m = document.getElementById('cmpMenu'); if(m) m.hidden = true; }
  const vc = e.target.closest('[data-compare]'); if(vc){ const [hid,model] = vc.dataset.compare.split(':'); openVehicleCompare(hid, model||null); return; }
  const pdf = e.target.closest('[data-pdf-url]'); if(pdf){ openPdfPreview(pdf.dataset.pdfUrl, pdf.dataset.pdfTitle); return; }
  const cl = e.target.closest('[data-client]'); if(cl){ setView('client', cl.dataset.client); return; }
  const ask = e.target.closest('[data-ask]'); if(ask){ const q = ask.dataset.ask; if(state.view !== 'chat'){ setView('chat'); } setTimeout(() => { const ta = document.getElementById('chatInput'); if(ta){ ta.value = q; ta.style.height = 'auto'; ta.style.height = Math.min(120, ta.scrollHeight)+'px'; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 40); return; }
  const send = e.target.closest('#sendBtn'); if(send){ const ta = document.getElementById('chatInput'); if(ta){ const v = ta.value; ta.value = ''; ta.style.height = 'auto'; sendChat(v); } return; }
});
document.addEventListener('input', e => {
  if(e.target.id === 'chatInput'){ e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight)+'px'; }
});
document.addEventListener('keydown', e => {
  if(e.target.id === 'chatInput' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); const v = e.target.value; e.target.value = ''; e.target.style.height = 'auto'; sendChat(v); }
  if(e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)){ const s = document.getElementById('globalSearch'); if(s){ e.preventDefault(); s.focus(); } }
  if(e.key === 'Escape') closeExplain();
});
document.addEventListener('keydown', e => {
  if(e.target.id === 'globalSearch' && e.key === 'Enter'){
    const q = e.target.value.toLowerCase().trim(); if(!q) return;
    const hit = myBook().find(c => c.name.toLowerCase().includes(q) || c.contact.toLowerCase().includes(q) || c.holdings.some(h => h.sym.toLowerCase() === q));
    if(hit){ setView('client', hit.id); e.target.value = ''; }
    else { setView('chat'); setTimeout(() => sendChat(e.target.value), 30); e.target.value = ''; }
  }
});
window.addEventListener('scroll', () => closeExplain(), true);

/* theme */
function applyTheme(t){
  const root = document.documentElement;
  if(t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  const cur = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const tog = document.getElementById('themeToggle'); if(tog) tog.innerHTML = cur === 'dark' ? I.sun : I.moon;
}
let themePref = null;
try{ themePref = localStorage.getItem('atlas-theme'); } catch(e){}
applyTheme(themePref);
document.getElementById('themeToggle').addEventListener('click', () => {
  const isDark = (document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  themePref = isDark ? 'light' : 'dark'; applyTheme(themePref);
  try{ localStorage.setItem('atlas-theme', themePref); } catch(e){}
});

(async () => {
  try {
    state.meta = await api('/api/meta');

      `<option value="${a.id}">${esc(a.role || a.name)}</option>`).join('');
    document.getElementById('faSwitch').addEventListener('change', e => switchFa(e.target.value));
    document.getElementById('faSwitch').value = state.fa;
    await loadBook();
    paintFaProfile();
    paintEngineToggle();
    render();
  } catch(e) {
    document.getElementById('view').innerHTML = `<div class="empty" style="padding:32px;color:var(--red)">Failed to load: ${esc(e.message)}</div>`;
  }
})();

  const original = openPdfPreview, urls = {};

    const b64 = ATLAS_PDFS[url];
    if(!b64) return original(url, title);
    if(!urls[url]) urls[url] = URL.createObjectURL(new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], {type:'application/pdf'}));

<script>
/* Standalone file: answers /api/tem/* from the embedded data (same responses the Python app returns). */
(function(){
  if(typeof AtlasMock === 'undefined') return;
  const prev = window.fetch;
  const reply = (obj, status) => new Response(JSON.stringify(obj), {status: status || 200, headers: {'Content-Type': 'application/json'}});
  window.fetch = async function(input, opt){
    const raw = typeof input === 'string' ? input : input.url;
    if(raw.startsWith('/api/tem')){
      await AtlasMock.ready(); const D = AtlasMock.data() || {};
      const url = new URL(raw, 'http://atlas.local'), seg = url.pathname.split('/').filter(Boolean);
      if(seg[1] === 'tem-book') return reply((D.tem_book || {})[url.searchParams.get('fa') || 'dana'] || {rows: [], threshold: 0.05});
      const t = (D.tem || {})[seg[2]];
      return t ? reply(t) : reply({detail: 'Not included in this file'}, 404);
    }
    return prev.apply(this, arguments);
  };
  if(typeof ATLAS_SCOPE !== 'undefined') ATLAS_SCOPE.add('ashford');
})();

/* ================= TAX PERSONALIZATION (TEM overlays, lots, TEM Style Manager options) =================
 * Self-contained add-on, loaded after app.js. It adds a "Tax personalization" card to the client page,
 * a lot-level chart to the Tax Overlay Desk, a "tem" workspace for Ask Atlas, three tour steps and a
 * guide entry. Every number comes from /api/tem/{id} (rules from the TEM Guide and the TER, QLH and
 * DTLH term sheets); nothing here is AI-generated.
 */
(function(){
  if(typeof viewClient !== 'function') return;
  const TEMS = {data:null, id:null, tab:'coverage', cell:null, pendingTab:null};
  const OUT = {
    APPLIES:{l:'Applies', c:'t-app'}, SUPERSEDED:{l:'Superseded by DTLH', s:'Superseded', c:'t-sup'},
    MANAGER_RUN:{l:'Manager-run', c:'t-mgr'}, NOT_APPLIED:{l:'Not applied', c:'t-no'}, REVIEW:{l:'Confirm', c:'t-rev'},
    NA:{l:'n/a', c:'t-na'}, BLOCKED:{l:'Account not eligible', s:'Blocked', c:'t-blk'}};
  const TABS = [['coverage','Coverage'],['qlh','QLH lots'],['ter','TER lots'],['dtlh','DTLH'],['options','Personalization options']];
  const TAB_FOR = {qlhOverlay:'qlh', taxManagedSMA:'ter', dtlhOverlay:'dtlh', temSms:'options'};
  const pct = (x, d=1) => (x == null ? '—' : (x*100).toFixed(d) + '%');
  const money = n => (typeof fmtM === 'function' ? fmtM(n) : '$' + Math.round(n).toLocaleString('en-US'));
  const dollars = n => '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
  const src = arr => (arr || []).join(' · ');
  const dshort = iso => { if(!iso) return '—'; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); };

  /* ---------- load + paint ---------- */
  async function loadTem(id){
    if(state.view !== 'client' || state.client !== id) return;
    const anchor = document.getElementById('convSlot') || document.querySelector('#view .grid2:last-of-type');
    if(!anchor) return;
    let slot = document.getElementById('temSlot');
    if(!slot){ slot = document.createElement('div'); slot.id = 'temSlot'; anchor.insertAdjacentElement('afterend', slot); }
    let t; try{ t = await api(`/api/tem/${id}`); }catch(e){ slot.innerHTML = ''; return; }
    if(!t.applicable){ slot.innerHTML = ''; return; }
    if(TEMS.id !== id){ TEMS.tab = 'coverage'; TEMS.cell = null; TEMS.path = null; }
    if(TEMS.pendingTab){ TEMS.tab = TEMS.pendingTab; TEMS.pendingTab = null; } if(TEMS.pendingPath){ TEMS.path = TEMS.pendingPath; TEMS.pendingPath = null; }
    TEMS.data = t; TEMS.id = id;
    paintTem();
  }

  function paintTem(){
    const slot = document.getElementById('temSlot'); const t = TEMS.data; if(!slot || !t) return;
    const gates = t.gates.map(g => `<span class="tem-gate ${g.passed === false ? 'fail' : g.passed === null ? 'unk' : 'ok'}" title="${esc(g.message + ' (' + src(g.source) + ')')}">${g.passed === false ? '✕' : g.passed === null ? '?' : '✓'} ${esc(g.label)}</span>`).join('');
    const tabs = TABS.map(([k, l]) => `<button class="tem-tab${TEMS.tab === k ? ' on' : ''}" data-tem-tab="${k}">${l}</button>`).join('');
    if(t.blocked){   // account-level gate fails: no point showing coverage, lots or options
      slot.innerHTML = `<div class="card tem" style="margin-bottom:14px"><div class="ch"><h3 id="tem">Tax personalization \u00b7 TEM overlays and options</h3><span class="r" style="font-size:12px;color:var(--muted)">rule-based, no AI</span></div>
        <div class="cbp"><p class="tem-headline">${esc(t.headline)}</p><div class="tem-gates">${gates}</div>
        <div class="tem-vline">Rule-engine verdicts: ${t.coverage.map(c => `<b>${c.overlay}</b> ${verdictBits(c)}`).join(' \u00b7 ')}</div>
        <div class="tem-src">${esc(src((t.gates.find(g => g.passed === false) || {}).source))}</div></div></div>`;
      return;
    }
    const body = {coverage: coverageTab, qlh: qlhTab, ter: terTab, dtlh: dtlhTab, options: optionsTab}[TEMS.tab](t);
    const cons = t.considerations.length ? `<div class="tem-cons"><b>Worth raising with the client</b><ul>${t.considerations.map(c => `<li>${esc(c.message)} <span class="sub">(${esc(src(c.source))})</span></li>`).join('')}</ul></div>` : '';
    slot.innerHTML = `<div class="card tem" style="margin-bottom:14px">
      <div class="ch"><h3 id="tem">Tax personalization · TEM overlays and options</h3><span class="r" style="font-size:12px;color:var(--muted)">as of ${dshort(t.as_of)} · rule-based, no AI</span></div>
      <div class="cbp">
        <p class="tem-headline">${esc(t.headline)}</p>
        <div class="tem-gates">${gates}</div>
        <div class="tem-tabs" role="tablist">${tabs}</div>
        <div class="tem-body">${body}</div>
        ${cons}
      </div></div>`;
  }

  /* ---------- rule-engine verdict for one overlay: pill, "why" (full rule trace), model transition ---------- */
  const xbtn = off => (typeof xinfoBtn === 'function' ? xinfoBtn(TEMS.id, off)
    : `<button class="xinfo" data-explain data-client="${TEMS.id}" data-offering="${off}" title="Why this verdict?" aria-label="Explain verdict">i</button>`);
  function verdictBits(c){
    return `<span class="tem-v v-${c.verdict}" title="Rule-engine verdict for the account">${c.verdict.replace('_',' ').toLowerCase()}</span>${xbtn(c.offering_id)}`
      + (c.can_model ? ` <span class="u tem-model" data-transition="${TEMS.id}:${c.offering_id}">Model transition</span>` : '');
  }
  function verdictLine(t, overlay){
    const c = t.coverage.find(x => x.overlay === overlay);
    return `<div class="tem-vline"><b>${overlay}</b> for this account: ${verdictBits(c)}${c.elected ? ' <span class="chip enrolled">Elected</span>' : ''}</div>`;
  }
  function tetNote(t){
    if(!t.tet) return '';
    const R = {INCOMPATIBLE_WITH: ['Can\u2019t run together', 't-blk'], SCOPE_CARVEOUT_WITHIN_COMPOSITION: ['Investment strategy assets only', 't-sup'], COMPATIBLE_WITH: ['Compatible', 't-app']};
    return `<div class="tem-tet"><b>With the Tax Efficient Transition Service (TET)</b> <span class="sub">TET ${t.tet.elected ? 'elected' : t.tet.verdict.replace('_',' ').toLowerCase()}${xbtn('transition')}</span>
      <ul>${t.tet.notes.map(n => `<li><b>${n.overlay}</b> <span class="tem-cell static ${(R[n.relation] || ['', 't-no'])[1]}">${(R[n.relation] || [n.relation])[0]}</span> ${esc(n.message)} <span class="sub">(${esc(src(n.source))})</span></li>`).join('')}</ul></div>`;
  }

  /* ---------- tab: coverage ---------- */
  function stackBar(by, total, order){
    return `<div class="tem-stack">${order.filter(o => by[o]).map(o => { const w = by[o] / total * 100;
      return `<span class="tem-seg ${OUT[o].c}" style="width:${w}%" title="${OUT[o].l}: ${dollars(by[o])} (${w.toFixed(0)}%)">${w >= 11 ? money(by[o]) : ''}</span>`; }).join('')}</div>`;
  }
  function coverageTab(t){
    const order = ['APPLIES','SUPERSEDED','MANAGER_RUN','REVIEW','NOT_APPLIED','BLOCKED','NA'];
    const used = new Set(); t.coverage.forEach(c => Object.keys(c.by_outcome).forEach(k => used.add(k)));

        <div class="tem-cov-l"><b>${c.overlay}</b> <span class="sub">${esc(c.label)}</span>
          <div class="tem-cov-meta">${c.elected ? '<span class="chip enrolled">Elected</span>' : ''} ${verdictBits(c)}</div><div class="sub tem-cov-style">${esc(c.style)} · ${esc(c.fee.toLowerCase())}</div></div>
        ${stackBar(c.by_outcome, t.total_mv, order)}
        <div class="tem-cov-r mono">${pct(c.applies_mv / t.total_mv, 0)}<div class="sub">covered</div></div></div>`).join('');
    const legend = order.filter(o => used.has(o)).map(o => `<span class="tem-key"><i class="${OUT[o].c}"></i>${OUT[o].l}</span>`).join('');
    const bySleeve = {}; t.holdings.forEach(h => (bySleeve[h.sleeve_id] = bySleeve[h.sleeve_id] || []).push(h));

      const head = `<tr class="tem-sleeve"><td colspan="2"><b>${esc(s.label)}</b> <span class="sub">${esc(s.role || '')}${s.product_id && s.codes && s.codes.length ? ' · catalog codes ' + s.codes.join(',') : ''}</span></td><td class="r mono">${money(s.mv)}</td><td colspan="3"></td></tr>`;
      return head + hs.map(h => `<tr><td class="mono"><b>${esc(h.sym)}</b></td><td class="sub" style="font-size:12px">${esc(h.name)}${h.lots > 1 ? ` · ${h.lots} lots` : ''}</td><td class="r mono">${money(h.mv)}</td>
        ${['TER','QLH','DTLH'].map(o => { const c = t.cells[`${h.key}|${o}`], O = OUT[c.outcome]; const on = TEMS.cell === `${h.key}|${o}`;
          return `<td><button class="tem-cell ${O.c}${on ? ' on' : ''}" data-tem-cell="${esc(h.key)}|${o}" title="${esc(O.l)}">${O.s || O.l}${c.assumption ? '*' : ''}</button></td>`; }).join('')}</tr>`).join('');
    }).join('');

      <div class="tem-scroll"><table class="tem-tbl"><thead><tr><th colspan="2">Sleeve / position</th><th class="r">Value</th><th>TER</th><th>QLH</th><th>DTLH</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="tem-detail">${detail}</div>${tetNote(t)}`;
  }

  /* ---------- tab: QLH ---------- */
  function lotChart(lots, thr){
    if(!lots.length) return '<div class="sub" style="padding:8px 0">No position here is covered by QLH.</div>';
    const lo = Math.min(-0.25, ...lots.map(l => l.pct ?? 0)), hi = Math.max(0.25, ...lots.map(l => l.pct ?? 0));
    const L = Math.max(lo, -0.6), Hh = Math.min(hi, 0.8), x = v => (Math.max(L, Math.min(Hh, v)) - L) / (Hh - L) * 100;
    const z = x(0), th = x(-thr);
    const ticks = [-0.5,-0.25,-0.1,0,0.25,0.5].filter(v => v >= L && v <= Hh);
    return `<div class="tem-lots">
      ${lots.map(l => { const v = l.pct ?? 0, a = Math.min(x(v), z), w = Math.abs(x(v) - z);
        const cls = l.status === 'HARVEST' ? 'harvest' : l.status === 'BELOW_THRESHOLD' ? 'below' : 'gain';
        return `<div class="tem-lot" title="${esc(l.lot_id)}: ${pct(l.pct)} · ${l.gain >= 0 ? 'gain' : 'loss'} ${dollars(l.gain)} · ${l.term === 'ST' ? 'short-term' : l.term === 'LT' ? 'long-term' : 'holding period unknown'}">
          <span class="tem-lot-l mono">${esc(l.lot_id)}${l.wash_sale_risk ? ' <span class="tem-ws" title="Also held in ' + esc(l.wash_sale_risk) + '">wash</span>' : ''}</span>
          <span class="tem-lot-t"><i class="tem-zero" style="left:${z}%"></i><i class="tem-thr" style="left:${th}%"></i><b class="tem-bar ${cls}" style="left:${a}%;width:${Math.max(w, .6)}%"></b></span>
          <span class="tem-lot-v mono">${pct(l.pct)} <span class="sub">${l.gain >= 0 ? '+' : '−'}${money(Math.abs(l.gain))}</span></span></div>`; }).join('')}
      <div class="tem-lot tem-axis"><span class="tem-lot-l"></span><span class="tem-lot-t">${ticks.map(v => `<em style="left:${x(v)}%">${v > 0 ? '+' : ''}${Math.round(v*100)}%</em>`).join('')}<em class="thr" style="left:${th}%">−${Math.round(thr*100)}% QLH</em></span><span class="tem-lot-v"></span></div>
    </div>`;
  }
  function timeline(q){
    const start = new Date(TEMS.data.as_of + 'T00:00:00'), span = 365, day = 864e5;
    const pos = iso => (new Date(iso + 'T00:00:00') - start) / day / span * 100;
    const months = []; for(let m = 0; m <= 12; m++){ const d = new Date(start); d.setMonth(d.getMonth() + m, 1); const p = (d - start) / day / span * 100; if(p > 0 && p < 100) months.push([p, d.toLocaleDateString('en-US', {month:'short'})]); }
    const runs = q.next_runs.filter(r => pos(r) <= 100);
    return `<div class="tem-tl"><div class="tem-tl-track">
        ${months.map(([p, l]) => `<em style="left:${p}%">${l}</em>`).join('')}
        <i class="tem-tl-today" style="left:0"></i>
        ${runs.map(r => `<span class="tem-tl-wash" style="left:${pos(r)}%;width:${Math.min(q.wash_sale_days / span * 100, 100 - pos(r))}%" title="30-day wash sale restriction after the ${dshort(r)} run"></span><b class="tem-tl-run" style="left:${pos(r)}%" title="QLH run ${dshort(r)}"></b>`).join('')}
      </div><div class="tem-tl-leg"><span><b class="tem-tl-run static"></b> QLH run (every ${q.cycle_days} days${q.schedule_basis === 'enrollment' ? ` from enrollment on ${dshort(q.enrolled_on)}` : ', if enrolled today'})</span><span><i class="tem-tl-wash static"></i> ${q.wash_sale_days}-day wash sale period: proceeds sit in a replacement ETF</span></div></div>`;
  }
  function qlhTab(t){
    const q = t.qlh, cov = t.coverage.find(c => c.overlay === 'QLH');
    const stats = [['Harvest at next run', dollars(q.harvest_loss), `${q.harvest_count} lot${q.harvest_count === 1 ? '' : 's'} at a loss of ${Math.round(q.threshold*100)}% or more`],
      ['Illustrative tax value', dollars(q.harvest_tax_value), 'at 40.8% short-term / 23.8% long-term'],
      ['Below the threshold', dollars(q.below_threshold_loss), 'losses QLH leaves alone'],
      ['Outside QLH', dollars(q.outside_loss), 'losses in positions QLH doesn’t cover'],
      ['Next run', dshort(q.next_runs[0]), q.schedule_basis === 'enrollment' ? `last run ${dshort(q.last_run)}` : 'if enrolled today']];
    const outside = q.outside.length ? `<h4 class="tem-h4">Losses QLH won’t harvest, and why</h4><table class="tem-tbl small"><tbody>${q.outside.map(l => `<tr><td class="mono"><b>${esc(l.lot_id)}</b></td><td class="r mono">${pct(l.pct)}</td><td class="r mono">−${money(Math.abs(l.gain))}</td><td><span class="tem-cell static ${OUT[l.outcome].c}">${OUT[l.outcome].s || OUT[l.outcome].l}</span> ${esc(l.why)}</td></tr>`).join('')}</tbody></table>` : '';
    return `${verdictLine(t, 'QLH')}${cov.verdict !== 'ELIGIBLE' ? `<div class="tem-warn">QLH is <b>${cov.verdict.replace('_',' ').toLowerCase()}</b> for this account in the rule engine; the lots below show what it would do once that is resolved.</div>` : ''}
      <div class="tem-stats">${stats.map(([k, v, s]) => `<div class="tem-stat"><div class="l">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('')}</div>
      <h4 class="tem-h4">Every tax lot QLH covers, against its ${Math.round(q.threshold*100)}% loss threshold</h4>
      ${lotChart(q.lots, q.threshold)}
      <div class="tem-legend"><span class="tem-key"><i class="t-harvest"></i>Harvested at the next run</span><span class="tem-key"><i class="t-below"></i>Loss below ${Math.round(q.threshold*100)}%</span><span class="tem-key"><i class="t-gain"></i>Gain</span><span class="tem-key"><i class="t-wash"></i>Also held in another account</span></div>
      <h4 class="tem-h4">The next 12 months</h4>${timeline(q)}
      ${outside}
      <p class="tem-note">${esc(q.replacement_note)} Not every eligible loss is harvested: wash sales, restrictions and a portfolio turnover limit can hold some back. <span class="sub">(${esc(src(q.source))})</span></p>`;
  }

  /* ---------- tab: TER ---------- */
  function terTab(t){
    const r = t.ter;
    let best = '<div class="sub" style="padding:6px 0">No covered position has more than one tax lot, so lot selection has nothing to choose between here.</div>';
    if(r.best_lot){
      const lots = r.best_lot.lots, m = Math.max(...lots.map(l => Math.abs(l.tax_cost_per_share))) || 1;
      best = `<h4 class="tem-h4">Which ${esc(r.best_lot.sym)} lot is sold first: oldest-first vs lowest tax cost</h4>
        <div class="tem-bl">${lots.map(l => { const w = Math.abs(l.tax_cost_per_share) / m * 50;
          return `<div class="tem-bl-row"><span class="mono"><b>${esc(l.lot_id)}</b> <span class="sub">${l.qty} sh · ${l.holding_days} days · ${l.term === 'ST' ? 'short-term' : 'long-term'}</span></span>
            <span class="tem-bl-t"><i class="tem-zero" style="left:50%"></i><b class="tem-bar ${l.tax_cost_per_share < 0 ? 'save' : 'cost'}" style="left:${l.tax_cost_per_share < 0 ? 50 - w : 50}%;width:${Math.max(w, .6)}%"></b></span>
            <span class="mono tem-bl-v">${l.tax_cost_per_share < 0 ? '−' : ''}$${Math.abs(l.tax_cost_per_share).toFixed(2)}/sh</span>
            <span class="tem-rank">FIFO <b>${l.fifo_priority}</b></span><span class="tem-rank best">Best lot <b>${l.best_priority}</b></span></div>`; }).join('')}
          <div class="tem-bl-row tem-axis"><span></span><span class="tem-bl-t"><em style="left:25%">saves tax</em><em style="left:75%">costs tax</em></span><span></span><span></span><span></span></div></div>
        <p class="tem-note">Tax cost per share = the lot’s gain or loss × ${pct(r.rates.short_term)} if held a year or less, ${pct(r.rates.long_term)} if longer, ÷ shares. Best tax lot selection sells the lowest first.</p>`;
    }
    const ck = r.term_sheet_check;
    const check = `<div class="tem-check ${ck.matches ? 'ok' : 'bad'}">${ck.matches ? '✓' : '✕'} Checked against the term sheet’s own example (${esc(src(ck.source))}): Atlas sells lots ${ck.atlas_order.join(', ')}; the term sheet says ${ck.term_sheet_order.join(', ')}.</div>`;
    const defer = r.st_deferral.length ? `<h4 class="tem-h4">Short-term gain deferral</h4><table class="tem-tbl small"><thead><tr><th>Lot</th><th class="r">Gain</th><th>Turns long-term</th><th class="r">Tax if sold now</th><th class="r">Tax after</th><th class="r">Saved by waiting</th></tr></thead><tbody>${r.st_deferral.map(d => `<tr><td class="mono"><b>${esc(d.lot_id)}</b></td><td class="r mono">${money(d.gain)}</td><td>${dshort(d.lt_date)} <span class="sub">(${d.days_to_lt} days)</span></td><td class="r mono">${dollars(d.tax_if_sold_now)}</td><td class="r mono">${dollars(d.tax_after_lt)}</td><td class="r mono" style="color:var(--brand);font-weight:700">${dollars(d.saving)}</td></tr>`).join('')}</tbody></table><p class="tem-note">${esc(r.deferral_note)}</p>`
      : `<p class="tem-note">No short-term lot with a gain turns long-term within ${r.deferral_window_days} days, so short-term gain deferral has nothing to hold back today.</p>`;
    const wd = r.withdrawal_order.length ? `<h4 class="tem-h4">If cash is withdrawn: the loss-first sale order</h4><ol class="tem-wd">${r.withdrawal_order.map(l => `<li><span class="mono"><b>${esc(l.lot_id)}</b></span> ${pct(l.pct)} <span class="sub">${l.gain < 0 ? 'loss ' + money(Math.abs(l.gain)) : 'gain ' + money(l.gain)}</span></li>`).join('')}</ol><p class="tem-note">${esc(r.withdrawal_note)}</p>` : '';
    return `${verdictLine(t, 'TER')}<p class="tem-lede">TER is passive: it changes <i>how</i> the account trades, not <i>whether</i> it trades. It picks the cheapest lots to sell, delays short-term gains that are about to turn long-term, blocks wash sales inside the account, and sells losses first for withdrawals.</p>${best}${check}${defer}${wd}
      <p class="tem-note sub">${esc(src(r.source))}</p>`;
  }

  /* ---------- tab: DTLH ---------- */
  function dtlhChart(ex){
    const W = 520, H = 190, P = {l:44, r:16, t:14, b:26}, months = ex.months, lo = 880, hi = 1020;
    const x = m => P.l + months.indexOf(m) * (W - P.l - P.r) / (months.length - 1), y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
    const series = sym => ex.points.filter(p => p.sym === sym);
    const line = (pts, cls) => `<polyline class="${cls}" points="${pts.map(p => x(p.month) + ',' + y(p.value)).join(' ')}"/>` + pts.map(p => `<circle class="${cls}" cx="${x(p.month)}" cy="${y(p.value)}" r="3.5"/><text class="tem-svg-v" x="${x(p.month) + 6}" y="${y(p.value) - 6}">$${p.value}</text>`).join('');
    const ev = ex.points.filter(p => p.event).map(p => `<line class="tem-svg-ev" x1="${x(p.month)}" x2="${x(p.month)}" y1="${P.t}" y2="${H - P.b}"/><text class="tem-svg-evt" x="${x(p.month) + 4}" y="${H - P.b - 6}">${esc(p.event)}</text>`).join('');
    return `<svg class="tem-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="DTLH term sheet illustration">
      ${[900, 950, 1000].map(v => `<line class="tem-svg-grid" x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/><text class="tem-svg-ax" x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">$${v}</text>`).join('')}
      ${months.map(m => `<text class="tem-svg-ax" x="${x(m)}" y="${H - 8}" text-anchor="middle">${m}</text>`).join('')}
      ${ev}${line(series('AB'), 'ab')}${line(series('CD'), 'cd')}
    </svg>`;
  }
  function dtlhTab(t){
    const d = t.dtlh, cov = t.coverage.find(c => c.overlay === 'DTLH');
    const top = d.applies_mv ? `<div class="tem-stats"><div class="tem-stat"><div class="l">Covered by DTLH</div><div class="v">${money(d.applies_mv)}</div><div class="s">${d.elected ? 'elected' : 'not elected yet'}</div></div><div class="tem-stat"><div class="l">Losses DTLH is watching</div><div class="v">${dollars(d.watch_loss)}</div><div class="s">in ${d.watch.length} lot${d.watch.length === 1 ? '' : 's'}</div></div></div>
        ${d.watch.length ? `<table class="tem-tbl small"><tbody>${d.watch.map(l => `<tr><td class="mono"><b>${esc(l.lot_id)}</b></td><td class="r mono">${pct(l.pct)}</td><td class="r mono">−${money(Math.abs(l.gain))}</td><td class="sub">${l.term === 'ST' ? 'short-term' : 'long-term'}</td></tr>`).join('')}</tbody></table>` : ''}`
      : `<div class="tem-warn">DTLH doesn’t reach any position in this account (${cov.verdict.replace('_',' ').toLowerCase()} in the rule engine). It only covers eligible CIO strategies that consist solely of ETFs.</div>`;
    return `${verdictLine(t, 'DTLH')}<p class="tem-lede">DTLH watches eligible CIO ETF strategies continuously and harvests when a loss crosses a market-derived threshold that accounts for volatility. Replacement ETFs keep the allocation and risk profile; they stay until another loss can be harvested.</p>${top}
      <p class="tem-note">${esc(d.note)}</p>
      <h4 class="tem-h4">How DTLH works: the term sheet’s example</h4>${dtlhChart(d.example)}
      <div class="tem-legend"><span class="tem-key"><i class="t-ab"></i>ETF AB</span><span class="tem-key"><i class="t-cd"></i>Replacement ETF CD</span></div>
      <p class="tem-note">${esc(d.example.note)} Two harvests ($60 and $40 of losses) while staying invested. ${esc(d.removal_note)} <span class="sub">(${esc(src(d.source))})</span></p>`;
  }

  /* ---------- tab: personalization options ---------- */
  const PST = {CURRENT:['This account','t-app'], AVAILABLE:['Available','t-sup'], SEPARATE_ACCOUNT:['Separate account','t-mgr'], NOT_THIS_ACCOUNT:['Not this account','t-no'], BLOCKED:['Not available','t-blk']};
  // One decision at a time: a compact row of the four options; only the selected option's detail is shown.

        <table class="tem-tbl small"><thead><tr><th>Strategy</th><th>Sleeve</th><th class="r">Minimum</th><th></th></tr></thead><tbody>${t.tem_sms_options.map(x => `<tr><td>${esc(x.name)}</td><td class="sub">${esc(x.sleeve || '')}</td><td class="r mono">${x.minimum ? money(x.minimum) : '\u2014'}</td><td>${x.meets_minimum ? '<span class="chip eligible dot">Meets minimum</span>' : '<span class="pill amber">Below minimum</span>'}</td></tr>`).join('')}</tbody></table>`;

  }

  /* ---------- Tax Overlay Desk: lot-level chart ---------- */

  /* ---------- hooks into the app ---------- */
  // The tax personalization card now carries TER, QLH, DTLH and TEM Style Manager Strategies (verdicts, rule trace,
  // model-transition links and the TET interactions), so the older overlay rows and the TET composition card are retired.
  const IN_TEM_CARD = new Set(['taxManagedSMA', 'qlhOverlay', 'dtlhOverlay', 'temSms']);
  if(typeof overlayList === 'function'){ const _ol = overlayList; overlayList = function(c){ return _ol.apply(this, arguments).filter(p => !IN_TEM_CARD.has(p.k)); }; }
  if(typeof compositionPanelHtml === 'function') compositionPanelHtml = async function(){ return ''; };
  if(typeof offeringLabel === 'function'){ const _lab = offeringLabel; offeringLabel = function(){ return String(_lab.apply(this, arguments)).replace('; legacy Atlas ID', ''); }; }
  const _viewClient = viewClient;
  viewClient = async function(id){
    const out = await _viewClient.apply(this, arguments);
    document.querySelectorAll('#view .card .ch h3').forEach(h => { if(h.textContent.trim() === 'Tax & overlay services') h.textContent = 'Other tax services'; });
    try{ await loadTem(id); }catch(e){ console.warn('tem', e); }
    return out;
  };
  if(typeof viewTax === 'function'){
    const _viewTax = viewTax;
    viewTax = function(){ const html = _viewTax.apply(this, arguments); setTimeout(paintDesk, 0);
      const i = html.indexOf('<div class="tbl-wrap">'); return i < 0 ? html + '<div id="temDesk"></div>' : html.slice(0, i) + '<div id="temDesk"></div>' + html.slice(i); };
  }
  const _runAgentAction = runAgentAction;
  runAgentAction = async function(a, q){
    if(a && a.workspace === 'tem'){
      state.fromChat = {q: q || a.__q || '', view: 'client'};
      TEMS.pendingTab = TAB_FOR[a.offering_id] || 'coverage';
      if(a.offering_id === 'temSms') TEMS.pendingPath = 'TEM_SMS';
      await setView('client', a.household_id); return scrollToAnchor('tem');
    }
    return _runAgentAction.apply(this, arguments);
  };
  document.addEventListener('click', e => {
    const tb = e.target.closest('[data-tem-tab]'); if(tb){ TEMS.tab = tb.dataset.temTab; TEMS.cell = null; paintTem(); return; }
    const pa = e.target.closest('[data-tem-path]'); if(pa){ TEMS.path = pa.dataset.temPath; paintTem(); return; }
    const c = e.target.closest('[data-tem-cell]'); if(c){ TEMS.cell = TEMS.cell === c.dataset.temCell ? null : c.dataset.temCell; paintTem(); }
  });

  if(typeof HOWTO !== 'undefined' && HOWTO.client && HOWTO.client[0] && !/tax overlay/.test(HOWTO.client[0][1]))
    HOWTO.client[0][1] = HOWTO.client[0][1].replace(/\.$/, ', and how each tax overlay applies to each position and lot.');
  if(typeof TOOL_LABELS !== 'undefined') TOOL_LABELS.tax_personalization = 'Mapped the tax overlays to sleeves and lots';
  if(typeof CHAT_GROUPS !== 'undefined' && !CHAT_GROUPS.some(g => g[0] === 'Tax personalization'))
    CHAT_GROUPS.splice(1, 0, ['Tax personalization', [["Open Castellano's tax personalization", 'Tax personalization'], ["Which of Okoye's lots would QLH harvest?", 'Tax personalization · QLH']]]);
  if(typeof CAPS !== 'undefined' && !CAPS.some(c => c.t === 'Tax personalization'))
    CAPS.splice(1, 0, {t:'Tax personalization', what:'Which tax overlay reaches each sleeve and position, which lots QLH would harvest, how TER picks lots, and the TEM Style Manager options for the client.',
      ex:["Open Castellano's tax personalization", "Which of Okoye's lots would QLH harvest?", "Open Ashford's tax personalization"], opens:'Client page › Tax personalization',
      uses:'TEM Guide and the TER, QLH and DTLH term sheets, applied to sleeves, strategy catalog codes and tax lots',
      limits:'Tax values are illustrative at the term sheets’ 40.8% / 23.8% rates. DTLH thresholds and the QLH turnover limit are not published, so Atlas doesn’t predict those trades.'});
  if(typeof TOUR !== 'undefined' && !TOUR.some(s => s.view === 'client' && s.anchor === 'tem')){
    const go = (id, tab) => () => { TEMS.pendingTab = tab; return setView('client', id); };
    const steps = [
      {title:'Tax overlays, sleeve by sleeve', prompt:"Open Castellano's tax personalization", view:'client', anchor:'tem', fallback: go('castellano', 'coverage'),
       text:'Castellano’s Custom Managed account has five sleeves. The term sheets decide each one separately: DTLH covers the CIO ETF sleeve and supersedes QLH there, TER and QLH cover the SMA and fund sleeves, and nothing touches the individual bonds. A direct indexing (TEM Style Manager) strategy can’t be added as a sleeve.',
       look:['One bar per overlay: green applies, blue superseded by DTLH, grey not applied', 'Every position against TER, QLH and DTLH; click any cell for the rule and the term sheet page', 'Personalization options tab: a TEM Style Manager Strategy needs a separate account']},
      {title:'Lot by lot: what QLH would harvest', prompt:"Which of Okoye's lots would QLH harvest? Open his tax personalization", view:'client', anchor:'tem', fallback: go('okoye', 'qlh'),
       text:'QLH looks at each tax lot every 91 days and harvests lots down 5% or more. Okoye has lots on both sides of that line. He is also in the 24% bracket, which the TEM Guide flags as less likely to benefit.',
       look:['Two lots past the −5% line are harvested; two smaller losses are left alone', 'The 12-month view: each run is followed by a 30-day wash sale period', 'TER lots tab: best-lot order, checked against the term sheet’s own example']},
      {title:'A tax-aware model holding a TEM Style Manager Strategy', prompt:"Open Ashford's tax personalization", view:'client', anchor:'tem', fallback: go('ashford', 'coverage'),
       text:'Ashford is in one of the six Investment Manager Models that can hold TEM Style Manager Strategies. Overlays can be elected for the model’s ETFs, but the Parametric sleeve is manager-run, so its losses are the manager’s to harvest.',
       look:['Purple “manager-run”: $1.8M the overlays never touch', 'Worth raising: VWO is also held in a rollover IRA at another firm (wash sale risk)', 'QLH lots tab: losses QLH won’t harvest, and why; Personalization options: the six models']},
    ];
    const i = TOUR.findIndex(s => s.prompt && /castellano eligible for direct indexing/i.test(s.prompt));
    if(i >= 0) TOUR.splice(i, 1, ...steps); else TOUR.splice(Math.max(1, TOUR.length - 2), 0, ...steps);
    TOUR.forEach(s => {
      if(s.prompt && /okoye eligible for dtlh/i.test(s.prompt)){ s.anchor = 'tem'; s.fallback = go('okoye', 'dtlh');
        s.look = ['DTLH: ineligible, with the rule trace behind the \u201ci\u201d', 'Coverage: TER and QLH reach 95% of the account, DTLH none of it']; }
      if(s.prompt && /lindqvist eligible for qlh/i.test(s.prompt)){ s.anchor = 'tem'; s.fallback = go('lindqvist', 'coverage');
        s.look = ['One failed check, U.S. resident, blocks every tax overlay', 'The \u201ci\u201d next to each verdict shows the full rule trace']; }
    });
    const n = TOUR.filter(s => s.prompt).length, words = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen'];
    if(TOUR[0] && TOUR[0].text) TOUR[0].text = TOUR[0].text.replace(/runs \w+ real requests/, `runs ${words[n] || n} real requests`);
  }
  window.AtlasTem = {load: loadTem, state: TEMS};
})();
</script>
