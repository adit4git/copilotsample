<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Atlas Advisor Console — guided tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============ TOKENS ============ */
:root{
  color-scheme: light dark;
  --canvas:#E9EBEF; --paper:#FFFFFF; --paper-2:#F4F6F8; --inset:#EEF1F4;
  --fg:#161B24; --fg-2:#3F4856; --muted:#6B7482;
  --line:#DBE0E6; --line-2:#E7EAEF;
  --surface-ink:#11151D; --surface-ink-2:#1A2030; --on-ink:#EDEFF3; --on-ink-2:#98A2B2; --on-ink-line:#262E3C;
  --brand:#0C5D51; --brand-2:#0A4A41; --brand-tint:#E1EEEB; --brand-ink:#06382F; --on-brand:#F4FBF9;
  --amber:#9E5E12; --amber-tint:#F5EBDA;
  --red:#A2323E; --red-tint:#F4E2E4;
  --blue:#26548F; --blue-tint:#E4ECF6;
  --gain:#0B7A4B; --loss:#B23A3A;
  --focus:#1f8f7c;
  --r-s:6px; --r-m:10px; --r-l:14px;
  --sh-1:0 1px 2px rgba(20,26,38,.05), 0 1px 1px rgba(20,26,38,.04);
  --sh-2:0 8px 28px -12px rgba(20,26,38,.22);
  --pad: env(safe-area-inset-top,0px);
  --padb: env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --canvas:#0B0E13; --paper:#141922; --paper-2:#1A202B; --inset:#10151D;
    --fg:#E6E9EF; --fg-2:#B6BDC9; --muted:#818A98;
    --line:#242C39; --line-2:#1E2531;
    --surface-ink:#090C11; --surface-ink-2:#141A24; --on-ink:#E6E9EF; --on-ink-2:#8B94A3; --on-ink-line:#212A38;
    --brand:#3FB7A0; --brand-2:#2F9C88; --brand-tint:#10302A; --brand-ink:#8FE6D5; --on-brand:#04140F;
    --amber:#D79A46; --amber-tint:#2A2214;
    --red:#DE7076; --red-tint:#2C171A;
    --blue:#6FA0DA; --blue-tint:#14202F;
    --gain:#40C48D; --loss:#E0736F;
    --focus:#3FB7A0;
    --sh-1:0 1px 2px rgba(0,0,0,.35);
    --sh-2:0 14px 40px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --canvas:#0B0E13; --paper:#141922; --paper-2:#1A202B; --inset:#10151D;
  --fg:#E6E9EF; --fg-2:#B6BDC9; --muted:#818A98;
  --line:#242C39; --line-2:#1E2531;
  --surface-ink:#090C11; --surface-ink-2:#141A24; --on-ink:#E6E9EF; --on-ink-2:#8B94A3; --on-ink-line:#212A38;
  --brand:#3FB7A0; --brand-2:#2F9C88; --brand-tint:#10302A; --brand-ink:#8FE6D5; --on-brand:#04140F;
  --amber:#D79A46; --amber-tint:#2A2214;
  --red:#DE7076; --red-tint:#2C171A;
  --blue:#6FA0DA; --blue-tint:#14202F;
  --gain:#40C48D; --loss:#E0736F;
  --focus:#3FB7A0;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 14px 40px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; scroll-padding-top: var(--pad); height:100%;}
body{
  margin:0; height:100%; background:var(--canvas); color:var(--fg);
  font-family:"Public Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0; font-weight:600;}
.serif{font-family:"Newsreader", Georgia, serif; font-weight:500; letter-spacing:-.01em;}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none;}
a{color:inherit}
::selection{background:var(--brand); color:var(--on-brand)}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }

/* ============ APP SHELL ============ */
#app{ display:grid; grid-template-columns:248px 1fr; height:100%; min-height:100%; }
/* Sidebar */
.rail{
  background:var(--surface-ink); color:var(--on-ink); display:flex; flex-direction:column;
  border-right:1px solid var(--on-ink-line);
  padding-top: var(--pad); padding-bottom: var(--padb);
}
.brand{ display:flex; align-items:center; gap:11px; padding:20px 20px 18px; }
.brand .mark{ width:30px; height:30px; border-radius:8px; background:linear-gradient(150deg,var(--brand),var(--brand-2)); display:grid; place-items:center; color:var(--on-brand); flex:0 0 auto; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);}
.brand .mark svg{width:17px;height:17px}
.brand .name{ font-family:"Newsreader",serif; font-size:19px; line-height:1; letter-spacing:-.01em; }
.brand .sub{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--on-ink-2); margin-top:3px; }
.nav{ padding:6px 12px; display:flex; flex-direction:column; gap:2px; }
.nav .lbl{ font-size:10.5px; letter-spacing:.13em; color:var(--on-ink-2); padding:14px 10px 6px; }
.nav button{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:9px 10px; border-radius:8px;
  color:var(--on-ink-2); font-size:13.5px; font-weight:500; transition:background .12s, color .12s;
}
.nav button svg{width:18px;height:18px; opacity:.9}
.nav button .cnt{ margin-left:auto; font-size:11px; font-weight:600; background:rgba(255,255,255,.08); color:var(--on-ink); padding:1px 7px; border-radius:20px; min-width:20px; text-align:center;}
.nav button:hover{ background:rgba(255,255,255,.05); color:var(--on-ink); }
.nav button.on{ background:rgba(255,255,255,.09); color:var(--on-ink); }
.nav button.on .cnt{ background:var(--brand); color:var(--on-brand);}
.rail .foot{ margin-top:auto; padding:14px 16px calc(14px + var(--padb)); border-top:1px solid var(--on-ink-line); display:flex; align-items:center; gap:10px;}
.rail .foot .av{ width:32px;height:32px;border-radius:50%; background:#3a4658; color:var(--on-ink); display:grid;place-items:center; font-weight:600; font-size:12.5px; flex:0 0 auto;}
.rail .foot .who{font-size:12.5px; font-weight:600; color:var(--on-ink)}
.rail .foot .role{font-size:11px; color:var(--on-ink-2)}
.rail .foot .tog{ margin-left:auto; color:var(--on-ink-2); padding:6px; border-radius:8px;}
.rail .foot .tog:hover{ background:rgba(255,255,255,.06); color:var(--on-ink)}

/* Main column */
.main{ min-width:0; overflow:auto; display:flex; flex-direction:column; height:100%;}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--canvas) 86%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
  padding: calc(12px + var(--pad)) 26px 12px; display:flex; align-items:center; gap:18px;
}
.topbar .crumb{ font-size:12.5px; color:var(--muted);}
.topbar .crumb b{ color:var(--fg); font-weight:600;}
.search{ margin-left:auto; position:relative; width:min(340px, 40vw);}
.search input{
  width:100%; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:8px 12px 8px 34px;
  color:var(--fg); font-size:13px; box-shadow:var(--sh-1);
}
.search input::placeholder{color:var(--muted)}
.search svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px;height:16px; color:var(--muted)}
.kbd{ position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:1px 5px;}
.content{ padding:26px 26px calc(40px + var(--padb)); max-width:1220px; width:100%; margin:0 auto; }

/* ============ PRIMITIVES ============ */
.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--sh-1); }
.eyebrow{ font-size:11px; letter-spacing:.11em; color:var(--muted); font-weight:600; }
.chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--fg-2); background:var(--paper-2); white-space:nowrap;}
.chip.enrolled{ background:var(--brand-tint); color:var(--brand-ink); border-color:transparent;}
.chip.eligible{ background:transparent; color:var(--brand); border-color:color-mix(in srgb,var(--brand) 45%, var(--line));}
.chip.na{ opacity:.5;}
.chip.dot::before{content:""; width:6px;height:6px;border-radius:50%; background:currentColor; display:inline-block}
.pill{ display:inline-flex;align-items:center;gap:6px; font-size:11px; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:6px;}
.pill.amber{background:var(--amber-tint); color:var(--amber)}
.pill.red{background:var(--red-tint); color:var(--red)}
.pill.blue{background:var(--blue-tint); color:var(--blue)}
.pill.teal{background:var(--brand-tint); color:var(--brand-ink)}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.btn{ display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; padding:8px 13px; border-radius:9px; border:1px solid var(--line); background:var(--paper); color:var(--fg); box-shadow:var(--sh-1); transition:.12s;}
.btn:hover{ border-color:color-mix(in srgb,var(--fg) 22%,var(--line)); }
.btn.primary{ background:var(--brand); color:var(--on-brand); border-color:transparent;}
.btn.primary:hover{ background:var(--brand-2);}
.btn.sm{ padding:5px 10px; font-size:12px;}
.btn svg{width:15px;height:15px}
.divider{height:1px;background:var(--line-2); border:none; margin:0;}

/* ============ TODAY / HERO ============ */
.hero{ background:var(--surface-ink); color:var(--on-ink); border-radius:var(--r-l); padding:26px 28px; position:relative; overflow:hidden; border:1px solid var(--on-ink-line);}
.hero::after{ content:""; position:absolute; inset:0; background:
  radial-gradient(120% 140% at 100% 0%, color-mix(in srgb,var(--brand) 30%, transparent) 0%, transparent 46%);
  pointer-events:none;}
.hero .greet{ font-family:"Newsreader",serif; font-size:clamp(26px,4.4vw,38px); line-height:1.04; letter-spacing:-.02em; }
.hero .date{ color:var(--on-ink-2); font-size:12.5px; margin-top:8px; letter-spacing:.02em;}
.hero .brief{ position:relative; margin-top:20px; max-width:62ch; font-size:15px; line-height:1.6; color:#D9DEE7;}
.hero .brief b{ color:#fff; font-weight:600;}
.hero .brief .u{ text-decoration:underline; text-decoration-color:var(--brand); text-underline-offset:3px; text-decoration-thickness:2px; color:#fff; cursor:pointer;}
.hero .stats{ position:relative; display:flex; flex-wrap:wrap; gap:28px; margin-top:22px; padding-top:20px; border-top:1px solid var(--on-ink-line);}
.hero .stat{ flex:1 1 140px; min-width:140px;}
.hero .stat .k{ font-family:"Newsreader",serif; font-size:26px; line-height:1;}
.hero .stat .l{ color:var(--on-ink-2); font-size:11.5px; margin-top:6px; letter-spacing:.03em;}
.hero .agentline{ position:relative; display:inline-flex; align-items:center; gap:8px; margin-top:20px; font-size:12px; color:var(--on-ink-2);}
.hero .agentline .live{ width:7px;height:7px;border-radius:50%; background:var(--brand); box-shadow:0 0 0 0 var(--brand); animation:pulse 2.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.sect-h{ display:flex; align-items:baseline; gap:12px; margin:30px 2px 14px;}
.sect-h h2{ font-family:"Newsreader",serif; font-size:22px; font-weight:500; letter-spacing:-.01em;}
.sect-h .n{ font-size:12px; color:var(--muted);}
.sect-h .more{ margin-left:auto; font-size:12.5px; font-weight:600; color:var(--brand); display:inline-flex; align-items:center; gap:4px;}

/* NBA grid */
.nba-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.nba{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden; box-shadow:var(--sh-1); display:flex; flex-direction:column;}
.nba > .head{ display:flex; align-items:center; gap:11px; padding:15px 17px 13px; border-bottom:1px solid var(--line-2); position:relative;}
.nba > .head::before{ content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0; background:var(--accent);}
.nba .ic{ width:30px;height:30px; border-radius:8px; display:grid; place-items:center; background:var(--accent-tint); color:var(--accent);}
.nba .ic svg{width:17px;height:17px}
.nba .head .t{ font-size:14px; font-weight:600;}
.nba .head .d{ font-size:11.5px; color:var(--muted);}
.nba .head .badge{ margin-left:auto; font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-tint); padding:3px 9px; border-radius:20px;}
.nba .body{ padding:6px 8px 10px; display:flex; flex-direction:column;}
.row{ display:flex; align-items:center; gap:12px; padding:10px 10px; border-radius:10px; transition:background .12s; cursor:pointer; text-align:left; width:100%;}
.row:hover{ background:var(--paper-2);}
.row .lead{ min-width:0; flex:1;}
.row .nm{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .meta{ font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:8px; align-items:center;}
.row .right{ text-align:right; flex:0 0 auto;}
.row .fig{ font-size:13px; font-weight:600; font-variant-numeric:tabular-nums;}
.row .figsub{ font-size:11px; color:var(--muted);}
.avatar{ width:34px;height:34px; border-radius:9px; display:grid; place-items:center; font-weight:600; font-size:12.5px; flex:0 0 auto; color:#fff; font-family:"Newsreader",serif;}
.nba .foot{ margin-top:auto; padding:10px 15px 13px; border-top:1px solid var(--line-2); display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted);}
.nba .foot .go{ margin-left:auto; color:var(--accent); font-weight:600; display:inline-flex; align-items:center; gap:4px; cursor:pointer;}
.u{ color:var(--brand); cursor:pointer; font-weight:600;}
.u svg, .go svg{ width:11px; height:11px; flex-shrink:0; vertical-align:-1px;}
.acc-meet{ --accent:var(--blue); --accent-tint:var(--blue-tint);}
.acc-drift{ --accent:var(--amber); --accent-tint:var(--amber-tint);}
.acc-cio{ --accent:var(--brand); --accent-tint:var(--brand-tint);}
.acc-deep{ --accent:#6b4a9e; --accent-tint:color-mix(in srgb,#6b4a9e 12%, var(--paper));}
:root[data-theme="dark"] .acc-deep, :root:not([data-theme="light"]) .acc-deep{ --accent:#a98fe0;}

.bar{ height:5px; border-radius:3px; background:var(--inset); overflow:hidden; position:relative;}
.bar > i{ position:absolute; left:0;top:0;bottom:0; border-radius:3px; display:block;}
.mini-th{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--fg); opacity:.55;}

/* ============ TABLES ============ */
.tbl-wrap{ overflow-x:auto; border-radius:var(--r-l); border:1px solid var(--line); background:var(--paper); box-shadow:var(--sh-1);}
table{ width:100%; border-collapse:collapse; font-size:13px; min-width:720px;}
thead th{ text-align:left; font-size:11px; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); white-space:nowrap;}
th.num, td.num{ text-align:right; font-variant-numeric:tabular-nums;}
tbody td{ padding:12px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle;}
tbody tr{ cursor:pointer; transition:background .12s;}
tbody tr:hover{ background:var(--paper-2);}
tbody tr:last-child td{ border-bottom:none;}
.cellname{ display:flex; align-items:center; gap:11px;}
.cellname .avatar{ width:30px;height:30px; border-radius:8px; font-size:11.5px;}
.cellname .sub{ font-size:11.5px; color:var(--muted);}
.chips-inline{ display:flex; gap:5px; flex-wrap:wrap;}

.filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.seg{ display:inline-flex; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:3px; box-shadow:var(--sh-1);}
.seg button{ padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--muted); border-radius:6px;}
.seg button.on{ background:var(--brand); color:var(--on-brand);}

/* ============ CHAT ============ */
.chatwrap{ display:grid; grid-template-columns: 1fr 288px; gap:18px; align-items:start;}
.chat{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--sh-1); display:flex; flex-direction:column; min-height:420px;}
.chat .ch-head{ display:flex; align-items:center; gap:11px; padding:14px 18px; border-bottom:1px solid var(--line-2);}
.chat .ch-head .mk{ width:30px;height:30px;border-radius:8px; background:linear-gradient(150deg,var(--brand),var(--brand-2)); display:grid;place-items:center; color:var(--on-brand);}
.chat .ch-head .mk svg{width:16px;height:16px}
.chat .ch-head .t{ font-weight:600; font-size:14px;}
.chat .ch-head .s{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px;}
.chat .ch-head .s .live{ width:6px;height:6px;border-radius:50%; background:var(--gain);}
.stream{ padding:20px 18px; display:flex; flex-direction:column; gap:16px; min-height:120px;}
.msg{ display:flex; gap:11px; max-width:100%;}
.msg .who{ width:28px;height:28px;border-radius:8px; flex:0 0 auto; display:grid;place-items:center; font-size:11px; font-weight:700;}
.msg.user{ flex-direction:row-reverse;}
.msg.user .who{ background:#38465a; color:#fff;}
.msg.bot .who{ background:linear-gradient(150deg,var(--brand),var(--brand-2)); color:var(--on-brand);}
.bubble{ padding:11px 14px; border-radius:13px; font-size:13.5px; line-height:1.55; max-width:min(78%, 640px);}
.msg.user .bubble{ background:var(--brand); color:var(--on-brand); border-bottom-right-radius:5px;}
.msg.bot .bubble{ background:var(--paper-2); border:1px solid var(--line-2); border-bottom-left-radius:5px;}
.bubble h2{ font-family:"Newsreader",serif; font-size:19px; font-weight:500; letter-spacing:-.01em; margin:0 0 10px; color:var(--fg);}
.bubble h3{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:18px 0 8px; }
.bubble h3:first-child{ margin-top:0; }
.bubble p{margin:0 0 8px} .bubble p:last-child{margin:0}
.bubble ul,.bubble ol{margin:6px 0; padding-left:20px} .bubble li{margin:3px 0}
.bubble strong{font-weight:700}
.bubble code{font-family:"IBM Plex Mono",monospace; font-size:12px; background:var(--inset); padding:1px 5px; border-radius:5px;}
.bubble .rescard{ margin:9px 0 2px; border:1px solid var(--line); border-radius:11px; overflow:hidden; background:var(--paper);}
.bubble .rescard .rc-row{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line-2);}
.bubble .rescard .rc-row:last-child{border-bottom:none}
.bubble .rescard .rc-row:hover{background:var(--paper-2); cursor:pointer}
.bubble .rescard .nm{font-weight:600; font-size:13px}
.bubble .rescard .mt{font-size:11.5px; color:var(--muted)}
.bubble .rescard .vv{margin-left:auto; text-align:right; font-weight:600; font-size:13px; font-variant-numeric:tabular-nums}
.typing{display:inline-flex; gap:4px; align-items:center; padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%; background:var(--muted); animation:blink 1.2s infinite both}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{ position:sticky; bottom:0; z-index:5; background:var(--paper); border-top:1px solid var(--line-2); border-radius:0 0 var(--r-l) var(--r-l); padding:12px 14px calc(12px + var(--padb)); }
.suggests{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px;}
.suggests button{ font-size:12px; font-weight:500; color:var(--fg-2); border:1px solid var(--line); background:var(--paper-2); padding:6px 11px; border-radius:20px; transition:.12s;}
.suggests button:hover{ border-color:var(--brand); color:var(--brand);}
.inputrow{ display:flex; gap:10px; align-items:flex-end; background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 14px;}
.inputrow textarea{ flex:1; border:none; background:none; resize:none; color:var(--fg); font:inherit; font-size:13.5px; max-height:120px; padding:5px 0; outline:none;}
.inputrow textarea::placeholder{color:var(--muted)}
.sendbtn{ width:38px;height:38px; border-radius:10px; background:var(--brand); color:var(--on-brand); display:grid; place-items:center; flex:0 0 auto; transition:.12s;}
.sendbtn:hover{background:var(--brand-2)} .sendbtn:disabled{opacity:.4; cursor:default}
.sendbtn svg{width:17px;height:17px}
.ctx-panel{ position:sticky; top:84px; display:flex; flex-direction:column; gap:14px;}
.ctx-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l); padding:15px 16px; box-shadow:var(--sh-1);}
.ctx-card h4{ font-size:12.5px; display:flex; align-items:center; gap:7px; margin-bottom:10px;}
.ctx-card h4 svg{width:15px;height:15px; color:var(--muted)}
.ctx-list{display:flex; flex-direction:column; gap:1px}
.ctx-list button{ display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:8px; width:100%; text-align:left; font-size:12.5px; transition:background .12s;}
.ctx-list button:hover{background:var(--paper-2)}
.ctx-list .avatar{width:26px;height:26px;border-radius:7px;font-size:10.5px}
.ctx-list .g{margin-left:auto; font-size:11.5px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted)}

/* ============ CLIENT PROFILE ============ */
.backlink{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:14px;}
.backlink:hover{color:var(--fg)}
.cli-head{ display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;}
.cli-head .avatar{ width:60px;height:60px; border-radius:14px; font-size:22px;}
.cli-head .nm{ font-family:"Newsreader",serif; font-size:30px; line-height:1.05; letter-spacing:-.01em;}
.cli-head .sub{ color:var(--muted); font-size:13px; margin-top:5px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.cli-head .aum{ margin-left:auto; text-align:right;}
.cli-head .aum .k{ font-family:"Newsreader",serif; font-size:30px; line-height:1;}
.cli-head .aum .l{ font-size:11.5px; color:var(--muted); margin-top:4px;}
.kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:20px;}
.kpi{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-m); padding:13px 15px; box-shadow:var(--sh-1);}
.kpi .l{ font-size:11.5px; color:var(--muted);}
.kpi .v{ font-size:19px; font-weight:600; margin-top:5px; font-variant-numeric:tabular-nums; font-family:"Newsreader",serif;}
.grid2{ display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-top:16px; align-items:start;}
.card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--sh-1);}
.card .ch{ padding:14px 17px; border-bottom:1px solid var(--line-2); display:flex; align-items:center; gap:10px;}
.card .ch h3{ font-size:14px;}
.card .ch .r{ margin-left:auto;}
.card .cb{ padding:8px 8px;}
.card .cbp{ padding:16px 17px;}
.hold{ display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:9px;}
.hold:hover{background:var(--paper-2)}
.hold .sym{ font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:500; width:52px; color:var(--fg-2);}
.hold .hn{ flex:1; min-width:0;}
.hold .hn .a{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hold .hn .b{font-size:11.5px; color:var(--muted)}
.hold .w{ width:88px;}
.hold .w .p{font-size:12px; text-align:right; font-variant-numeric:tabular-nums; margin-bottom:3px;}
.hold .gl{ width:96px; text-align:right; font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:600;}
.alloc-row{ display:flex; align-items:center; gap:12px; padding:8px 4px;}
.alloc-row .al{ width:78px; font-size:12.5px; color:var(--fg-2);}
.alloc-row .track{ flex:1;}
.alloc-row .av{ width:120px; text-align:right; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}
.stack{display:flex; flex-direction:column; gap:16px; margin-top:16px}
.elig-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.elig{ display:flex; align-items:center; gap:9px; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:var(--paper);}
.elig .eic{width:28px;height:28px;border-radius:7px; display:grid;place-items:center; flex:0 0 auto}
.elig .en{font-size:12.5px; font-weight:600}
.elig .es{font-size:11px; color:var(--muted)}
.elig .est{margin-left:auto}
.nba-mini{ display:flex; gap:10px; padding:11px 12px; border-radius:11px; border:1px solid var(--line); align-items:flex-start;}
.nba-mini .d{ width:8px;height:8px;border-radius:50%; margin-top:5px; flex:0 0 auto;}
.nba-mini .txt{font-size:12.5px; line-height:1.5}
.nba-mini .txt b{font-weight:600}

/* ============ TAX ============ */
.tax-hero{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.tax-hero .tk{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l); padding:16px 17px; box-shadow:var(--sh-1); position:relative; overflow:hidden;}
.tax-hero .tk .l{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px;}
.tax-hero .tk .v{ font-family:"Newsreader",serif; font-size:29px; margin-top:9px; line-height:1;}
.tax-hero .tk .s{ font-size:11.5px; color:var(--muted); margin-top:7px;}
.callout{ display:flex; gap:12px; padding:13px 15px; border-radius:12px; background:var(--brand-tint); border:1px solid color-mix(in srgb,var(--brand) 25%, transparent); margin:16px 0;}
.callout svg{width:18px;height:18px;color:var(--brand); flex:0 0 auto; margin-top:1px}
.callout .t{font-size:13px; line-height:1.55; color:var(--brand-ink)}
.callout .t b{font-weight:700}

/* ============ AGENT: CONTEXT, TRACE, ACTIONS ============ */
.ctx-bar{ display:flex; align-items:center; gap:8px; padding:8px 17px; font-size:12.5px; color:var(--fg-2); background:color-mix(in srgb,var(--brand) 7%,transparent); border-bottom:1px solid var(--line-2);}
.ctx-bar svg{ width:14px; height:14px; color:var(--brand); flex-shrink:0;}
.ctx-bar span{ flex:1; min-width:0;}
.ctx-x{ width:22px; height:22px; border-radius:var(--r-s); color:var(--muted); font-size:15px; line-height:1; cursor:pointer;}
.ctx-x:hover{ background:var(--paper-2); color:var(--fg);}
.trace{ margin-top:10px; font-size:12px; color:var(--muted);}
.trace summary{ cursor:pointer; font-weight:600; list-style-position:inside;}
.trace ol{ margin:6px 0 0; padding-left:20px;}
.trace li{ margin:3px 0;}
.trace .mono{ color:var(--fg-2); font-size:11.5px;}
.agent-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.agent-actions .btn svg{ width:12px; height:12px;}

/* ============ VEHICLE PICKER / AUTOCOMPLETE ============ */
.pchips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.pchip{ display:inline-flex; align-items:center; gap:7px; max-width:100%; padding:5px 6px 5px 10px; border:1px solid var(--line); border-radius:999px; background:var(--paper-2); font-size:12.5px;}
.pchip b{ font-family:"IBM Plex Mono",monospace; font-size:12px;}
.pchip-n{ color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px;}
.pchip-x{ width:20px; height:20px; border-radius:999px; color:var(--muted); font-size:14px; line-height:1; cursor:pointer; flex-shrink:0;}
.pchip-x:hover{ background:color-mix(in srgb,var(--red) 12%,transparent); color:var(--red);}
.cmp-controls{ display:flex; flex-wrap:wrap; align-items:center; gap:10px;}
.ac-wrap{ position:relative; flex:1 1 320px; min-width:240px;}
.ac-input, .cmp-amt input{ width:100%; font:inherit; font-size:13px; color:var(--fg); background:var(--paper); border:1px solid var(--line); border-radius:var(--r-m); padding:8px 11px; box-shadow:var(--sh-1); outline:none;}
.ac-input:focus, .cmp-amt input:focus{ border-color:var(--brand);}
.cmp-amt{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);}
.cmp-amt input{ width:130px; font-family:"IBM Plex Mono",monospace;}
.ac-menu{ position:absolute; z-index:50; top:calc(100% + 4px); left:0; right:0; max-height:320px; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:0 12px 32px rgba(0,0,0,.14); padding:4px;}
.ac-item{ display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; padding:8px 9px; border-radius:var(--r-s); cursor:pointer;}
.ac-item:hover:not([disabled]){ background:var(--paper-2);}
.ac-item[disabled]{ opacity:.5; cursor:default;}
.ac-t{ min-width:46px; font-weight:600; font-size:12px; color:var(--brand); padding-top:1px;}
.ac-n{ display:flex; flex-direction:column; font-size:13px; font-weight:600; min-width:0;}
.ac-m{ font-size:11.5px; font-weight:400; color:var(--muted); margin-top:1px;}
.ac-empty{ padding:10px; font-size:12.5px; color:var(--muted);}

/* ============ PRODUCT SHELF ============ */
.shelf-filters{ display:flex; flex-wrap:wrap; align-items:center; gap:10px;}
.shelf-sel{ font:inherit; font-size:13px; color:var(--fg); background:var(--paper); border:1px solid var(--line); border-radius:var(--r-m); padding:8px 10px; box-shadow:var(--sh-1); cursor:pointer;}
.shelf-chk{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--fg-2); cursor:pointer;}
.shelf-compare{ display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.shelf-pick{ cursor:pointer; width:15px; height:15px; accent-color:var(--brand);}

/* ============ CHAT MARKDOWN TABLES ============ */
.bubble .md-table{ overflow-x:auto; margin:8px 0; border:1px solid var(--line-2); border-radius:var(--r-m); background:var(--paper);}
.bubble .md-table table{ border-collapse:collapse; width:100%; font-size:12.5px;}
.bubble .md-table th{ text-align:left; font-weight:600; color:var(--muted); font-size:11.5px; background:var(--paper-2);}
.bubble .md-table th, .bubble .md-table td{ padding:7px 10px; border-bottom:1px solid var(--line-2); vertical-align:top;}
.bubble .md-table tr:last-child td{ border-bottom:none;}

/* ============ ONBOARDING: suggestions, jumps, how-to, ask button, guide, tour ============ */
.sg-wrap{ margin:4px 0 6px 44px; padding:14px; border:1px solid var(--line); border-radius:var(--r-l); background:var(--paper);}
.sg-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.sg-group h5{ margin:0 0 6px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700;}
.sg-item{ display:block; width:100%; text-align:left; margin-top:6px; padding:8px 10px; font:inherit; font-size:12.5px; color:var(--fg); background:var(--paper-2); border:1px solid var(--line-2); border-radius:var(--r-s); cursor:pointer;}
.sg-item:hover{ border-color:var(--brand);}
.sg-dest{ display:block; margin-top:2px; font-size:11px; font-weight:600; color:var(--brand);}
.sg-foot{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid var(--line-2); font-size:12.5px;}
.sg-foot .btn svg{ width:13px; height:13px;}
.nav-note{ display:flex; align-items:center; gap:8px; margin:2px 0 10px 44px; font-size:12.5px; font-weight:600; color:var(--brand);}
.nav-note svg{ width:13px; height:13px;}
.from-chat{ display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:10px 14px; font-size:13px; background:color-mix(in srgb,var(--brand) 8%,var(--paper)); border:1px solid color-mix(in srgb,var(--brand) 30%,transparent); border-radius:var(--r-m);}
.from-chat svg{ width:15px; height:15px; color:var(--brand); flex-shrink:0;}
.from-chat span{ flex:1; min-width:0;}
.howto{ margin-bottom:14px; padding:12px 16px; background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--brand); border-radius:var(--r-m); font-size:12.5px;}
.howto-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;}
.howto-x{ font:inherit; font-size:12px; font-weight:600; color:var(--brand); background:none; border:none; cursor:pointer; padding:2px 4px;}
.howto dl{ display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin:0;}
.howto dt{ color:var(--muted); font-weight:600;}
.howto dd{ margin:0; color:var(--fg-2);}
.ask-fab{ position:fixed; right:24px; bottom:24px; z-index:40; display:inline-flex; align-items:center; gap:8px; padding:11px 17px; font:inherit; font-size:13px; font-weight:600; color:#fff; background:var(--brand); border:none; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.18); cursor:pointer;}
.ask-fab svg{ width:15px; height:15px;}
body.touring .ask-fab{ display:none;}
.tour-btn{ display:inline-flex; align-items:center; margin-left:10px; padding:8px 13px; font:inherit; font-size:12px; font-weight:600; color:#fff; background:var(--brand); border:none; border-radius:20px; cursor:pointer; white-space:nowrap; flex:0 0 auto;}
#tourPanel{ position:fixed; right:24px; bottom:24px; z-index:60; width:390px; max-width:calc(100vw - 32px); max-height:calc(100vh - 48px); overflow:auto; padding:14px 18px 16px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:0 18px 44px rgba(0,0,0,.24); font-size:13px;}
#tourPanel h4{ margin:10px 0 6px; font-size:15px;}
#tourPanel p{ margin:0 0 10px; color:var(--fg-2); line-height:1.5;}
.tour-top{ display:flex; align-items:center; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
.tour-x{ font-size:18px; line-height:1; color:var(--muted); background:none; border:none; cursor:pointer;}
.tour-bar{ height:4px; margin-top:8px; background:var(--line-2); border-radius:999px; overflow:hidden;}
.tour-bar i{ display:block; height:100%; background:var(--brand);}
.tour-prompt{ display:flex; gap:8px; align-items:flex-start; margin-bottom:10px; padding:8px 10px; font-size:12.5px; background:var(--paper-2); border-radius:var(--r-s);}
.tour-prompt svg{ width:14px; height:14px; color:var(--brand); flex-shrink:0; margin-top:2px;}
.tour-look{ font-size:12.5px;}
.tour-look ul{ margin:4px 0 0; padding-left:18px; color:var(--fg-2);}
.tour-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px;}
.tour-btns{ display:flex; gap:8px;}
.tour-btns .btn svg{ width:12px; height:12px;}
.tour-busy{ display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);}
.how-steps{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-top:18px;}
.how-step{ display:flex; gap:12px; padding:14px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l);}
.how-step p{ margin:4px 0 0; font-size:12.5px; color:var(--fg-2); line-height:1.5;}
.how-n{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; flex-shrink:0; font-weight:700; font-size:13px; color:#fff; background:var(--brand); border-radius:999px;}
.ai-boundary{ display:flex; gap:12px; margin-top:14px; padding:14px 16px; font-size:13px; line-height:1.55; background:color-mix(in srgb,var(--brand) 7%,var(--paper)); border:1px solid color-mix(in srgb,var(--brand) 25%,transparent); border-radius:var(--r-l);}
.ai-boundary svg{ width:18px; height:18px; color:var(--brand); flex-shrink:0; margin-top:2px;}
.guide-h{ margin:24px 0 10px; font-size:15px;}
.cap-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;}
.cap-card{ padding:16px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l);}
.cap-card h4{ margin:0 0 4px; font-size:14px;}
.cap-what{ margin:0 0 10px; font-size:12.5px; color:var(--fg-2); line-height:1.5;}
.cap-ex{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
.chip-ask{ text-align:left; padding:7px 10px; font:inherit; font-size:12.5px; color:var(--brand); background:var(--paper-2); border:1px solid var(--line-2); border-radius:var(--r-s); cursor:pointer;}
.chip-ask:hover{ border-color:var(--brand);}
.cap-meta{ display:grid; grid-template-columns:max-content 1fr; gap:4px 12px; margin:0; font-size:12px;}
.cap-meta dt{ color:var(--muted); font-weight:600;}
.cap-meta dd{ margin:0; color:var(--fg-2);}
.guide-foot{ margin:18px 0 70px; font-size:12.5px; color:var(--fg-2);}
@media (max-width:760px){ #tourPanel{ left:12px; right:12px; width:auto; bottom:76px;} .ask-fab{ bottom:76px; right:14px;} .sg-wrap{ margin-left:0;} .tour-btn{ display:none;} }

/* ============ CONVERSION MAP ============ */
.conv-headline{ margin:0 0 10px; font-size:14px; line-height:1.55;}
.conv-gates{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.conv-gate{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px; font-size:12px; border:1px solid var(--line); border-radius:999px; background:var(--paper-2); color:var(--fg-2);}
.conv-gate.blocking{ border-color:var(--red); color:var(--red);}
.conv-legend{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; font-size:12px;}
.conv-tbl{ width:100%; min-width:860px; border-collapse:collapse; font-size:12.5px;}
.conv-tbl td:first-child{ min-width:220px;}
.conv-tbl th, .conv-tbl td{ padding:7px 8px; border-bottom:1px solid var(--line-2); vertical-align:middle; text-align:left;}
.conv-tbl .r{ text-align:right;}
.conv-th{ cursor:pointer; font-size:11.5px; color:var(--muted); font-weight:700; white-space:nowrap;}
.conv-th:hover{ color:var(--brand);}
.conv-tbl th.sel, .conv-tbl td.sel{ background:color-mix(in srgb,var(--brand) 7%,transparent);}
.conv-th.sel{ color:var(--brand); box-shadow:inset 0 -2px 0 var(--brand);}
.conv-th.na{ opacity:.55;}
.conv-kind{ display:inline-block; margin-top:3px; font-size:10.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.conv-cell{ position:relative; display:inline-flex; align-items:center; gap:5px; padding:4px 8px; font:inherit; font-size:11.5px; font-weight:600; white-space:nowrap; border:1px solid transparent; border-radius:var(--r-s); cursor:pointer;}
.conv-cell.static{ cursor:default;}
.conv-cell.on{ outline:2px solid var(--fg); outline-offset:1px;}
.o-hold{ background:color-mix(in srgb,var(--brand) 14%,var(--paper)); color:var(--brand); border-color:color-mix(in srgb,var(--brand) 30%,transparent);}
.o-sell{ background:color-mix(in srgb,var(--amber) 14%,var(--paper)); color:var(--amber); border-color:color-mix(in srgb,var(--amber) 35%,transparent);}
.o-exch{ background:color-mix(in srgb,var(--blue) 12%,var(--paper)); color:var(--blue); border-color:color-mix(in srgb,var(--blue) 30%,transparent);}
.o-out{ background:var(--inset); color:var(--muted); border-color:var(--line);}
.o-review{ background:var(--paper); color:var(--red); border-color:var(--red); border-style:dashed;}
.conv-tet{ padding:1px 5px; font-size:9.5px; font-weight:700; color:#fff; background:var(--blue); border-radius:999px;}
.conv-asm{ font-weight:700;}
.conv-sum td{ font-weight:600; background:var(--paper-2);}
.conv-sum td.sel{ background:color-mix(in srgb,var(--brand) 10%,var(--paper-2));}
.conv-detail{ margin-top:12px; padding:12px 14px; font-size:13px; line-height:1.55; background:var(--paper-2); border-radius:var(--r-m);}
.conv-detail p{ margin:6px 0;}
.conv-dh{ display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
.conv-note{ font-size:12.5px; color:var(--fg-2);}
.conv-src{ margin-top:8px; font-size:11.5px; color:var(--muted);}
.conv-notes{ margin:12px 0 0; padding-left:18px; font-size:12.5px; color:var(--fg-2); line-height:1.6;}

/* ============ COLLAPSIBLE SIDEBAR ============ */
.rail-toggle{ margin-left:auto; display:grid; place-items:center; width:26px; height:26px; flex:0 0 auto; color:var(--on-ink-2); background:transparent; border:none; border-radius:7px; cursor:pointer;}
.rail-toggle:hover{ background:rgba(255,255,255,.07); color:var(--on-ink);}
.rail-toggle svg{ width:16px; height:16px; transition:transform .18s ease;}
@media (min-width:941px){
  #app{ transition:grid-template-columns .18s ease;}
  #app.rail-collapsed{ grid-template-columns:64px 1fr;}
  #app.rail-collapsed .rail-toggle svg{ transform:rotate(180deg);}
  #app.rail-collapsed .brand{ flex-direction:column; gap:12px; padding:20px 0 12px;}
  #app.rail-collapsed .brand > div:not(.mark){ display:none;}
  #app.rail-collapsed .rail-toggle{ margin-left:0;}
  #app.rail-collapsed .nav .lbl{ display:none;}
  #app.rail-collapsed .nav button{ position:relative; justify-content:center; padding-left:0; padding-right:0;}
  #app.rail-collapsed .nav button > span:not(.cnt){ display:none;}

<script src="atlas-data.js"></script>
<script>

/* Atlas standalone file: an in-page stand-in for the FastAPI server.
   Every response below was captured from the real Atlas backend, except product
   search and vehicle comparison, which are line-by-line ports of the Python
   (services.py) so any search or product combination works. */
(function(){
  const g = typeof window !== 'undefined' ? window : globalThis;
  let D = null;
  /* Data: atlas-data.js next to this file holds one JSON part per line ({"part": ..., "data": {...}}), in any order. */
  function dataProblem(msg){
    const show = () => { const b = document.createElement('div'); b.setAttribute('role', 'alert');
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;padding:10px 16px;font:13px/1.5 system-ui,sans-serif;background:#fff4e5;color:#7a4b00;border-bottom:1px solid #f0c27a';
      b.textContent = 'Data problem: ' + msg; document.body.appendChild(b); };
    if(document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  }
  function mergeParts(text){
    const out = {}, seen = [], dup = [], bad = [], parts = [];
    text.split('\n').forEach((line, i) => {
      line = line.trim(); if(!line) return;
      try { parts.push(JSON.parse(line)); } catch(e){ bad.push(i + 1); }
    });
    parts.sort((a, b) => a.part < b.part ? -1 : a.part > b.part ? 1 : 0);
    for(const p of parts){
      if(seen.includes(p.part)){ dup.push(p.part); continue; }     // pasted twice: the copy is ignored
      seen.push(p.part);
      for(const [k, v] of Object.entries(p.data)){
        if(Array.isArray(v)) out[k] = (out[k] || []).concat(v);
        else if(v && typeof v === 'object' && out[k] && typeof out[k] === 'object') Object.assign(out[k], v);
        else out[k] = v;
      }
    }
    const core = parts.find(p => p.part === 'core');
    const missing = core ? core.expects.filter(n => !seen.includes(n)) : ['core'];
    const msgs = [];
    if(bad.length) msgs.push(`${bad.length} line(s) in atlas-data.js aren't complete JSON (lines ${bad.join(', ')}): re-copy those parts`);
    if(missing.length) msgs.push('missing parts: ' + missing.join(', '));
    if(msgs.length) dataProblem(msgs.join('. ') + '.');
    return out;
  }
  const ready = (async () => {
    if(typeof g.ATLAS_DATA_TEXT === 'string'){ D = mergeParts(g.ATLAS_DATA_TEXT); return; }
    const el = typeof document !== 'undefined' && document.getElementById('atlas-data');
    if(!el){ dataProblem('atlas-data.js was not found next to this HTML file.'); return; }
    if(el.dataset.encoding === 'gzip-base64'){
      const bin = Uint8Array.from(atob(el.textContent.trim()), c => c.charCodeAt(0));
      const txt = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      D = JSON.parse(txt);
    } else D = JSON.parse(el.textContent);
  })();
  g.__atlasSetData = d => { D = d; };

  /* ---------- ports of services.py ---------- */
  const feeBps = p => p.fees.manager_bps != null ? p.fees.manager_bps : (p.fees.expense_ratio_bps != null ? p.fees.expense_ratio_bps : null);
  const label = p => p.name || p.ticker || p.product_id;
  const pyIn = (sub, s) => s.indexOf(sub) !== -1;
  const byId = () => { if(!D._pid){ D._pid = {}; D.products.forEach(p => D._pid[p.product_id] = p); } return D._pid; };
  const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;

  function searchProducts(query, o){
    o = o || {};
    const q = String(query || '').trim().toLowerCase();
    let veh = o.vehicle ? o.vehicle.toUpperCase() : null;
    const words = q.replace(/,/g, ' ').split(/\s+/).filter(Boolean);
    const VW = {sma:'SMA', smas:'SMA', etf:'ETF', etfs:'ETF', direct:'DIRECT_INDEXING', indexing:'DIRECT_INDEXING'};
    let content = words.filter(w => !(w in VW));
    if(!veh && words.length && !content.length) veh = VW[words[0]];
    if(content.length) content = words;
    const out = [];
    for(const p of D.products){
      if(veh && p.vehicle !== veh) continue;
      if(o.sleeve && !pyIn(o.sleeve.toLowerCase(), p.sleeve.toLowerCase())) continue;
      if(o.max_minimum != null && p.minimum > o.max_minimum) continue;
      const fee = feeBps(p);
      if(o.max_fee_bps != null && (fee == null || fee > o.max_fee_bps)) continue;
      if(o.tlh_capable != null && p.tlh_capable !== o.tlh_capable) continue;
      const ticker = (p.ticker || '').toLowerCase(), name = label(p).toLowerCase();
      const manager = (p.manager || '').toLowerCase(), family = (p.fund_family || '').toLowerCase();
      const sl = p.sleeve.toLowerCase(), bench = (p.benchmark || '').toLowerCase();
      const m = D.models[p.model_id]; const ml = m ? m.label.toLowerCase() : '';
      let score = content.length ? 0 : 1;
      for(const w of content){
        if(ticker && w === ticker) score += 100;
        else if(ticker && ticker.startsWith(w)) score += 60;
        else if(pyIn(w, name) || pyIn(w, manager) || pyIn(w, family)) score += 30;
        else if(pyIn(w, sl) || pyIn(w, bench) || pyIn(w, ml)) score += 15;
      }
      if(score === 0) continue;
      if(content.length > 1 && pyIn(q, name)) score += 50;
      out.push({product_id:p.product_id, name:label(p), ticker:p.ticker ?? null, vehicle:p.vehicle, sleeve:p.sleeve, model_id:p.model_id ?? null,
        model_label: m ? m.label : null, fee_bps:fee, minimum:p.minimum, tlh_capable:p.tlh_capable, client_presentable:p.client_presentable,
        score, tem_overlays:p.tem_overlays ?? null, asset_class:p.asset_class ?? null, premium_access:p.premium_access || false,
        source:p.source || 'Atlas illustrative shelf'});
    }
    out.sort((a, b) => (b.score - a.score) || ((a.fee_bps ?? 1e9) - (b.fee_bps ?? 1e9)) || cmp(a.name, b.name));
    return out;
  }

  const RATE = 0.238, RANGE = [0.015, 0.03];
  const r2 = x => Math.round(x * 100) / 100, r4 = x => Math.round(x * 10000) / 10000;
  function breakeven(amount, sma, etf){
    const prem = Math.max(0, sma - etf), dollars = amount * prem / 10000;
    const need = dollars ? dollars / RATE : 0, pct = amount ? need / amount : 0;
    const assessment = pct <= RANGE[0] ? 'Below the typical first-year harvesting range \u2014 the fee premium is likely easy to offset.'
      : pct <= RANGE[1] ? 'Within the typical first-year harvesting range \u2014 plausible but not guaranteed to fully offset the fee premium.'
      : 'Above the typical first-year harvesting range \u2014 the fee premium may not be fully offset by harvesting alone in year one.';
    return {fee_premium_bps:prem, fee_premium_annual_dollars:r2(dollars), breakeven_harvest_needed_annual_dollars:r2(need),
            breakeven_harvest_needed_pct_of_assets:r4(pct), illustrative_typical_first_year_harvest_range_pct:RANGE.slice(), assessment};
  }
  const money = n => '$' + Math.round(n).toLocaleString('en-US');
  function comparisonRows(products, amount){
    const withPerf = products.filter(p => p.performance);
    const ref = withPerf.find(p => p.vehicle === 'SMA') || withPerf[0] || null;
    const rb = ref ? ref.performance.basis : null, ra = ref ? ref.performance.as_of : null;
    const sleeves = [...new Set(products.map(p => p.sleeve))].sort();
    const rows = products.map(p => {
      const perf = p.performance || null, fee = feeBps(p);
      const mismatch = !!(perf && ref && (perf.basis !== rb || perf.as_of !== ra));
      const row = {product_id:p.product_id, name:label(p), vehicle:p.vehicle, sleeve:p.sleeve, ticker:p.ticker ?? null, model_id:p.model_id ?? null,
        fee_bps:fee, annual_fee_dollars: fee != null ? r2(amount * fee / 10000) : null, minimum:p.minimum, meets_minimum: amount >= p.minimum,
        tlh_capable:p.tlh_capable, customizable:p.customizable, tem_overlays:p.tem_overlays ?? null, premium_access:p.premium_access || false,
        performance:perf, performance_basis_matches_reference:!mismatch, client_presentable:p.client_presentable,
        source:p.source || 'Atlas illustrative shelf', flags:[]};
      if(perf && (perf.type === 'BACKTEST' || perf.type === 'HYPOTHETICAL')) row.flags.push({code:'hypothetical', severity:'required', message:'Hypothetical/backtested performance \u2014 must not be shown to the client under any framing.'});
      if(mismatch) row.flags.push({code:'basis', severity:'review', message:`Performance basis (${perf.basis}, as of ${perf.as_of}) differs from the reference (${rb}, as of ${ra}); not a like-for-like comparison as shown.`});
      if(!perf) row.flags.push({code:'noperf', severity:'review', message:'No performance is published in the Strategy Catalog; see the Strategy Profile. Compare fees, minimums and overlay eligibility only.'});
      if(fee == null) row.flags.push({code:'nofee', severity:'review', message:'The Style Manager Rate is set in the Strategy Profile and is not listed in the catalog.'});
      if(p.premium_access) row.flags.push({code:'pas', severity:'review', message:'Premium Access Strategy: dual contract with the PAS Manager; TEM Overlay Services and TET are not available.'});
      if(!row.meets_minimum) row.flags.push({code:'minimum', severity:'required', message:`Amount (${money(amount)}) is below this implementation's ${money(p.minimum)} minimum.`});
      if(sleeves.length > 1) row.flags.push({code:'sleeves', severity:'review', message:`Selection spans ${sleeves.length} different sleeves \u2014 fees are comparable, performance is not.`});
      return row;
    });
    const etfs = products.filter(p => (p.vehicle === 'ETF' || p.vehicle === 'ETF_MODEL') && p.client_presentable && feeBps(p) != null);
    let cheap = null; for(const p of etfs) if(!cheap || feeBps(p) < feeBps(cheap)) cheap = p;
    const bes = [];
    if(cheap) for(const p of products)
      if(p !== cheap && p.tlh_capable && p.client_presentable && feeBps(p) != null && feeBps(p) > feeBps(cheap))
        bes.push(Object.assign(breakeven(amount, feeBps(p), feeBps(cheap)), {product_id:p.product_id, product_name:label(p), vs_product_id:cheap.product_id, vs_product_name:label(cheap)}));
    const primary = bes.find(b => byId()[b.product_id].vehicle === 'SMA') || bes[0] || null;
    return {rows, reference_basis:rb, reference_as_of:ra, sleeves, breakevens:bes, primary_breakeven:primary};
  }
  function contentFlags(doc){
    const f = [];
    if(doc.audience == null) f.push({severity:'review', message:'Content audience is not set; cannot confirm this is client-safe.'});
    else if(doc.audience !== 'CLIENT_APPROVED') f.push({severity:'advisor_only', message:`Audience is ${doc.audience} \u2014 for advisor use only, not client-presentable.`});
    if(doc.expires && doc.expires < D.today) f.push({severity:'expired', message:`Approval expired ${doc.expires} \u2014 do not use until re-approved.`});
    if(!doc.compliance_ref) f.push({severity:'review', message:'No compliance approval reference on file.'});
    return f;
  }
  function contentSearch(query, modelId, topics, limit){
    const qt = new Set(query.split(/\s+/).filter(w => w.length > 2).map(w => w.toLowerCase()));
    const hits = [];
    for(const doc of D.content){
      if(modelId && !(doc.related_models || []).includes(modelId)) continue;
      if(topics && !topics.some(t => (doc.topics || []).includes(t))) continue;
      const hay = Object.assign({title: doc.title}, doc.page_snippets || {});
      let bp = null, bs = 0, bt = null;
      for(const [page, text] of Object.entries(hay)){
        const tt = new Set(text.split(/\s+/).filter(Boolean).map(w => w.toLowerCase().replace(/^[.,()]+|[.,()]+$/g, '')));
        let s = 0; qt.forEach(w => { if(tt.has(w)) s++; });
        if(s > bs){ bp = page; bs = s; bt = text; }
      }
      if(bs === 0 && !(modelId || topics)) continue;
      const fl = contentFlags(doc);
      hits.push({doc_id:doc.doc_id, title:doc.title, audience:doc.audience ?? null, page: bp !== 'title' ? bp : null, snippet: bt || doc.title,
        score:bs, flags:fl, pdf_url: doc.pdf_id ? `/static/content-pdfs/${doc.pdf_id}.pdf` : null, pages:doc.pages ?? null,
        client_safe: doc.audience === 'CLIENT_APPROVED' && !fl.some(x => x.severity === 'expired' || x.severity === 'review')});
    }
    hits.sort((a, b) => (b.score - a.score) || cmp(a.doc_id, b.doc_id));
    return hits.slice(0, limit);
  }
  function vehicleBrief(hid, modelId, amount, pids){
    const hh = D.hh[hid];
    if(amount == null) amount = hh.incoming_capital ? hh.incoming_capital.amount : hh.aum;
    let products, lbl;
    if(pids && pids.length){
      const P = byId(); const miss = pids.filter(x => !P[x]); if(miss.length) throw new Error('Unknown product(s): ' + miss.join(', '));
      products = [...new Set(pids)].map(x => P[x]);
      const mids = new Set(products.map(p => p.model_id ?? null));
      const only = mids.size === 1 ? [...mids][0] : undefined;
      if(only && D.models[only]){
        modelId = only;
        const full = new Set(D.models[only].implementations), sel = new Set(products.map(p => p.product_id));
        const same = full.size === sel.size && [...full].every(x => sel.has(x));
        lbl = D.models[only].label + (same ? '' : ' (custom selection)');
      } else { modelId = null; lbl = 'Custom comparison'; }
    } else {
      if(!modelId) modelId = hh.current_model_id || 'research_core';
      if(!D.models[modelId]) throw new Error('Unknown research model: ' + modelId);
      products = D.models[modelId].implementations.filter(x => byId()[x]).map(x => byId()[x]);
      lbl = D.models[modelId].label;
    }
    const body = comparisonRows(products, amount);
    const comparison = {household_id:hid, model_id:modelId, model_label:lbl, amount, reference_basis:body.reference_basis, reference_as_of:body.reference_as_of,
      sleeves:body.sleeves, implementations:body.rows, breakevens:body.breakevens, breakeven_tax_alpha:body.primary_breakeven};

    const query = `${lbl} ETF SMA fees performance tax management`, seen = new Set(), all = [];

        if(!seen.has(h.doc_id)){ seen.add(h.doc_id); all.push(h); }
    all.sort((a, b) => (b.score - a.score) || cmp(a.doc_id, b.doc_id));
    const client = all.filter(h => h.client_safe), advisor = all.filter(h => !h.client_safe);
    let sw = null, basis = null;
    if(hh.current_implementation === 'SMA'){
      const v = new Set(body.rows.map(r => r.vehicle).filter(x => x !== 'SMA')); if(!v.size) v.add('DIRECT_INDEXING');
      const target = v.has('DIRECT_INDEXING') ? 'directIndexing' : (v.size === 1 && v.has('ETF') ? 'dtlhOverlay' : 'directIndexing');
      basis = target === 'dtlhOverlay' ? 'Modeled as an ETF-only conversion (single stocks sold into a broad-market ETF), the closest existing scenario to moving SMA assets into ETFs.'
        : v.has('DIRECT_INDEXING') ? 'Modeled as a transition into Direct Indexing (a direct-indexing product is in the selection).'
        : 'Modeled as a transition into Direct Indexing, the closest existing full-sleeve replacement scenario.';
      sw = (D.transition[hid] || {})[target] || null; if(!sw) basis = null;
    }
    return {household_id:hid, model_id:comparison.model_id, incoming_capital:hh.incoming_capital ?? null, comparison, client_content:client, advisor_content:advisor,
      content_gap: client.length === 0,
      content_gap_message: client.length === 0 ? `No client-approved content found for the ${lbl} comparison. Logging a content-gap ticket to content/marketing.` : null,
      switching_cost_note: sw ? 'Existing SMA assets are a separate decision from the incoming capital \u2014 see the linked transition scenario for the cost of moving assets already invested, if that is also being considered.' : null,
      switching_cost_basis: basis, switching_cost: sw};
  }
  g.AtlasMock = {searchProducts, vehicleBrief, ready: () => ready, data: () => D};

  /* ---------- routes ---------- */
  const drafts = {};
  const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const reply = (obj, status) => new Response(JSON.stringify(obj), {status: status || 200, headers: {'Content-Type':'application/json'}});
  const realFetch = g.fetch ? g.fetch.bind(g) : null;
  g.fetch = async function(input, opt){
    const raw = typeof input === 'string' ? input : input.url;
    if(!raw.startsWith('/api/')) return realFetch(input, opt);
    await ready;
    const url = new URL(raw, 'http://atlas.local'), path = url.pathname, q = url.searchParams, seg = path.split('/').filter(Boolean);
    const method = (opt && opt.method || 'GET').toUpperCase(), body = opt && opt.body ? JSON.parse(opt.body) : {};
    try{
      if(path === '/api/meta') return reply(D.meta);
      if(path === '/api/book') return reply(D.book[q.get('fa') || 'dana'] || []);
      if(seg[1] === 'household') return D.household[seg[2]] ? reply(D.household[seg[2]]) : reply({detail:'Household not found'}, 404);
      if(seg[1] === 'verdict'){ const h = D.household[seg[2]], v = (h && h.verdicts && h.verdicts[seg[3]]) || (D.verdict[seg[2]] || {})[seg[3]];
        return v ? reply(v) : reply({detail:'Not found'}, 404); }
      if(seg[1] === 'composition') return reply(D.composition[seg[2]]);
      if(seg[1] === 'conversion'){ const c = (D.conversion || {})[seg[2]]; return c ? reply(c) : reply({detail:'Not included in this file'}, 404); }
      if(seg[1] === 'transition'){ const t = (D.transition[seg[2]] || {})[q.get('offering')]; return t ? reply(t) : reply({detail:'Not found'}, 404); }
      if(path === '/api/products/sleeves') return reply(D.sleeves);
      if(path === '/api/products/search'){
        const num = k => q.get(k) != null && q.get(k) !== '' ? Number(q.get(k)) : null;
        const all = searchProducts(q.get('q') || '', {vehicle:q.get('vehicle') || null, sleeve:q.get('sleeve') || null, max_minimum:num('max_minimum'),
          max_fee_bps:num('max_fee_bps'), tlh_capable: q.get('tlh_capable') == null ? null : q.get('tlh_capable') === 'true'});
        return reply({query:q.get('q') || '', results: all.slice(0, Number(q.get('limit') || 10)), total: all.length});
      }
      if(seg[1] === 'compare'){
        const pids = (q.get('products') || '').split(',').filter(Boolean);
        return reply(vehicleBrief(seg[2], q.get('model') || null, q.get('amount') ? Number(q.get('amount')) : null, pids.length ? pids : null));
      }
      if(seg[1] === 'draft'){
        const key = seg[2] + ':' + (body.kind || q.get('kind') || 'meeting_prep');
        if(seg[3] === 'decision'){
          const rec = drafts[key]; if(!rec) return reply({detail:'No draft yet for this household/kind'}, 404);
          if(body.action === 'approve') rec.status = 'approved';
          else if(body.action === 'decline') rec.status = 'declined';

          rec.decided_at = new Date().toISOString(); rec.decided_by = body.decided_by; return reply(rec);
        }
        if(method === 'POST'){
          drafts[key] = {household_id:seg[2], kind:body.kind || 'meeting_prep', content:D.draft[seg[2]] || 'No draft available for this household in the preview.',
                         status:'pending', mode:'local-grounded', created_at:new Date().toISOString(), decided_at:null, decided_by:null};
          return reply(drafts[key]);
        }
        return drafts[key] ? reply(drafts[key]) : reply({detail:'No draft yet for this household/kind'}, 404);
      }
      if(path === '/api/agent'){
        const hit = (D.agent[body.fa || 'dana'] || {})[norm(body.message)];
        if(hit) return reply(hit);
        return reply({mode:'preview', usage:null, steps:[],
          content:"This standalone file has no Atlas server behind it, so Ask Atlas answers the prepared requests: the suggested prompts, the guide\u2019s examples, \u201cAsk Atlas about this\u201d on each screen, and the tour.\n\nTry one of those, or press **Show me around** in the top bar.",
          actions:[{type:'navigate', workspace:'guide', household_id:null, offering_id:null, product_ids:null, model_id:null, auto_open:false, label:'See everything Atlas can do', amount:null, shelf_filters:null}]});
      }
      return reply({detail:'Not available in the preview'}, 404);
    }catch(e){ return reply({detail:String(e.message || e)}, 404); }
  };
})();

}

  if(v.scope_exclusions && v.scope_exclusions.length) return 'Carve-out: '+v.scope_exclusions[0].message;

async function showExplain(cid, off, anchor){

  const opSym = {EQ:'=', NEQ:'\u2260', IN:'\u2208', CONTAINS:'includes', GTE:'\u2265'};

  const val = (x, f) => Array.isArray(x)?(x.length>5?x.slice(0,4).join(', ')+', \u2026+'+(x.length-4)+' more':x.join(', ')):_fmtVal(x, f);
  let rows = '';
  (v.trace||[]).forEach(t => {

        <td>${fld(l.field)}</td><td class="v">${val(l.actual, l.field)}</td>

  });
  const realReasons = (v.reasons||[]).filter(r=>!r.missing_fields);
  const reason = realReasons.length?`<div class="xreason bad">${[...new Set(realReasons.map(r=>r.message))].join(' ')}</div>`:'';
  const missing = v.missing_fields && v.missing_fields.length ? `<div class="xreason unk">Unresolved \u2014 missing or invalid: ${v.missing_fields.map(fld).join(', ')}. Per policy, unknown facts route to review rather than a silent approval or rejection.</div>` : '';
  const carve = (v.scope_exclusions||[]).map(s=>`<div class="xnote">\u25D1 ${s.message}${s.excluded_ids?' ('+s.excluded_ids.join(', ')+')':''}</div>`).join('');
  const disc = (v.disclosures||[]).map(d=>`<div class="xnote">\u00A7 ${d.message}</div>`).join('');
  const realInternal = [...new Set((v.internal_only_reasons||[]).filter(r=>!r.missing_fields).map(r=>r.message))];
  const faint = realInternal.map(m=>`<div class="xnote fa">FA-internal \u00B7 ${m}</div>`).join('');
  let prereq = '';
  if(v.prerequisite && v.prerequisite.internal_only_reasons && v.prerequisite.internal_only_reasons.length){
    prereq = v.prerequisite.internal_only_reasons.map(r=>`<div class="xnote fa">Prerequisite (IAP enrollment) \u00B7 ${r.message}</div>`).join('');
  } else if(v.prerequisite && v.prerequisite.verdict==='INELIGIBLE'){
    prereq = `<div class="xnote">Prerequisite (IAP enrollment) is not met for this account \u2014 ${(v.prerequisite.reasons||[]).map(r=>r.message).join(' ')}</div>`;
  }
  const srcs = [...new Set((v.trace||[]).map(t=>fmtSrc(t.source_doc)).filter(Boolean))];
  const host = document.createElement('div'); host.className='xpop-back'; host.id='xpopHost';
  host.innerHTML = `<div class="xpop" role="dialog" aria-label="Eligibility explanation">
    <div class="xpop-h"><div class="xpop-t">${label}</div>${verdictPill(v)}</div>
    ${reason}${missing}
    <div class="xpop-sec">Inputs evaluated <span class="muted2">\u2014 derived fields the rules read</span></div>
    <div class="xtbl-wrap"><table class="xpop-tbl"><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup><thead><tr><th>Derived field</th><th>Value</th><th>Test</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted2">No field predicates \u2014 this offering attaches only conditions/disclosures.</td></tr>'}</tbody></table></div>
    ${(carve||disc||faint||prereq)?`<div class="xpop-sec">Notes</div>${carve}${disc}${faint}${prereq}`:''}
    ${srcs.length?`<div class="xsrc">source: ${srcs.join(' \u00B7 ')}</div>`:''}
    <button class="xpop-x" aria-label="Close">\u00D7</button>
  </div>`;
  document.body.appendChild(host);
  _positionPop(host.querySelector('.xpop'), anchor);
  host.addEventListener('click', e => { if(e.target===host || e.target.closest('.xpop-x')) closeExplain(); });
}

  if(!c) return CHAT_GROUPS;
  const first = c.name.split(' ')[0], items = [];
  if(c.incoming_capital) items.push([`Compare vehicles for ${first}'s ${fmtM(c.incoming_capital.amount)} incoming capital`, 'Vehicle comparison']);

  if(m.typing) return `<div class="msg bot" data-mid="${m.mid||''}"><div class="who">${I.chat}</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`;
  const body = m.html ? (m.content||'') : mdToHtml(m.content||'');
  const fa = state.meta && state.meta.advisors && state.meta.advisors[state.fa];
  const userInitials = fa ? (fa.initials || initials(fa.name)) : 'DW';
  let extra = '';
  if(m.steps && m.steps.length){
    extra += `<details class="trace"><summary>How Atlas worked this out \u00b7 ${m.steps.length} step${m.steps.length===1?'':'s'}</summary><ol>${m.steps.map(s=>`<li><b>${esc(TOOL_LABELS[s.tool]||s.tool)}</b> \u2014 ${esc(s.summary)}</li>`).join('')}</ol></details>`;
  }
  if(m.actions && m.actions.length){
    extra += `<div class="agent-actions">${m.actions.map((a,i)=>{ const key=(m.mid||'m')+'-'+i; AGENT_ACTIONS[key]=Object.assign(a,{__q:m.q});

  }
  return `<div class="msg ${m.role==='user'?'user':'bot'}"><div class="who">${m.role==='user'?userInitials:I.chat}</div><div class="bubble">${body}${extra}</div></div>`;
}
const WS_VIEW = {client:'client', eligibility:'client', transition:'transition', vehicle_compare:'vehicleCompare', cross_sell:'crosssell',
  product_shelf:'shelf', tax_desk:'tax', meeting_prep_draft:'draftReview', book:'book', today:'today', guide:'guide', conversion:'client'};
async function runAgentAction(a, q){
  if(!a) return;
  state.fromChat = {q: q || a.__q || '', view: WS_VIEW[a.workspace]};
  switch(a.workspace){
    case 'client': return setView('client', a.household_id);
    case 'eligibility': setView('client', a.household_id); return scrollToAnchor('eligibility');
    case 'transition': return openTransition(a.household_id, a.offering_id);
    case 'vehicle_compare': return openVehicleCompare(a.household_id, a.model_id, a.product_ids, a.amount);
    case 'cross_sell': return setView('crosssell');
    case 'product_shelf': state.shelfFilters = Object.assign({q:'', vehicle:'', sleeve:'', max_minimum:'', tlh:''}, Object.fromEntries(Object.entries(a.shelf_filters||{}).filter(([k,v])=>v!==null&&v!==undefined))); return setView('shelf');
    case 'tax_desk': return setView('tax');
    case 'meeting_prep_draft': return openDraft(a.household_id, 'meeting_prep');
    case 'book': return setView('book');
    case 'today': return setView('today');
    case 'guide': return setView('guide');
    case 'conversion': setView('client', a.household_id); return scrollToAnchor('conversion');
  }
}
function scrollToAnchor(id, tries=0){
  const el = document.getElementById(id);
  if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if(tries < 30) setTimeout(()=>scrollToAnchor(id, tries+1), 100);
}
function mdTableRow(ln){ return ln.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c=>c.trim()); }
function mdToHtml(md){
  let s = esc(md);
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  // Models sometimes separate table rows with blank lines; drop a blank line
  // that sits between two table rows so the table isn't split apart.
  const raw = s.split(/\n/), lines = [];
  raw.forEach((ln, i) => {
    if(ln.trim()===''){
      const prev = lines.length ? lines[lines.length-1] : '';
      const next = raw.slice(i+1).find(x => x.trim() !== '') || '';
      if(prev.trim().startsWith('|') && next.trim().startsWith('|')) return;
    }
    lines.push(ln);
  });
  let out=''; let inU=false, inO=false;
  for(let i=0; i<lines.length; i++){
    const ln = lines[i];
    // GitHub-style table: header row, a |---| separator row, then body rows.
    if(ln.trim().startsWith('|') && i+1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      if(inU){out+='</ul>';inU=false;} if(inO){out+='</ol>';inO=false;}
      const head = mdTableRow(ln); let body = []; i += 2;
      while(i < lines.length && lines[i].trim().startsWith('|')){ body.push(mdTableRow(lines[i])); i++; }
      i--;
      out += `<div class="md-table"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      continue;
    }
    if(/^\s*###\s+/.test(ln)){ if(inU){out+='</ul>';inU=false;} if(inO){out+='</ol>';inO=false;} out+='<h3>'+ln.replace(/^\s*###\s+/,'')+'</h3>'; continue; }
    if(/^\s*##\s+/.test(ln)){ if(inU){out+='</ul>';inU=false;} if(inO){out+='</ol>';inO=false;} out+='<h2>'+ln.replace(/^\s*##\s+/,'')+'</h2>'; continue; }
    if(/^\s*[-*]\s+/.test(ln)){ if(!inU){out+='<ul>';inU=true;} out+='<li>'+ln.replace(/^\s*[-*]\s+/,'')+'</li>'; continue; }
    if(/^\s*\d+\.\s+/.test(ln)){ if(!inO){out+='<ol>';inO=true;} out+='<li>'+ln.replace(/^\s*\d+\.\s+/,'')+'</li>'; continue; }
    if(inU){out+='</ul>';inU=false;} if(inO){out+='</ol>';inO=false;}
    if(ln.trim()==='') continue;
    out+='<p>'+ln+'</p>';
  }
  if(inU) out+='</ul>'; if(inO) out+='</ol>';
  return out;
}
function scrollChat(){ const m=document.getElementById('main'); if(m) m.scrollTop=m.scrollHeight; }
function paintChat(){ document.getElementById('view').innerHTML = viewChat(); scrollChat(); const ta=document.getElementById('chatInput'); if(ta) ta.focus(); }
function resCard(items){
  return `<div class="rescard">${items.map(it=>`<div class="rc-row" data-client="${it.c.id}">${avatarEl(it.c)}<div style="min-width:0"><div class="nm">${it.c.name}</div><div class="mt">${it.sub||it.c.segment}</div></div><div class="vv">${it.right||''}</div></div>`).join('')}</div>`;

async function sendChat(text){
  text = (text||'').trim(); if(!text || sending) return;
  sending = true;
  const btn = document.getElementById('sendBtn'); if(btn) btn.disabled = true;
  chatLog.push({role:'user', content:text});
  const sg = document.getElementById('suggests'); if(sg) sg.remove();
  const mid = 'm'+Date.now();
  chatLog.push({role:'bot', typing:true, mid});
  paintChat(); scrollChat();
  let autoAction = null;
  try{
    const history = chatLog.filter(m=>!m.typing && (m.role==='user'||(m.role==='bot'&&!m.html)))
      .slice(-9, -1).map(m=>({role:m.role==='user'?'user':'assistant', content:m.content||''}));
    const r = await api('/api/agent', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fa:state.fa, message:text, history, context:chatContext()})});
    agentMode = r.mode;
    const i = chatLog.findIndex(m=>m.mid===mid);
    if(i>=0) chatLog[i] = {role:'bot', mid, q:text, content:r.content, steps:r.steps, actions:r.actions, mode:r.mode};
    autoAction = (r.actions||[]).find(a=>a.auto_open) || null;
  }catch(e){
    const i = chatLog.findIndex(m=>m.mid===mid);
    if(i>=0) chatLog[i] = {role:'bot', mid, content:'Sorry \u2014 I hit an error answering that. Please try again.'};
  }finally{
    sending = false;
    const b = document.getElementById('sendBtn'); if(b) b.disabled = false;
    paintChat(); scrollChat();
    // Only navigate automatically when the advisor explicitly asked to open
    // something; otherwise the action stays a button they choose to click.
    if(autoAction){
      const hh = autoAction.household_id && byId(autoAction.household_id);
      chatLog.push({role:'nav', label:'Opening ' + autoAction.label.replace(/^Open\s+/i,'').replace(/^the\s+/i,'') + (hh ? ' \u00b7 ' + hh.name : '') + '\u2026'});
      paintChat(); scrollChat();
      await new Promise(r => setTimeout(r, 1100));
      if(state.view==='chat') await runAgentAction(autoAction, text);
    }
  }
}

function renderDraftReview(c, draft, kind, editing){

  const pending = draft.status === 'pending';
  container.innerHTML = `

  <div class="card" style="margin-top:16px">

    <div class="cbp">
      ${editing
        ? `<textarea id="draftEditArea" style="width:100%;min-height:380px;font:inherit;font-size:13.5px;line-height:1.6;border:1px solid var(--line);border-radius:var(--r-m);padding:14px;background:var(--paper-2);color:var(--fg);resize:vertical">${esc(draft.content)}</textarea>`
        : `<div class="bubble" style="max-width:none;background:transparent;border:none;padding:0">${mdToHtml(draft.content)}</div>`}
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="cbp" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      ${editing ? `
        <button class="btn primary" id="draftSave">Save & approve</button>
        <button class="btn" id="draftCancelEdit">Cancel</button>
      ` : pending ? `
        <button class="btn primary" id="draftApprove">Approve</button>
        <button class="btn" id="draftEditBtn">Edit</button>
        <button class="btn" id="draftDecline" style="color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))">Decline</button>
        <span style="margin-left:auto;font-size:12px;color:var(--muted)">FA sign-off required \u2014 nothing is sent automatically.</span>

      `}
    </div>

  if(hhSelect) hhSelect.addEventListener('change', e => openDraft(e.target.value, kind));

  if(editing){
    document.getElementById('draftSave').onclick = async () => {
      const text = document.getElementById('draftEditArea').value;
      const updated = await api(`/api/draft/${c.id}/decision`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind, action:'edit', edited_content:text, decided_by:state.fa})});
      renderDraftReview(c, updated, kind, false);
    };
    document.getElementById('draftCancelEdit').onclick = () => renderDraftReview(c, draft, kind, false);
  } else if(pending){
    document.getElementById('draftApprove').onclick = async () => {
      const updated = await api(`/api/draft/${c.id}/decision`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind, action:'approve', decided_by:state.fa})});
      renderDraftReview(c, updated, kind, false);

    document.getElementById('draftDecline').onclick = async () => {
      const updated = await api(`/api/draft/${c.id}/decision`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind, action:'decline', decided_by:state.fa})});
      renderDraftReview(c, updated, kind, false);

  }

let acTimer = null;
function wireComparePicker(){
  const input = document.getElementById('cmpSearch'); const menu = document.getElementById('cmpMenu');
  if(!input || !menu) return;
  const run = async () => {
    const q = input.value.trim();
    if(!q){ menu.hidden = true; return; }
    try{
      const r = await api(`/api/products/search?q=${encodeURIComponent(q)}&limit=8`);
      if(input.value.trim() !== q) return;  // a newer keystroke superseded this request
      menu.innerHTML = acMenuHtml(r.results); menu.hidden = false;
    }catch(e){ menu.hidden = true; }
  };
  input.addEventListener('input', () => { clearTimeout(acTimer); acTimer = setTimeout(run, 140); });
  input.addEventListener('focus', () => { if(input.value.trim()) run(); });
  input.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ menu.hidden = true; input.blur(); }
    if(e.key === 'Enter'){ e.preventDefault(); const first = menu.querySelector('.ac-item:not([disabled])'); if(first && !menu.hidden) first.click(); }
  });
  const amt = document.getElementById('cmpAmountApply');
  if(amt) amt.onclick = () => {
    const v = parseFloat(String(document.getElementById('cmpAmount').value).replace(/[$,\s]/g,''));
    if(v > 0){ const t = state.compareTarget; openVehicleCompare(t.householdId, t.model, state.compareCurrentIds, v); }

  document.getElementById('shelfMin').onchange = e => { f.max_minimum = e.target.value; reload(); };
