<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advisor workspaces · prototype v6.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>/* ---------- tokens ---------- */
:root{
  color-scheme: light dark;
  --canvas:#EEF0F3; --paper:#FFFFFF; --paper-2:#F6F7F9; --inset:#EEF1F4; --hover:#F2F5F7;
  --fg:#141A23; --fg-2:#3D4655; --muted:#687282; --faint:#98A1AE; --line:#DDE2E8; --line-2:#E9ECF0;
  --brand:#0C5D51; --brand-2:#09493F; --brand-tint:#E3F0ED; --on-brand:#F4FBF9;
  --good:#0B7A4B; --good-tint:#E3F3EA; --warn:#9E5E12; --warn-tint:#F7EEDD; --bad:#A2323E; --bad-tint:#F6E4E6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c-other:#A6ACB5;
  --under:42,120,214; --over:235,104,52;
  --r-s:6px; --r-m:10px; --r-l:14px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --sh-1:0 1px 2px rgba(20,26,38,.05), 0 0 0 1px rgba(20,26,38,.02); --sh-2:0 18px 48px -18px rgba(20,26,38,.35);
  --t-xs:11px; --t-s:12.5px; --t-m:14px; --t-l:16px; --t-xl:20px; --t-xxl:28px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --canvas:#0B0E13; --paper:#141922; --paper-2:#191F29; --inset:#10151D; --hover:#1B222D;
  --fg:#E6E9EF; --fg-2:#B6BDC9; --muted:#8A93A1; --faint:#5F6876; --line:#262E3B; --line-2:#1F2631;
  --brand:#3FB7A0; --brand-2:#2F9C88; --brand-tint:#10302A; --on-brand:#04140F;
  --good:#40C48D; --good-tint:#0F2A1F; --warn:#D79A46; --warn-tint:#2A2214; --bad:#E0736F; --bad-tint:#2C171A;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c-other:#5E6672;
  --under:57,135,229; --over:217,89,38;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 18px 48px -18px rgba(0,0,0,.7); } }
:root[data-theme="dark"]{
  --canvas:#0B0E13; --paper:#141922; --paper-2:#191F29; --inset:#10151D; --hover:#1B222D;
  --fg:#E6E9EF; --fg-2:#B6BDC9; --muted:#8A93A1; --faint:#5F6876; --line:#262E3B; --line-2:#1F2631;
  --brand:#3FB7A0; --brand-2:#2F9C88; --brand-tint:#10302A; --on-brand:#04140F;
  --good:#40C48D; --good-tint:#0F2A1F; --warn:#D79A46; --warn-tint:#2A2214; --bad:#E0736F; --bad-tint:#2C171A;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c-other:#5E6672;
  --under:57,135,229; --over:217,89,38; --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 18px 48px -18px rgba(0,0,0,.7); }

*{ box-sizing:border-box;}
body{ margin:0; background:var(--canvas); color:var(--fg); font:var(--t-m)/1.5 "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;}
button, input, select, textarea{ font:inherit; color:inherit;}
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:4px;}
.serif{ font-family:"Newsreader", Georgia, serif; font-weight:500; letter-spacing:-.01em;}
.k{ font-size:var(--t-xs); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
.sub{ color:var(--muted); font-size:var(--t-s);}
.num{ font-variant-numeric:tabular-nums;}
.up{ color:var(--good);} .down{ color:var(--bad);} .flat{ color:var(--muted);}
.btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper); border-radius:var(--r-s); padding:7px 12px; cursor:pointer; font-weight:600; font-size:13px; white-space:nowrap;}
.btn:hover{ border-color:var(--brand); background:var(--hover);}
.btn.primary{ background:var(--brand); border-color:var(--brand); color:var(--on-brand);} .btn.primary:hover{ background:var(--brand-2);}
.btn.ghost{ border-color:transparent; background:none;} .btn.ghost:hover{ background:var(--hover);}
.btn.sm{ padding:4px 9px; font-size:12px;}
.btn:disabled{ opacity:.45; cursor:not-allowed;}
.link{ border:0; background:none; padding:0; color:var(--brand); font-weight:600; cursor:pointer;}
.pill{ display:inline-flex; align-items:center; gap:4px; font-size:var(--t-xs); font-weight:700; border-radius:999px; padding:2px 8px; line-height:1.5;}
.pill.good{ background:var(--good-tint); color:var(--good);} .pill.warn{ background:var(--warn-tint); color:var(--warn);} .pill.bad{ background:var(--bad-tint); color:var(--bad);} .pill.neutral{ background:var(--inset); color:var(--fg-2);}

/* ---------- shell ---------- */
.top{ position:sticky; top:0; z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:12px 20px; background:var(--paper); border-bottom:1px solid var(--line);}
.brand{ display:flex; align-items:center; gap:10px;}
.brand .mark{ width:30px; height:30px; border-radius:8px; background:var(--brand); color:var(--on-brand); display:grid; place-items:center;}
.brand b{ display:block; font-size:15px; line-height:1.15;} .brand span{ font-size:var(--t-xs); color:var(--muted);}
.hhsel{ display:flex; align-items:center; gap:8px; padding-left:18px; border-left:1px solid var(--line);}
.hhsel select{ padding:6px 30px 6px 10px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--paper); font-weight:600; max-width:280px;}
.facts{ display:flex; flex-wrap:wrap; gap:4px 16px; font-size:var(--t-s); color:var(--fg-2);} .facts b{ color:var(--fg);}
.grow{ flex:1;}
.proto{ font-size:var(--t-xs); font-weight:700; color:var(--warn); background:var(--warn-tint); border-radius:999px; padding:3px 10px;}
.layout{ display:grid; grid-template-columns:236px minmax(0,1fr) 372px; gap:16px; padding:16px 20px 48px; max-width:1680px; margin:0 auto; align-items:start;}
.layout > *{ min-width:0;}
.card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--sh-1);}
.pad{ padding:var(--s5);}

/* ---------- journey ---------- */
.journey{ position:sticky; top:72px; padding:8px 0;}
.journey .grp{ padding:12px 16px 4px;}
.step{ display:grid; grid-template-columns:14px 1fr; column-gap:10px; width:100%; text-align:left; border:0; background:none; cursor:pointer; padding:8px 14px 8px 13px; border-left:3px solid transparent;}
.step:hover{ background:var(--hover);}
.step[aria-current="true"]{ background:var(--brand-tint); border-left-color:var(--brand);}
.step .t{ font-weight:600; font-size:13.5px; line-height:1.3;}
.step .v{ grid-column:2; font-size:12px; color:var(--muted); line-height:1.35; margin-top:2px;}
.dot{ width:10px; height:10px; border-radius:50%; margin-top:4px; display:inline-block;}
.dot.act{ background:var(--bad);} .dot.look{ background:var(--warn);} .dot.ok{ background:var(--good);} .dot.none{ background:var(--line);} .dot.nav{ background:none; border:2px solid var(--faint); width:10px; height:10px;}
.step .badge{ display:inline-block; margin-left:6px; font-size:10.5px; font-weight:700; color:var(--brand); background:var(--brand-tint); border-radius:999px; padding:0 6px;}

/* ---------- stage ---------- */
.stage-h{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 16px; padding:var(--s5) var(--s5) 0;}
.stage-h h1{ font-size:var(--t-xxl); margin:0; line-height:1.15;}
.stage-h .uc{ flex-basis:100%; margin:4px 0 0; color:var(--muted); font-size:var(--t-s); max-width:760px;}
.lede{ font-size:17px; line-height:1.5; margin:var(--s4) var(--s5) 0; max-width:880px;}
.lede b{ font-weight:700;}
.sec{ padding:var(--s4) var(--s5) 0;}
.sec:last-child{ padding-bottom:var(--s5);}
.sec-h{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
.grid2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s4);}
.panel{ border:1px solid var(--line-2); border-radius:var(--r-m); padding:var(--s4); background:var(--paper);}
.panel.soft{ background:var(--paper-2);}
.split{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--s5); align-items:center;}

/* segmented and toggles */
.seg{ display:inline-flex; background:var(--inset); border-radius:8px; padding:3px; gap:2px;}
.seg button{ border:0; background:none; padding:5px 11px; border-radius:6px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--fg-2);}
.seg button[aria-pressed="true"]{ background:var(--paper); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.12);}
.tog{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; font-weight:600; color:var(--fg-2); user-select:none;}
.tog input{ appearance:none; width:34px; height:20px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; margin:0; flex:none; transition:background .15s;}
.tog input::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
.tog input:checked{ background:var(--brand);} .tog input:checked::after{ left:16px;}
.adjust{ display:flex; flex-wrap:wrap; gap:14px 24px; align-items:flex-end; padding:var(--s4); background:var(--paper-2); border:1px solid var(--line-2); border-radius:var(--r-m);}
.ctl{ display:flex; flex-direction:column; gap:6px; min-width:160px;}
.ctl > label, .ctl > .lab{ font-size:12px; font-weight:600; color:var(--fg-2);}
.ctl .val{ color:var(--fg); font-weight:700;}
.ctl input[type=range]{ width:220px; accent-color:var(--brand);}
.ctl input[type=number], .ctl input[type=text], .ctl select{ padding:6px 9px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--paper); width:160px;}
.chips{ display:flex; flex-wrap:wrap; gap:6px;}
.chip{ border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:3px 11px; font-size:12px; font-weight:600; cursor:pointer;}
.chip[aria-pressed="true"]{ background:var(--brand-tint); border-color:var(--brand); color:var(--brand);}
.chip.lock[aria-pressed="true"]{ background:var(--warn-tint); border-color:var(--warn); color:var(--warn);}

/* stat tiles */
.stats{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px;}
.stat{ border:1px solid var(--line-2); border-radius:var(--r-m); padding:10px 12px; background:var(--paper);}
.stat .l{ font-size:11px; font-weight:600; color:var(--muted); display:flex; gap:4px; align-items:center;}
.stat .v{ font-size:19px; font-weight:700; margin-top:2px; line-height:1.2;}
.stat .d{ font-size:12px; margin-top:2px;}
.i{ display:inline-grid; place-items:center; width:14px; height:14px; border-radius:50%; border:1px solid var(--faint); color:var(--muted); font-size:9px; font-weight:700; cursor:help;}

/* charts */
.chart{ display:block; overflow:visible;}
.chart .hit{ cursor:pointer;} .chart .hit:hover{ filter:brightness(1.08);} .chart g.hit:hover rect{ stroke:var(--fg); stroke-width:1.5;}
.chart .hl rect{ stroke:var(--fg); stroke-width:2;}
.c-big{ font-size:20px; font-weight:700; fill:var(--fg);} .c-sub{ font-size:11px; fill:var(--muted);} .c-ax{ font-size:10.5px; fill:var(--muted);}
.t-l{ font-size:12px; font-weight:700; fill:#fff; pointer-events:none;} .t-s{ font-size:10.5px; fill:rgba(255,255,255,.9); pointer-events:none;}
.g-rail{ fill:var(--inset);} .g-band{ fill:rgba(11,122,75,.28);}
.g-today{ stroke:var(--fg); stroke-width:3; stroke-linecap:round;} .g-after{ stroke:var(--brand); stroke-width:4; stroke-linecap:round;}
.r-today{ fill:var(--fg-2);} .r-after{ fill:var(--brand);}
.w-l{ font-size:11.5px; fill:var(--fg-2);} .w-l.b{ font-weight:700; fill:var(--fg);} .w-v{ font-size:11.5px; fill:var(--fg-2); font-weight:600;} .w-v.b{ fill:var(--fg); font-weight:700;}
.w-total{ fill:var(--faint);} .w-total.end{ fill:var(--fg-2);} .w-good{ fill:var(--good);} .w-bad{ fill:var(--bad);} .w-band{ fill:rgba(11,122,75,.10);}
.grid{ stroke:var(--line-2); stroke-width:1;}
.d-link{ stroke:var(--faint); stroke-width:2;} .d-a{ fill:var(--paper); stroke:var(--fg-2); stroke-width:2;} .d-b{ fill:var(--brand); stroke:var(--paper); stroke-width:2;} .d-target{ stroke:var(--c4); stroke-width:3; stroke-linecap:round;}
#tip{ position:fixed; z-index:90; pointer-events:none; background:var(--fg); color:var(--paper); font-size:12px; padding:6px 9px; border-radius:6px; max-width:280px; opacity:0; transition:opacity .08s; box-shadow:var(--sh-2);}
.legend{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11.5px; color:var(--fg-2);}
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px;}
.legend i.ring{ border-radius:50%; background:var(--paper); border:2px solid var(--fg-2);} .legend i.fill{ border-radius:50%; background:var(--brand);} .legend i.tick{ width:3px; border-radius:1px; background:var(--c4);}
.crumbs{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:12.5px;}
.crumbs button{ border:0; background:none; color:var(--brand); font-weight:600; cursor:pointer; padding:0;}
.crumbs span{ color:var(--faint);}

/* tables */
.tbl{ width:100%; border-collapse:collapse; font-size:12.5px;}
.tbl th{ font-size:11px; font-weight:600; color:var(--muted); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line);}
.tbl td{ padding:7px 8px; border-bottom:1px solid var(--line-2); vertical-align:middle;}
.tbl .r{ text-align:right;}
.tbl tr.click{ cursor:pointer;} .tbl tr.click:hover td{ background:var(--hover);}
.sw{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:8px; vertical-align:-1px;}
.tw{ overflow-x:auto;}
.ticker{ font-weight:700;} .nm{ color:var(--muted); font-size:11.5px; display:block;}
.act-s{ color:var(--bad); font-weight:700; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase;} .act-b{ color:var(--good); font-weight:700; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase;} .act-n{ color:var(--warn); font-weight:700; font-size:10.5px; text-transform:uppercase;}

/* heat maps */
.heat{ display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:6px;}
.cell{ position:relative; border:1px solid var(--line-2); border-radius:var(--r-s); padding:9px 10px; text-align:left; background:var(--paper); cursor:pointer; min-height:78px;}
.cell .n{ font-size:12px; font-weight:600; line-height:1.25;} .cell .d{ font-size:17px; font-weight:700; margin-top:3px;} .cell .s{ font-size:11px; color:var(--fg-2);}
.cell[aria-pressed="true"]{ outline:2px solid var(--brand); outline-offset:1px;}
.cell .fav{ position:absolute; top:6px; right:8px; color:var(--c4); font-size:12px;}
.scale{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-top:8px;}
.scale i{ display:inline-block; width:96px; height:8px; border-radius:4px; background:linear-gradient(90deg, rgba(var(--under),.55), rgba(var(--under),.08), var(--inset), rgba(var(--over),.08), rgba(var(--over),.55));}
.box{ display:grid; grid-template-columns:56px repeat(3, minmax(0,1fr)); gap:5px; max-width:420px;}
.box .hd{ font-size:11px; color:var(--muted); font-weight:600; text-align:center;} .box .rl{ font-size:11px; color:var(--muted); font-weight:600; align-self:center;}
.box .cell{ min-height:60px; text-align:center;}

/* preview of a change */
.preview{ border:1px solid var(--line-2); border-radius:var(--r-m); background:var(--paper); margin-top:12px; overflow:hidden;}
.preview .ph{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; padding:10px 14px; background:var(--paper-2); border-bottom:1px solid var(--line-2);}
.preview .pe{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--fg-2);}
.preview .pe b{ color:var(--fg);}
.preview .pf{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; border-top:1px solid var(--line-2);}
.preview .tbl td{ padding:6px 14px;} .preview .tbl th{ padding:6px 14px;}

/* investment picker */
.fh{ width:100%; border-collapse:separate; border-spacing:3px; font-size:12px;}
.fh th{ font-size:10.5px; color:var(--muted); font-weight:600; text-align:center; padding:2px 4px; vertical-align:bottom; line-height:1.25;}
.fh th:first-child{ text-align:left;}
.fh td{ padding:7px 7px; border-radius:5px; text-align:center; white-space:nowrap;}
.fh td.fn{ text-align:left; white-space:normal; cursor:pointer; min-width:150px;}
.fh tr[aria-selected="true"] td.fn{ box-shadow:inset 3px 0 0 var(--brand); background:var(--brand-tint);}
.star{ border:0; background:none; cursor:pointer; font-size:16px; line-height:1; color:var(--faint); padding:0 4px;}
.star[aria-pressed="true"]{ color:var(--c4);}
.doc{ border-left:3px solid var(--brand); background:var(--paper-2); border-radius:0 var(--r-s) var(--r-s) 0; padding:10px 12px; margin:8px 0; font-size:12.5px;}
.doc .dk{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
.facts-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:6px; margin:8px 0;}
.facts-grid div{ background:var(--paper-2); border-radius:6px; padding:6px 8px; font-size:11px; color:var(--muted);}
.facts-grid b{ display:block; font-size:13px; color:var(--fg);}

/* side panel: proposals */
.side{ position:sticky; top:72px; max-height:calc(100vh - 88px); display:flex; flex-direction:column; overflow:hidden;}
.side .sh{ padding:14px 16px 10px; border-bottom:1px solid var(--line-2);}
.side .sb{ padding:12px 16px; overflow:auto; flex:1;}
.side .sf{ padding:12px 16px; border-top:1px solid var(--line-2); display:flex; gap:8px; flex-wrap:wrap;}
.ptabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.ptab{ border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:4px 10px; font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
.ptab[aria-selected="true"]{ border-color:var(--brand); background:var(--brand-tint); color:var(--brand);}
.ptab .n{ font-size:10.5px; color:var(--muted); font-weight:600;}
.pname{ display:flex; align-items:center; gap:6px; margin-top:10px;}
.pname input{ flex:1; border:1px solid transparent; background:none; font-weight:700; font-size:15px; padding:2px 4px; border-radius:4px;}
.pname input:hover, .pname input:focus{ border-color:var(--line); background:var(--paper);}
.kpis{ display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.kpi{ text-align:left; border:1px solid var(--line-2); border-radius:var(--r-s); padding:7px 9px; background:var(--paper-2); cursor:pointer;}
.kpi:hover{ border-color:var(--faint);} .kpi[aria-pressed="true"]{ border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand); background:var(--paper);}
.kpi .l{ font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted);}
.kpi .v{ font-weight:700; font-size:13.5px; line-height:1.3;}
.kpi .v .to{ color:var(--muted); font-weight:500;}
.kpi .d{ font-size:11px; font-weight:600;}
.kpi.bad{ border-color:var(--bad); background:var(--bad-tint);} .kpi.warn{ border-color:var(--warn); background:var(--warn-tint);}
.meter{ height:5px; border-radius:3px; background:var(--inset); margin-top:4px; overflow:hidden;} .meter i{ display:block; height:100%; background:var(--brand);} .meter.over i{ background:var(--bad);}
.why{ margin-top:12px; border:1px solid var(--line-2); border-radius:var(--r-m); padding:10px 12px;}
.why p{ margin:4px 0 8px; font-size:12.5px; color:var(--fg-2);}
.groups{ margin-top:12px;}
.group{ border:1px solid var(--line-2); border-radius:var(--r-m); margin-bottom:8px; overflow:hidden;}
.group .gh{ display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--paper-2); font-size:12.5px; font-weight:700;}

.empty{ color:var(--muted); font-size:12.5px; padding:6px 0;}

/* compare & client summary */
.cmp{ display:grid; gap:12px;}
.cmp-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
.pcard{ border:1px solid var(--line); border-radius:var(--r-l); padding:14px; background:var(--paper); display:flex; flex-direction:column; gap:8px;}
.pcard.sel{ border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand);}

.rows div span:first-child{ color:var(--muted);}

.sum-doc textarea{ width:100%; min-height:260px; border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px; background:var(--paper); line-height:1.55; font-size:13.5px; resize:vertical;}
.disc{ font-size:11.5px; color:var(--muted); border-top:1px solid var(--line-2); margin-top:16px; padding-top:10px;}

/* sheet */
.scrim{ position:fixed; inset:0; background:rgba(10,14,20,.42); z-index:50; display:none;} .scrim.on{ display:block;}
.sheet{ position:fixed; top:0; right:0; bottom:0; width:min(860px, 100vw); background:var(--paper); z-index:51; box-shadow:var(--sh-2); transform:translateX(105%); transition:transform .2s ease; display:flex; flex-direction:column;}

.sheet .bb{ padding:16px 22px 24px; overflow:auto; flex:1;}
.sheet .ff{ padding:12px 22px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.close{ float:right; border:0; background:none; font-size:22px; color:var(--muted); cursor:pointer; line-height:1;}
.tabs{ display:flex; gap:2px; margin-top:12px;}
.tabs button{ border:0; background:none; padding:9px 12px; font-weight:600; font-size:13px; color:var(--fg-2); border-bottom:2px solid transparent; cursor:pointer;}
.tabs button[aria-selected="true"]{ color:var(--fg); border-bottom-color:var(--brand);}
.ck{ list-style:none; padding:0; margin:0;}
.ck li{ display:grid; grid-template-columns:22px 1fr; gap:6px; padding:8px 0; border-bottom:1px solid var(--line-2); font-size:13px;}
.ck .ic{ font-weight:800;} .ck .ok .ic{ color:var(--good);} .ck .no .ic{ color:var(--bad);}
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--fg); color:var(--paper); padding:9px 14px; border-radius:8px; font-size:13px; z-index:95; opacity:0; transition:opacity .2s; pointer-events:none;}
.toast.on{ opacity:1;}
.mob{ display:none;}

@media (max-width:1320px){

  .journey .grp{ display:none;}
  .step{ min-width:170px; border-left:0; border-bottom:3px solid transparent;} .step[aria-current="true"]{ border-bottom-color:var(--brand);}

}

  .side.open{ transform:none;} .mob{ display:inline-flex;}
  .facts{ display:none;} .hhsel{ border-left:0; padding-left:0;} .top{ padding:10px 12px;}
  .ctl{ min-width:0; flex:1 1 150px;} .ctl input[type=range]{ width:100%;}

}
@media print{ .top, .journey, .side, .no-print{ display:none !important;} .layout{ display:block;} .card{ box-shadow:none; border:0;} }
svg text{ pointer-events:none;}

.b-band{ fill:rgba(11,122,75,.16);} .b-in{ fill:var(--paper); stroke:var(--fg-2); stroke-width:2;} .b-out{ fill:var(--bad); stroke:var(--paper); stroke-width:2;}

/* ---------- v2: decision-first components ---------- */
.b-out{ fill:var(--warn) !important;}
.sum{ border:1px solid var(--line); border-radius:var(--r-l); padding:16px 18px; background:var(--paper); box-shadow:var(--sh-1); border-top:3px solid var(--brand);}
.sum-h{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.finding{ font-size:21px; line-height:1.3; margin:8px 0 4px;}
.why-t{ margin:0 0 10px; color:var(--fg-2); font-size:13.5px; max-width:820px;}
.gates{ display:grid; gap:6px; margin:8px 0 10px;}
.gate{ border-radius:var(--r-s); padding:7px 10px; font-size:12.5px; border:1px solid;}
.gate.bad{ background:var(--bad-tint); border-color:var(--bad); color:var(--bad);} .gate.warn{ background:var(--warn-tint); border-color:var(--warn); color:var(--warn);}
.gate.sm{ font-size:11.5px; padding:5px 8px; margin-top:6px;}

.ev3 > div{ background:var(--paper-2); border-radius:var(--r-s); padding:8px 10px; font-size:12.5px; color:var(--fg-2); border:1px solid var(--line-2);}
.ev3 .k{ display:block; min-height:0;} .ev3 .k:empty{ display:none;}
.sum-grid{ display:grid; grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr); gap:16px;}
.tw-warn{ color:var(--warn); font-weight:600;}
.choice{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; background:var(--paper);}
.choice em{ font-style:normal; font-weight:600; font-size:10.5px; color:var(--muted);}
.choice.rec{ border-color:var(--brand); background:var(--brand-tint); color:var(--brand);} .choice.rec em{ color:var(--brand);}
.choice.blk{ color:var(--faint); text-decoration:line-through; text-decoration-color:var(--bad);} .choice.blk em{ color:var(--bad); text-decoration:none;}
.next{ margin-top:12px; padding:10px 12px; border-radius:var(--r-m); background:var(--brand-tint); border:1px solid color-mix(in srgb, var(--brand) 30%, transparent);}
.next > div:first-of-type{ font-weight:600; font-size:13.5px; margin-top:2px;}
.dx{ border:1px solid var(--line-2); border-radius:var(--r-m); margin-bottom:8px; background:var(--paper);}
.dx > summary{ list-style:none; cursor:pointer; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; padding:11px 14px; }
.dx > summary::-webkit-details-marker{ display:none;}
.dx > summary::before{ content:"▸"; color:var(--muted); font-size:11px; transition:transform .15s; display:inline-block;}
.dx[open] > summary::before{ transform:rotate(90deg);}
.dx > summary:hover{ background:var(--hover);}
.dx-t{ font-weight:700; font-size:13.5px;}
.dx-b{ padding:4px 14px 14px;}
.dx.inline{ border:0; margin:6px 0 0; background:none;} .dx.inline > summary{ padding:6px 0;}
.about{ background:var(--paper-2); border-radius:var(--r-s); padding:8px 10px; color:var(--fg-2) !important;}

.act-pill.good{ background:var(--good-tint); color:var(--good);} .act-pill.warn{ background:var(--warn-tint); color:var(--warn);} .act-pill.bad{ background:var(--bad-tint); color:var(--bad);} .act-pill.info{ background:color-mix(in srgb, var(--c1) 14%, var(--paper)); color:var(--c1);}
.pill.info{ background:color-mix(in srgb, var(--c1) 14%, var(--paper)); color:var(--c1);}

@media (max-width:880px){ .ev3, .sum-grid{ grid-template-columns:1fr;} .finding{ font-size:18px;} }

/* ---------- v3: readiness, assumptions, queue groups, phone ---------- */
.assum{ margin:6px 0 0; font-size:12px; color:var(--fg-2); display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline;}

.lstep .ic{ display:grid; place-items:center; width:20px; height:20px; border-radius:50%; font-size:11px; font-weight:800; flex:none;}
.lstep.ready .ic{ background:var(--good-tint); color:var(--good);} .lstep.pending .ic{ background:var(--warn-tint); color:var(--warn);} .lstep.blocked .ic{ background:var(--bad-tint); color:var(--bad);}

.tradeoff{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px;} .tradeoff p{ margin:4px 0 0; font-size:13px;} .tradeoff .stayr{ margin-top:0;}
.tbl.q th:nth-child(1){ width:40%;} .tbl.q th:nth-child(2){ width:22%;} .tbl.q th:nth-child(3){ width:26%;} .tbl.q th:nth-child(4){ width:12%;}
.tbl.q th:nth-child(5), .tbl.q th:nth-child(6){ width:auto;}
.qgrp td{ background:var(--paper-2); font-weight:700; font-size:12px; letter-spacing:.03em; text-transform:uppercase; color:var(--fg-2);}
.reld{ margin-top:3px;} .reld summary{ font-size:11px; color:var(--brand); cursor:pointer; font-weight:600;}
.act-pill.xs{ font-size:10px; padding:1px 6px; margin-top:4px;}
@media (max-width:880px){
  .wstabs{ flex-wrap:nowrap; overflow-x:auto; width:100%; padding-bottom:2px;} .wstabs button{ flex:none;}

.assum.ctrls{ gap:6px 8px; align-items:center;} .seg.sm button{ padding:3px 9px; font-size:11.5px;}

.sum-h{ flex-wrap:wrap; gap:6px 12px;}
.proto-tag{ font-size:10px; font-weight:700; letter-spacing:.03em; color:var(--warn); text-transform:uppercase; margin-left:4px;}

<script>/* ================= Portfolio math for the prototype =================
 * The same formulas as the Python engine (app/cio.py stats, app/portfolio.py exposures and stress), applied in the page so every
 * slider and toggle updates at once. Expected return and risk come from the capital market assumptions; historical event returns
 * per holding were computed by the engine; tax uses the lots on file (losses first, then long-term lots with the smallest gain,
 * short-term last; lots without cost basis are never sold). Illustrative.
 */
const EQ = ['LCG', 'LCV', 'SMID', 'INTL', 'EM'];
const GROUP_OF = {LCG: 'equity', LCV: 'equity', SMID: 'equity', INTL: 'equity', EM: 'equity', UST: 'fixed', IGC: 'fixed', HY: 'fixed', CASH: 'cash', HF: 'alt', PE: 'alt'};
const GROUPS = [['equity', 'Equity'], ['fixed', 'Fixed income'], ['cash', 'Cash'], ['alt', 'Alternatives']];
const E = {
  corr(a, b){ if(a === b) return 1; const c = DATA.corr; return c[a + '|' + b] ?? c[b + '|' + a] ?? 0; },
  weights(hs){
    const by = {}; let ct = 0, un = 0;
    for(const h of hs){ const cl = h.classes || {}; const keys = Object.keys(cl); if(!keys.length){ un += h.mv; continue; }
      ct += h.mv; for(const k of keys) by[k] = (by[k] || 0) + h.mv * cl[k]; }
    const w = {}; for(const k in by) w[k] = ct ? by[k] / ct : 0;
    return {w, ct, total: ct + un};
  },
  groups(w){ const g = {equity: 0, fixed: 0, cash: 0, alt: 0}; for(const k in w) g[GROUP_OF[k]] += w[k]; return g; },
  stats(w){
    const C = DATA.classes; let er = 0, v = 0;
    for(const a in w){ er += w[a] * C[a].er; for(const b in w) v += w[a] * w[b] * C[a].vol * C[b].vol * E.corr(a, b); }
    return {er, vol: Math.sqrt(Math.max(v, 0))};
  },
  stress(hs){
    const out = {}; let ct = 0; for(const h of hs) if(Object.keys(h.classes || {}).length) ct += h.mv;
    for(const sc of DATA.scenarios){ let p = 0; for(const h of hs) if(Object.keys(h.classes || {}).length) p += h.mv * (h.scret[sc.id] || 0); out[sc.id] = ct ? p / ct : 0; }
    return out;
  },
  contributors(hs, sid){
    return hs.filter(h => Object.keys(h.classes || {}).length).map(h => ({sym: h.sym, pnl: h.mv * (h.scret[sid] || 0)})).reduce((m, r) => { m[r.sym] = (m[r.sym] || 0) + r.pnl; return m; }, {});
  },
  income(hs){ return hs.reduce((s, h) => s + h.mv * (h.yield || 0), 0); },
  names(hs){                                           // single-name exposure including what funds hold
    const n = {}, tot = hs.reduce((s, h) => s + h.mv, 0);
    for(const h of hs){ if(h.kind === 'stock') n[h.sym] = (n[h.sym] || 0) + h.mv; for(const [s, w] of Object.entries(h.top_holdings || {})) n[s] = (n[s] || 0) + h.mv * w; }
    for(const k in n) n[k] /= tot || 1; return n;
  },
  sectors(hs){                                         // share of equity by sector
    const s = {}; let eq = 0;
    for(const h of hs){ const share = EQ.reduce((a, k) => a + ((h.classes || {})[k] || 0), 0) * h.mv; if(!share) continue; eq += share;
      const sw = h.sector ? {[h.sector]: 1} : (h.sectors || {}); const t = Object.values(sw).reduce((a, b) => a + b, 0) || 1;
      for(const [k, v] of Object.entries(sw)) s[k] = (s[k] || 0) + share * v / t; }
    for(const k in s) s[k] /= eq || 1; return s;
  },
  styleBox(hs){                                        // US equity style box
    const b = {}; let t = 0;
    for(const h of hs){ const us = ['LCG', 'LCV', 'SMID'].reduce((a, k) => a + ((h.classes || {})[k] || 0), 0) * h.mv; if(!us || !h.style_box) continue;
      const sw = Object.values(h.style_box).reduce((a, x) => a + x, 0) || 1;
      for(const [c, v] of Object.entries(h.style_box)){ b[c] = (b[c] || 0) + us * v / sw; t += us * v / sw; } }
    for(const k in b) b[k] /= t || 1; return b;
  },
  /* lots in the order the engine sells them; returns the gain and tax of selling `amount` of a symbol (across its positions) */
  sellPlan(hh, hs, sym, amount){
    const rates = hh.rates, lots = [];
    hs.forEach((h, i) => { if(h.sym !== sym) return; (h.lots || []).forEach((l, j) => { if(l.mv > 0.5) lots.push({i, j, l, g: l.cost == null ? null : (l.mv - l.cost) / l.mv}); }); });
    const sellable = lots.filter(x => x.g != null);
    const rank = x => x.g < 0 ? -10 + x.g : (x.l.term === 'ST' ? 10 : 0) + x.g;
    sellable.sort((a, b) => rank(a) - rank(b));
    let left = amount, gain = 0, tax = 0; const used = [];
    for(const x of sellable){ if(left <= 0.5) break; const take = Math.min(left, x.l.mv); const f = take / x.l.mv, gn = (x.l.mv - x.l.cost) * f;
      gain += gn; tax += rates.taxable ? gn * (x.l.term === 'ST' ? rates.st : rates.lt) : 0; used.push({...x, take}); left -= take; }
    return {gain, tax, used, unfilled: Math.max(0, left), excluded: lots.filter(x => x.g == null).reduce((s, x) => s + x.l.mv, 0)};
  },
  fundAsHolding(sym, amount){
    const f = DATA.funds[sym]; if(!f) return null;
    return {sym, name: f.name, kind: f.kind, mv: amount, tradable: true, classes: f.classes, sectors: f.sectors || null, sector: f.sector || null, yield: f.yield || 0, top_holdings: f.top_holdings || null,
            expense_bps: f.expense_bps, holdings_count: f.holdings_count, top10_share: f.top10_share,
            style_box: f.style_box, region: f.region, scret: f.scret, lots: [{id: sym + ' (new)', cost: amount, mv: amount, term: 'ST'}], bought: true};
  },
  /* apply the proposal: sells first (tax lots), then buys paid from proceeds and today's cash; stage-2 buys use the incoming cash */
  apply(hh, tray){
    const hs = hh.holdings.map(h => ({...h, lots: (h.lots || []).map(l => ({...l}))}));
    let proceeds = 0, gain = 0, tax = 0, unmatched = [], soldBy = {};
    for(const t of tray.filter(t => t.action === 'sell')){
      const p = E.sellPlan(hh, hs, t.sym, t.amount);
      for(const u of p.used){ const h = hs[u.i], l = h.lots[u.j], f = u.take / l.mv; if(l.cost != null) l.cost *= (1 - f); l.mv -= u.take; h.mv -= u.take; }
      proceeds += t.amount - p.unfilled; gain += p.gain; tax += p.tax; soldBy[t.sym] = (soldBy[t.sym] || 0) + t.amount;
      t._gain = p.gain; t._tax = p.tax; t._unfilled = p.unfilled;
      if(p.unfilled > 1) unmatched.push(`${t.sym}: ${money(p.unfilled)} more than can be sold (held, or with cost basis)`);
    }
    const buys1 = tray.filter(t => t.action === 'buy' && t.stage !== 2), buys2 = tray.filter(t => t.action === 'buy' && t.stage === 2);
    let need = buys1.reduce((s, t) => s + t.amount, 0) - proceeds, cashUsed = 0;
    const cashH = hs.filter(h => h.cash);
    if(need > 0){ for(const h of cashH){ const a = Math.min(h.mv, need); h.mv -= a; need -= a; cashUsed += a; } }
    else if(need < 0){ let c = hs.find(h => h.sym === 'CASH'); if(!c){ c = {sym: 'CASH', name: 'Cash', kind: 'cash', cash: true, mv: 0, classes: {CASH: 1}, yield: 0.04, scret: {}, lots: []}; hs.push(c); } c.mv += -need; need = 0; }
    const shortfall = Math.max(0, need);
    for(const t of buys1){ const nh = E.fundAsHolding(t.sym, t.amount); if(nh) hs.push(nh); }
    const inc = hh.incoming && hh.incoming.amount || 0, stage2 = buys2.reduce((s, t) => s + t.amount, 0);
    for(const t of buys2){ const nh = E.fundAsHolding(t.sym, t.amount); if(nh) hs.push(nh); }
    if(stage2 && inc > stage2){ let c = hs.find(h => h.sym === 'CASH'); if(c) c.mv += inc - stage2; }
    const sells = tray.filter(t => t.action === 'sell').reduce((s, t) => s + t.amount, 0);
    return {hs: hs.filter(h => h.mv > 0.5), proceeds, gain, tax, shortfall, stage2, stage2Over: Math.max(0, stage2 - inc), unmatched, soldBy, sells,
            buys: buys1.reduce((s, t) => s + t.amount, 0) + stage2};
  },
  te(w1, w2){ const ks = [...new Set([...Object.keys(w1), ...Object.keys(w2)])], C = DATA.classes; let v = 0;
    for(const a of ks) for(const b of ks) v += ((w1[a] || 0) - (w2[a] || 0)) * ((w1[b] || 0) - (w2[b] || 0)) * C[a].vol * C[b].vol * E.corr(a, b); return Math.sqrt(Math.max(v, 0)); },
  expense(hs){ const t = hs.reduce((s, h) => s + h.mv, 0) || 1; return hs.reduce((s, h) => s + h.mv * (h.expense_bps || 0), 0) / t; },
  underlying(hs){ const seen = new Set(); let n = 0; for(const h of hs){ if(h.kind === 'stock') seen.add(h.sym); else if(h.holdings_count) n = Math.max(n, 0) + h.holdings_count; } return seen.size + n; },
  /* trees for the drill-down: L1 group → L2 asset class → L3 holding (look-through by class weights); sector → holding */
  classTree(hs){
    const L2 = {}, tot = hs.reduce((s, h) => s + h.mv, 0) || 1;
    for(const h of hs){ const cl = h.classes || {}; const ks = Object.keys(cl); if(!ks.length){ (L2._un = L2._un || {v: 0, items: {}}).v += h.mv; L2._un.items[h.sym] = (L2._un.items[h.sym] || 0) + h.mv; continue; }
      for(const k of ks){ const v = h.mv * cl[k]; (L2[k] = L2[k] || {v: 0, items: {}}).v += v; L2[k].items[h.sym] = (L2[k].items[h.sym] || 0) + v; } }
    return {L2, tot};
  },
  sectorTree(hs){
    const out = {}; let eq = 0;
    for(const h of hs){ const share = EQ.reduce((a, k) => a + ((h.classes || {})[k] || 0), 0) * h.mv; if(!share) continue; eq += share;
      const sw = h.sector ? {[h.sector]: 1} : (h.sectors || {}); const t = Object.values(sw).reduce((a, b) => a + b, 0) || 1;
      for(const [k, v] of Object.entries(sw)){ const x = share * v / t; (out[k] = out[k] || {v: 0, items: {}}).v += x; out[k].items[h.sym] = (out[k].items[h.sym] || 0) + x; } }
    return {S: out, eq};
  },
  metrics(hh, hs){
    const {w, ct, total} = E.weights(hs), st = E.stats(w), str = E.stress(hs), nm = E.names(hs);
    const worst = DATA.scenarios.reduce((a, s) => str[s.id] < str[a.id] ? s : a, DATA.scenarios[0]);
    const top = Object.entries(nm).sort((a, b) => b[1] - a[1])[0] || ['—', 0];
    return {w, g: E.groups(w), er: st.er, vol: st.vol, sharpe: st.vol ? (st.er - DATA.rf) / st.vol : null, stress: str, worst: worst.id, income: E.income(hs), names: nm, top, sectors: E.sectors(hs), hy: w.HY || 0, total, ct,
            te_t: E.te(w, hh.target), te_m: E.te(w, hh.model_w), expense: E.expense(hs), yld: E.income(hs) / (total || 1), avgLoss: DATA.scenarios.reduce((s, x) => s + str[x.id], 0) / DATA.scenarios.length};
  },
};

<script>/* ================= Small SVG chart kit (no library, works offline) =================
 * donut / sunburst (part-to-whole with drill), treemap (holdings), gauge (risk against its band), waterfall (why a figure
 * changes), dumbbell rows (today → proposal against a target tick), ring (progress toward an objective).
 * Colors are roles from the stylesheet (--c1..--c8 categorical, fixed order; --c-other for the folded tail). Every chart has a
 * hover tooltip (data-tip) and its numbers are also shown as text next to it.
 */
const CH = {
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])),
  arc(cx, cy, r0, r1, a0, a1){
    const p = (r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)], big = a1 - a0 > Math.PI ? 1 : 0;
    if(a1 - a0 >= 2 * Math.PI - 1e-6) a1 = a0 + 2 * Math.PI - 1e-4;
    const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
    return `M${x0},${y0}A${r1},${r1} 0 ${big} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${big} 0 ${x3},${y3}Z`;
  },
  /* segs: [{id, label, value, color, tip, drill}] ; ring of one level */
  ctr(cx, cy, rHole, big, sub, base){
    const fs = Math.min(base, rHole * 1.5 / (Math.max(3, String(big || '').length) * 0.56)), ss = Math.max(9, Math.min(12, fs * 0.55));
    return (big ? `<text x="${cx}" y="${cy + (sub ? -fs * 0.08 : fs * 0.35)}" text-anchor="middle" class="c-big" style="font-size:${fs.toFixed(1)}px">${CH.esc(big)}</text>` : '') +
      (sub ? `<text x="${cx}" y="${cy + fs * 0.35 + ss + 2}" text-anchor="middle" class="c-sub" style="font-size:${ss.toFixed(1)}px">${CH.esc(sub)}</text>` : '');
  },
  donut(segs, o = {}){
    const S = o.size || 220, cx = S / 2, cy = S / 2, r1 = S / 2 - 4, r0 = r1 * (o.hole ?? 0.62), tot = segs.reduce((s, x) => s + Math.max(0, x.value), 0) || 1;
    let a = 0; const gap = segs.length > 1 ? 0.012 : 0;
    const paths = segs.filter(x => x.value > 0).map(x => { const da = x.value / tot * 2 * Math.PI, d = CH.arc(cx, cy, r0, r1, a + gap / 2, a + da - gap / 2); a += da;
      return `<path d="${d}" fill="${x.color}" ${x.drill ? `data-drill="${CH.esc(x.drill)}" class="hit"` : ''} data-tip="${CH.esc(x.tip || `${x.label}: ${(x.value / tot * 100).toFixed(1)}%`)}" ${x.dim ? 'opacity=".28"' : ''}></path>`; }).join('');
    return `<svg class="chart" viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="${CH.esc(o.label || 'Donut chart')}">${paths}
      ${CH.ctr(cx, cy, r0, o.center, o.sub, 24)}</svg>`;
  },
  /* two rings: inner = parents, outer = children (each child has parent id) */
  sunburst(inner, outer, o = {}){
    const S = o.size || 260, cx = S / 2, cy = S / 2, R = S / 2 - 4, rA0 = R * 0.34, rA1 = R * 0.62, rB0 = R * 0.64, rB1 = R;
    const tot = inner.reduce((s, x) => s + x.value, 0) || 1; let a = 0, out = '';

<script>/* ================= Workspace calculations and extra charts =================

const X = {

  cioTarget(hh, basis){

  scope(hh, scope){ return scope === 'brokerage' ? hh.holdings.filter(h => h.acct === 'brokerage') : hh.holdings; },

  gap(hh, scope, basis){

  },
  /* Brinson-Fachler attribution against the CIO strategic allocation, holding today's weights over the period */
  secRet(sym, period, h){ const p = DATA.perf.sec[sym]; if(p) return p[period];

  attribution(hh, scope, period){

  ROUTES: {reserve: ['Kept as liquidity reserve', 'var(--c-other)'], transfer: ['Tax-efficient transition', 'var(--c1)'], instep: ['Invest in steps', 'var(--c3)'], harvest: ['Sell and harvest loss', 'var(--c6)'], swap: ['Replace high-cost class', 'var(--c2)'], inkind: ['Move in kind', 'var(--c7)'], basis: ['Hold until basis found', 'var(--c4)'], stay: ['Stays where it is', 'var(--c-other)']},

    if(ev.view){ const g = X.gap(hh, 'all', 'tactical'); let score = 0; const rows = [];
      for(const [k, dir] of Object.entries(ev.view)){ const r = g.rows.find(x => x.k === k); if(!r) continue; const mis = -dir * r.g; if(Math.abs(r.g) > 0.005) rows.push({k, g: r.g, usd: r.usd, dir, against: mis > 0}); score += Math.max(0, mis) * g.ct; }
      return {kind: 'view', score, pctAcct: score / tot, rows}; }
    if(ev.research){ const dg = DATA.downgrades.find(d => d.sym === ev.research), me = dg && dg.holders.find(x => x.household_id === hh.id);
      const look = E.names(hh.holdings)[ev.research] || 0, direct = hh.holdings.filter(h => h.sym === ev.research).reduce((s, h) => s + h.mv, 0);
      const imp = hh.holdings.map(h => ({h, ...X.eventImpact(ev, h)})).filter(x => Math.abs(x.usd) > 1);
      return {kind: 'research', score: direct || look * tot * 0.2, pctAcct: look, direct, me, rows: imp}; }
    if(ev.household){ return {kind: 'client', score: ev.household === hh.id ? 1e12 : 0, pctAcct: 0, rows: []}; }
    const rows = hh.holdings.map(h => ({h, ...X.eventImpact(ev, h)})).filter(x => Math.abs(x.usd) > 1).sort((a, b) => a.usd - b.usd);
    const usd = rows.reduce((s, x) => s + x.usd, 0); return {kind: 'market', score: Math.abs(usd), usd, pctAcct: usd / tot, rows};
  },
  /* multi-year sale plan for one concentrated position (price held constant; illustrative) */
  salePlan(hh, sym, o){
    const tot0 = hh.holdings.reduce((s, h) => s + h.mv, 0), via = E.names(hh.holdings)[sym] * tot0 - hh.holdings.filter(h => h.sym === sym).reduce((s, h) => s + h.mv, 0);
    let lots = hh.holdings.filter(h => h.sym === sym).flatMap(h => (h.lots || []).map(l => ({...l}))), tot = tot0; const years = [];
    const rates = hh.rates, held = () => lots.reduce((s, l) => s + l.mv, 0);
    const sellOrder = () => lots.filter(l => l.cost != null && l.mv > 0.5).sort((a, b) => { const ga = (a.mv - a.cost) / a.mv, gb = (b.mv - b.cost) / b.mv, ra = ga < 0 ? -10 + ga : (a.term === 'ST' ? 10 : 0) + ga, rb = gb < 0 ? -10 + gb : (b.term === 'ST' ? 10 : 0) + gb; return ra - rb; });
    const sellGain = amt => { let left = amt, g = 0; for(const l of sellOrder()){ if(left <= 0.5) break; const t = Math.min(left, l.mv); g += (l.mv - l.cost) * t / l.mv; left -= t; } return g; };
    const doSell = amt => { let left = amt, g = 0, tax = 0; for(const l of sellOrder()){ if(left <= 0.5) break; const t = Math.min(left, l.mv), gn = (l.mv - l.cost) * t / l.mv; g += gn; tax += rates.taxable ? gn * (l.term === 'ST' ? rates.st : rates.lt) : 0; l.cost *= 1 - t / l.mv; l.mv -= t; left -= t; } return {sold: amt - Math.max(0, left), g, tax}; };
    const doGift = amt => { let left = amt, g = 0; const order = lots.filter(l => l.cost != null && l.mv > 0.5).sort((a, b) => a.cost / a.mv - b.cost / b.mv);
      for(const l of order){ if(left <= 0.5) break; const t = Math.min(left, l.mv); g += (l.mv - l.cost) * t / l.mv; l.cost *= 1 - t / l.mv; l.mv -= t; left -= t; } return {given: amt - Math.max(0, left), g}; };
    for(let i = 0; i < o.years; i++){
      const y = 2026 + i, need = +((o.needs || {})[y] || 0), start = held();
      const goal = Math.max(0, start + via - o.target * tot), gift = Math.min(o.gift || 0, goal), gv = doGift(gift); tot -= gv.given;
      const excess = Math.max(0, held() + via - o.target * tot); let amt = excess;
      if(o.budget != null){ let lo = 0, hi = excess; if(sellGain(hi) > o.budget){ for(let j = 0; j < 30; j++){ const mid = (lo + hi) / 2; if(sellGain(mid) <= o.budget) lo = mid; else hi = mid; } amt = lo; } }
      const forced = need > amt; if(forced) amt = Math.min(need, held());
      const s = doSell(amt); tot -= Math.min(need, s.sold + 0);
      years.push({y, start, gifted: gv.given, giftGain: gv.g, sold: s.sold, gain: s.g, tax: s.tax, need, overBudget: o.budget != null && s.g > o.budget + 1, end: held(), share: (held() + via) / tot, tot});
    }
    const reach = years.find(r => r.share <= o.target + 1e-6);
    return {years, via, reach: reach ? reach.y : null, start: (lots.length, E.names(hh.holdings)[sym])};
  },
};

/* ---------- extra charts ---------- */
Object.assign(CH, {
  /* dumbbell rows with a tolerance band per row: rows [{label, a, t, lo, hi, val, out}] */
  bands(rows, o = {}){
    const W = o.w || 520, rowH = 30, H = rows.length * rowH + 22, L = o.left || 140, R = 84, max = o.max || Math.max(...rows.flatMap(r => [r.a, r.hi ?? r.t])) * 1.08 || 1, min = 0;
    const X = v => L + (v - min) / (max - min) * (W - L - R), ticks = [0, max / 2, max];
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="${CH.esc(o.label || '')}">
      ${ticks.map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="0" y2="${H - 18}" class="grid"></line><text x="${X(t)}" y="${H - 4}" text-anchor="middle" class="c-ax">${CH.esc(o.fmt ? o.fmt(t) : t)}</text>`).join('')}
      ${rows.map((r, i) => { const y = i * rowH + 15, lo = Math.max(0, r.lo); return `<text x="0" y="${y + 4}" class="w-l">${CH.esc(r.label)}</text>
        <rect x="${X(lo)}" y="${y - 8}" width="${Math.max(2, X(r.hi) - X(lo))}" height="16" rx="4" class="b-band" data-tip="${CH.esc(`tolerance ${o.fmt(lo)}–${o.fmt(r.hi)}`)}"></rect>
        <line x1="${X(r.t)}" x2="${X(r.t)}" y1="${y - 9}" y2="${y + 9}" class="d-target" data-tip="${CH.esc('CIO target ' + o.fmt(r.t))}"></line>
        <line x1="${X(r.t)}" x2="${X(r.a)}" y1="${y}" y2="${y}" class="d-link"></line>
        <circle cx="${X(r.a)}" cy="${y}" r="6" class="${r.out ? 'b-out' : 'b-in'}" data-tip="${CH.esc(`today ${o.fmt(r.a)}${r.out ? ' · outside the band' : ''}`)}"></circle>
        <text x="${W}" y="${y + 4}" text-anchor="end" class="w-v">${CH.esc(r.val || '')}</text>`; }).join('')}</svg>`;
  },
  /* simple line over years with a threshold: pts [{x, y, tip}] */
  line(pts, o = {}){
    const W = o.w || 520, H = o.h || 200, L = 44, B = 26, T = 10, Rr = 12, xs = pts.map(p => p.x), maxY = Math.max(o.th || 0, ...pts.map(p => p.y)) * 1.12 || 1;
    const X = i => L + (pts.length > 1 ? i / (pts.length - 1) : 0.5) * (W - L - Rr), Y = v => T + (1 - v / maxY) * (H - T - B);
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i)},${Y(p.y)}`).join(''), area = path + `L${X(pts.length - 1)},${Y(0)}L${X(0)},${Y(0)}Z`;
    const ticks = [0, maxY / 2, maxY];
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="${CH.esc(o.label || '')}">
      ${ticks.map(t => `<line x1="${L}" x2="${W - Rr}" y1="${Y(t)}" y2="${Y(t)}" class="grid"></line><text x="${L - 6}" y="${Y(t) + 3}" text-anchor="end" class="c-ax">${CH.esc(o.fmt(t))}</text>`).join('')}
      ${o.th != null ? `<line x1="${L}" x2="${W - Rr}" y1="${Y(o.th)}" y2="${Y(o.th)}" class="l-th"></line><text x="${W - Rr}" y="${Y(o.th) - 5}" text-anchor="end" class="c-ax">${CH.esc(o.thLab || '')}</text>` : ''}
      <path d="${area}" class="l-area"></path><path d="${path}" class="l-line"></path>
      ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="4.5" class="l-pt" data-tip="${CH.esc(p.tip || '')}"></circle><text x="${X(i)}" y="${H - 8}" text-anchor="middle" class="c-ax">${CH.esc(p.x)}</text>`).join('')}</svg>`;
  },
  /* decision path: steps [{q, a, yes, out}] then result; yes branch shows its outcome to the side */
  tree(steps, result, o = {}){
    const W = o.w || 640, rowH = 58, H = steps.length * rowH + 82, nx = 16, nw = 300, ox = 360, ow = W - ox - 8;
    const cut = (t, n) => t.length > n ? t.slice(0, n - 1) + '\u2026' : t;
    const wrap2 = (t, n) => { if(t.length <= n) return [t]; let i = t.lastIndexOf(' ', n); if(i < 20) i = n; return [t.slice(0, i), cut(t.slice(i).trim(), n)]; };
    let out = '';
    steps.forEach((s, i) => { const y = 8 + i * rowH, on = s.yes;
      out += `<rect x="${nx}" y="${y}" width="${nw}" height="40" rx="8" class="t-q ${on ? 'on' : ''}"></rect><text x="${nx + 12}" y="${y + 17}" class="t-qt">${CH.esc(s.q)}</text><text x="${nx + 12}" y="${y + 32}" class="t-qa">${CH.esc(cut(s.a, 46))}</text>`;
      if(i < steps.length - 1 || true) out += `<line x1="${nx + 24}" x2="${nx + 24}" y1="${y + 40}" y2="${y + rowH}" class="t-ln"></line>`;
      out += `<line x1="${nx + nw}" x2="${ox}" y1="${y + 20}" y2="${y + 20}" class="t-ln ${on ? 'on' : ''}"></line><rect x="${ox}" y="${y + 4}" width="${ow}" height="32" rx="8" class="t-o ${on ? 'on' : ''}"></rect><text x="${ox + 10}" y="${y + 24}" class="t-ot ${on ? 'on' : ''}">${CH.esc(cut(s.out, 46))}</text>`; });
    const y = 8 + steps.length * rowH;
    const rl = wrap2(result, 92);
    out += `<rect x="${nx}" y="${y}" width="${W - nx - 8}" height="${rl.length > 1 ? 62 : 44}" rx="10" class="t-r"></rect><text x="${nx + 14}" y="${y + 18}" class="t-rk">RECOMMENDED PATH</text>${rl.map((t, i) => `<text x="${nx + 14}" y="${y + 35 + i * 17}" class="t-rt">${CH.esc(t)}</text>`).join('')}`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Decision tree">${out}</svg>`;
  },
});
</script>
<script>/* ================= Decision layer v3: one eligibility function, three readiness states, measure-matched claims =================
 * - D.elig(hh): the single source of program eligibility, used by the queue, strategy matching, the value story,
 *   the concentrated-position solutions, client stories and readiness. States: eligible · eligible with conditions ·
 *   requires specialist review · not eligible.
 * - D.ready(hh, ctx): client discussion · proposal · implementation, each with blockers and the owner who clears them.
 *   Discussion can be ready while implementation is not; nothing here is an approved, executable transaction.
 * - D.ws1(hh, o): the allocation finding computed from the advisor's active settings (scope, CIO basis, period).
 * - Every benefit names its own measure: single-name concentration ≠ portfolio volatility ≠ tracking error ≠ suitability.
 */
const STATUS = {
  review: ['Review needed', 'warn', 'Review'], ready: ['Ready for client discussion', 'good', 'Discuss'], specialist: ['Specialist review', 'info', 'Specialist'], blocked: ['Not eligible', 'bad', 'Not eligible'],
  monitor: ['Monitor', 'neutral', 'Monitor'], none: ['No action', 'neutral', 'No action'], stay: ['Stay in brokerage', 'neutral', 'Stay'], defer: ['Defer', 'neutral', 'Defer'], unsuitable: ['Not suitable', 'neutral', 'Not suitable'], respond: ['Respond to client', 'warn', 'Respond']};
const ELIG = {eligible: ['Eligible in principle', 'good', 'Eligible in principle'], conditions: ['Eligible in principle, with conditions', 'warn', 'Eligible · conditions'], specialist: ['Requires specialist review', 'info', 'Specialist review'], ineligible: ['Not eligible for the program', 'bad', 'Not eligible']};
const DISPOSITIONS = ['ready', 'review', 'specialist', 'stay', 'monitor', 'defer', 'unsuitable'];
/* workflow lifecycle is separate from the advisor's assessment: an item stays open until it is closed, deferred or set to monitor with a reason */
const CLOSE_OUTCOMES = ['Discussed with the client', 'Proposal submitted for review', 'Referred to the specialist', 'Client declined', 'No action needed after review'];
const REASON_NEEDED = ['stay', 'unsuitable', 'defer'];
const REASONS = ['Tax cost too high', 'Trading restriction', 'Insufficient client value', 'Poor fit for the client', 'Client declined', 'Missing data', 'Timing: revisit later', 'Other'];
const BASE = {scope: 'brokerage', basis: 'tactical', period: '3Y'};
const D = {
  /* largest single-security exposure: direct holdings plus look-through into funds (the documented basis of the 50% rule) */
  topName(hh){ const nm = E.names(hh.holdings); let t = ['', 0]; for(const [s, v] of Object.entries(nm)) if(v > t[1]) t = [s, v]; return t; },
  directShare(hh, sym){ const tot = hh.holdings.reduce((s, h) => s + h.mv, 0) || 1; return hh.holdings.filter(h => h.sym === sym && h.kind === 'stock').reduce((s, h) => s + h.mv, 0) / tot; },
  costsDefault(hh){ const amt = X.scope(hh, 'brokerage').reduce((s, h) => s + h.mv, 0); return amt ? X.costs(hh, amt, DATA.fees.brokerage.turnover, 0.5) : null; },
  /* ---------- the one eligibility function ---------- */
  elig(hh){
    const [sym, share] = D.topName(hh), lim = DATA.concentration.exclude_over, cond = [];
    const noBasis = hh.holdings.flatMap(h => h.lots || []).filter(l => l.cost == null).reduce((s, l) => s + l.mv, 0);
    const insiders = Object.entries(DATA.concentration.positions).filter(([k, v]) => k.startsWith(hh.id + ':') && v.insider).map(([k]) => k.split(':')[1]);
    const mgr = Object.keys(hh.manager_run || {});
    if(insiders.length) cond.push({t: `Insider rules for ${insiders.join(', ')}: pre-clearance and trading windows`, owner: 'Compliance'});
    if(noBasis) cond.push({t: `${money(noBasis)} without cost basis cannot be sold or planned`, owner: 'Operations'});
    if(mgr.length) cond.push({t: `${mgr.join(', ')} are run by a manager; the manager decides`, owner: 'Manager'});
    const dsh = D.directShare(hh, sym), via = dsh <= 0 ? 'all through funds' : share - dsh > 0.0005 ? `${pct(dsh, 1)} direct, ${pct(share - dsh, 1)} through funds` : 'held directly';
    if(share > lim) return {state: 'ineligible', sym, share, direct: dsh, via, reason: `${sym} is ${pct(share, 1)} of the account (${via}), above the ${pct(lim)} single-security limit`, route: 'Concentrated stock specialist', cond,
      blocks: ['Advisory program', 'CIO model portfolio', 'SMA and direct indexing', 'Tax-efficient transition']};
    return {state: cond.length ? 'conditions' : 'eligible', sym, share, direct: dsh, via, cond, blocks: []};
  },
  /* ---------- readiness: discussion, proposal, implementation ---------- */
  ready(hh, ctx = {}){
    const e = D.elig(hh), prop = [], impl = [];
    if(e.state === 'ineligible') prop.push({t: e.reason, owner: 'Specialist'});
    prop.push({t: 'Suitability determination', owner: 'Advisor'});
    if(ctx.risk) prop.push({t: 'Confirm the risk profile is current', owner: 'Advisor'});
    if(ctx.product) prop.push({t: 'Product eligibility for SMA or direct indexing', owner: 'Product team'});
    for(const c of e.cond) (c.owner === 'Operations' ? prop : impl).push(c);
    impl.push({t: 'Client agreement', owner: 'Client'}, {t: 'Validated trade plan (this page shows planning estimates only)', owner: 'Portfolio management'}, {t: 'Compliance review of client materials', owner: 'Compliance'}, {t: 'Supervisory approval', owner: 'Supervision'});
    return [{stage: 'Client discussion', state: 'ready', note: e.state === 'ineligible' ? 'Ready: discuss the position and the specialist route' : 'Ready: options and trade-offs can be discussed', items: []},
            {stage: 'Proposal', state: e.state === 'ineligible' ? 'blocked' : 'pending', note: e.state === 'ineligible' ? 'Blocked: no program proposal above the limit' : `Not ready: ${prop.length} to clear`, items: prop},
            {stage: 'Implementation', state: 'blocked', note: `Not cleared: ${impl.length} prerequisites outstanding`, items: impl}];
  },
  /* ---------- use case 1: allocation finding from the active settings ---------- */
  ws1(hh, o = BASE){
    const scope = o.scope === 'brokerage' && !X.scope(hh, 'brokerage').length ? 'all' : o.scope, basis = o.basis, period = o.period, perL = period === '3Y' ? 'three years' : 'one year';
    const g = X.gap(hh, scope, basis), a = X.attribution(hh, scope, period), b = hh.band, e = D.elig(hh);
    const [sym, share] = [e.sym, e.share], th = S.o3.th, tot = hh.holdings.reduce((s, h) => s + h.mv, 0), cashTot = hh.holdings.filter(h => h.cash).reduce((s, h) => s + h.mv, 0) / tot;
    const risk = g.st.vol > b.high ? 'above' : g.st.vol < b.low ? 'below' : 'inside', tL = basis === 'tactical' ? 'CIO tactical target' : 'CIO strategic target';
    const top = a.rows.slice().sort((x, y) => Math.abs(y.alloc + y.sel + y.inter) - Math.abs(x.alloc + x.sel + x.inter))[0];
    const r = X.routing(hh), gains = r.filter(x => x.route === 'transfer').reduce((s, x) => s + Math.max(0, x.gain), 0), y1gain = hh.gain_budget != null ? Math.min(gains, hh.gain_budget) : gains;
    const c = D.costsDefault(hh), prog = c && c.opt.find(x => x.id === 'program'), stay = c && c.opt.find(x => x.id === 'stay');
    const r1 = x => Math.round(x * 1000), volUp = r1(g.stT.vol) > r1(g.st.vol), gw = E.groups(g.w), gt = E.groups(g.t), mixWhy = gt.cash < gw.cash - 0.03 ? 'holds less cash than the portfolio does today' : gt.equity > gw.equity + 0.03 ? 'holds more stocks than the portfolio does today' : 'has a different mix';
    let kind, status, finding, next;
    if(e.state === 'ineligible'){ kind = 'gate'; status = 'specialist'; finding = `${e.reason} for the advisory program`; next = `Refer to the concentrated stock specialist; revisit the program once ${sym} is below ${pct(DATA.concentration.exclude_over)}.`; }
    else if(risk === 'above'){ kind = 'risk'; status = 'review'; finding = `Expected volatility ${pct(g.st.vol, 1)} is above the ${hh.profile} band (${pct(b.low, 1)}–${pct(b.high, 1)})${share > th ? `; ${sym} is ${pct(share, 1)} of the account` : ''}`; next = 'Review how to bring volatility back into the band after taxes and fees; compare staying in brokerage with a transition.'; }
    else if(risk === 'below' && cashTot > 0.2){ kind = 'cash'; status = 'review'; finding = `Expected volatility ${pct(g.st.vol, 1)} is below the ${hh.profile} band; ${pct(cashTot)} of the account is in cash`; next = 'Discuss investing the cash in steps toward the CIO allocation for the client\'s profile.'; }
    else if(share > th){ kind = 'conc'; status = 'ready'; finding = `${sym} is ${pct(share, 1)} of the account: single-company concentration warrants a discussion`; next = `Review whether reducing ${sym} is worth the taxes and fees; compare alternatives before suggesting a transition.`; }
    else if(a.active < -0.01){ kind = 'perf'; status = 'review'; finding = `Trailing the CIO allocation by ${ppt(-a.active)} a year over ${perL}, mostly from ${Math.abs(a.sel) > Math.abs(a.alloc) ? 'fund selection' : 'allocation'}`; next = 'Review the detracting funds and whether lower-cost or managed alternatives fit.'; }
    else if(g.out > 0){ kind = 'drift'; status = 'monitor'; finding = `Drift from the ${tL} (${g.out} asset class${g.out === 1 ? '' : 'es'} outside tolerance), with volatility inside the profile band`; next = 'Rebalance at the next scheduled review; no change needed now.'; }
    else { kind = 'none'; status = 'none'; finding = `In line with the ${tL} and the risk profile`; next = 'No action.'; }
    const shock = 0.3 * share * tot;
    const why = kind === 'conc' ? `${a.active > 0 ? `The portfolio has outperformed (${ppt(a.active)} a year over ${perL}) and volatility is inside the profile band, but the result rests on ${sym}.` : `The result depends heavily on ${sym}.`} A 30% fall in ${sym} would cost about ${money(shock)}. ${volUp ? `Moving to the ${tL} would cut single-company risk but raise expected portfolio volatility slightly (${pct(g.st.vol, 1)} → ${pct(g.stT.vol, 1)}), because the target ${mixWhy}: the case is about concentration, not lower volatility.` : (r1(g.stT.vol) < r1(g.st.vol) ? `Moving to the ${tL} would also lower expected volatility (${pct(g.st.vol, 1)} → ${pct(g.stT.vol, 1)}).` : `Expected portfolio volatility would stay about the same at the ${tL} (${pct(g.st.vol, 1)} → ${pct(g.stT.vol, 1)}): the case is about single-company concentration, not lower volatility.`)}`
      : kind === 'risk' ? `Volatility above the agreed profile is a suitability matter, regardless of past returns. At the ${tL} expected volatility would be ${pct(g.stT.vol, 1)}.`
      : kind === 'cash' ? `Much less volatility than the profile implies may leave the client short of their return objective; expected return ${pct(g.st.er, 1)} against ${pct(g.stT.er, 1)} at the ${tL}.`
      : kind === 'gate' ? 'Above this limit the program is not available; the first step is a specialist plan for the position.'
      : kind === 'perf' ? 'Persistent underperformance against the CIO allocation, after costs, is worth explaining to the client.'
      : kind === 'drift' ? 'Differences from the CIO model alone are not proof that a change would help the client.' : 'Nothing material to raise.';
    const trade = [
      ['Single-company concentration', share > th ? `${sym} ${pct(share, 1)}; guideline ${pct(th)}` : `largest ${sym} ${pct(share, 1)}`, share > th ? 'warn' : ''],
      ['Portfolio volatility', `${pct(g.st.vol, 1)} → ${pct(g.stT.vol, 1)} at the ${basis} target`, volUp ? 'warn' : g.stT.vol < g.st.vol - 0.0005 ? 'good' : ''],
      ['Tracking error to the CIO target', `${pct(g.te, 1)} → 0%`, ''],
      ['Suitability (profile band)', `${risk} the band (${pct(b.low, 1)}–${pct(b.high, 1)})`, risk === 'inside' ? 'good' : 'bad'],
      ['Estimated gains, year one (planning)', e.state === 'ineligible' ? 'n/a: transition not available' : y1gain ? `${money(y1gain)}; tax ≈ ${money(y1gain * hh.rates.lt)}` : 'none needed', y1gain && e.state !== 'ineligible' ? 'warn' : ''],
      ['Fees (illustrative)', prog ? `${money(prog.total)} in the program vs ${money(stay.total)} a year today` : '—', prog && prog.total > stay.total ? 'warn' : '']];
    return {kind, status, finding, why, next, g, a, sym, share, risk, cash: cashTot, elig: e, scope, basis, period,
      ready: D.ready(hh, {risk: kind === 'risk', product: kind === 'conc'}),
      assumptions: `${scope === 'brokerage' ? 'Brokerage accounts' : 'Whole household'} · ${tL} · ${period === '3Y' ? '3-year' : '1-year'} performance`,
      baseline: scope === BASE.scope && basis === BASE.basis && period === BASE.period,
      evidence: [`Expected volatility ${pct(g.st.vol, 1)}, band ${pct(b.low, 1)}–${pct(b.high, 1)} (${risk})`, `${g.out} asset class${g.out === 1 ? '' : 'es'} outside tolerance of the ${tL}; tracking error ${pct(g.te, 1)}`, `${period === '3Y' ? '3-year' : '1-year'} return ${spct(a.active)} vs the CIO allocation, mostly ${lc(short(top.k))}`],
      trade,
      choices: kind === 'gate' ? [['Specialist review', 'recommended'], ['Stay in brokerage', ''], ['Advisory program', 'blocked']]
        : kind === 'none' || kind === 'drift' ? [['Monitor', 'recommended'], ['Rebalance in brokerage', ''], ['Advisory program', 'suitability dependent']]

<script>/* ================= Advisory pathway (v5): every opportunity leads, in the same six steps, to an advisory path =================

 * advisor review before anything is sent; no autonomous execution or enrollment.

const UC = {1: 'Allocation and risk alignment gap', 2: 'Embedded gains and loss harvesting', 3: 'Individual bonds and maturities', 4: 'Excess cash', 5: 'High-cost funds',
  7: 'Advisory value narrative', 8: 'Concentrated stock', 10: 'News, CIO and research views', 12: 'Trading economics'};

const KIND = {1: 'Allocation gap', 2: 'Embedded gains and losses', 3: 'Individual bonds', 4: 'Excess cash', 5: 'High-cost funds', 7: 'Advisory proposal', 8: 'Concentrated stock', 10: 'Market or research event', 12: 'Trading costs'};
const UCS = {1: 'Allocation gap', 2: 'Gains and losses', 3: 'Individual bonds', 4: 'Excess cash', 5: 'High-cost funds', 7: 'Value narrative', 8: 'Concentrated stock', 10: 'Event-led', 12: 'Trading economics'};

const SEG = {low: ['Low', 'neutral'], medium: ['Medium', 'warn'], hard: ['Hard', 'bad']};

  /* the conversion map summarized: how each holding moves and how much is aligned in year one */

<script>/* ================= Prototype checks: decision-engine checks anyone can run in their own browser =================
 * Opened from the "Illustrative · prototype" pill. Pure functions only: the advisor's state is copied and restored,
 * so running the checks never changes what is on screen. The full click-through journeys run separately in a browser harness.
 */
function runChecks(){
  const out = [], ck = (area, name, pass, info) => out.push({area, name, pass: !!pass, info: info || ''});
  const save = {disp: S.disp, promo: S.promo, intelRun: S.intelRun}; S.disp = {}; S.promo = {}; S.intelRun = {};

    for(const hh of HHS()){ const e = D.elig(hh), q = D.queue().filter(o => o.hh.id === hh.id && (o.ws === 'ws1' || o.ws === 'ws2'));
      const labels = q.map(o => o.act[0]).filter(l => !['No action needed now', 'Not eligible; specialist route'].includes(l));
      ck('Eligibility', `${hh.name}: queue uses the same determination (${ELIG[e.state][0]})`, labels.every(l => l === ELIG[e.state][2]), labels.join(', ')); }
    const synth = JSON.parse(JSON.stringify(DATA.households.okonkwo)), f = JSON.parse(JSON.stringify(DATA.households.henderson.holdings.find(x => x.sym === 'VTI')));
    f.sym = 'FNDX'; f.top_holdings = {ZZZ: 0.7}; f.mv = 1e6; f.lots = [{id: 'FNDX', cost: 9e5, mv: 1e6, term: 'LT'}]; synth.id = 'synth'; synth.holdings = [f];
    const es = D.elig(synth); ck('Eligibility', 'A fund-only 70% exposure to one security is not eligible (direct plus look-through rule)', es.state === 'ineligible' && es.sym === 'ZZZ', `${es.state} · ${es.sym} ${pct(es.share, 1)} · ${es.via}`);
    const dg = D.elig(DATA.households.delgado); ck('Eligibility', 'Delgado COST: direct and fund exposure combined, above the limit', dg.state === 'ineligible' && /direct/.test(dg.via), dg.via);
    /* readiness wording */

    ck('Readiness', 'No "Not eligible yet" wording; implementation reads "Not cleared"', !/Not eligible yet/.test(words) && HHS().every(hh => /^Not cleared/.test(D.ready(hh)[2].note)));
    ck('Readiness', 'Client discussion can be ready while implementation is not cleared', HHS().every(hh => { const r = D.ready(hh); return r[0].state === 'ready' && r[2].state === 'blocked'; }));
    /* lifecycle: an assessment does not hide work */
    const k = 'ws3:henderson:NVDA', grp = () => (D.queue().find(o => o.key === k) || {}).grp;
    S.disp[k] = {status: 'review', set: true, reason: ''}; ck('Workflow', '"Review needed" keeps the item in Needs action', grp() === 'action', grp());
    S.disp[k] = {status: 'specialist', set: true, reason: ''}; const g2 = grp(); S.disp[k] = {status: 'stay', set: true, reason: ''}; const g3 = grp();
    S.disp[k].reason = 'Client declined'; const g4 = grp(); S.disp[k] = {status: 'defer', set: true, reason: 'Timing: revisit later'}; const g5 = grp();
    S.disp[k] = {status: 'ready', set: true, reason: '', closed: {outcome: 'Discussed with the client'}}; const g6 = grp();
    ck('Workflow', 'Specialist stays visible in its group; stay needs a reason to close; defer with a reason moves to Monitor; explicit close moves to Closed', g2 === 'specialist' && g3 === 'action' && g4 === 'done' && g5 === 'monitor' && g6 === 'done', [g2, g3, g4, g5, g6].join(' → '));
    S.disp = {};

    let bad = 0, n = 0;
    for(const hh of HHS()) for(const scope of ['brokerage', 'all']) for(const basis of ['strategic', 'tactical']) for(const period of ['1Y', '3Y']){
      const w = D.ws1(hh, {scope, basis, period}); n++; const m = w.why.match(/(lower|raise|stay about the same)[^()]*\((\d+\.\d)% → (\d+\.\d)%\)/);
      if(m){ const a = +m[2], c = +m[3]; if(!((m[1] === 'lower' && c < a) || (m[1] === 'raise' && c > a) || (m[1] === 'stay about the same' && Math.abs(c - a) < 0.05))) bad++; } }
    ck('Claims', `Volatility wording matches the numbers shown (${n} household × setting views)`, bad === 0, `${bad} mismatches`);
    let worst = 0; for(const hh of HHS()) for(const p of ['1Y', '3Y']){ const a = X.attribution(hh, 'all', p); worst = Math.max(worst, Math.abs(a.alloc + a.sel + a.inter - a.active)); }

    ck('Value story', 'Not-eligible households get no harvesting or transition value', HHS().every((hh, i) => D.elig(hh).state !== 'ineligible' || !vs[i].diOk));

    const Q = D.queue();

    /* v6: one set of amounts and paths */
    ck('Amounts', 'One canonical investable cash: the conversion map, the plan and the cash opportunity agree, and never exceed cash above target after the reserve', HHS().every(h => { const cs = X.cashSplit(h), r = X.routing(h).filter(x => x.route === 'instep').reduce((a, x) => a + x.mv, 0); return Math.abs(r - cs.investable) < 1 && Math.abs(P.transition(h).parts.instep - cs.investable) < 1 && cs.investable <= Math.max(0, cs.total - cs.target - cs.reserve) + 1; }));
    ck('Amounts', 'Every holding sits in exactly one bucket and the buckets add back to the total identified; bond timing is never counted', HHS().every(h => { const K = P.buckets(h); return Math.abs(K.move + K.gated + K.kept + K.excluded - P.amt(h)) < 2; }));
    ck('Amounts', 'Identified ≥ program-eligible ≥ transitionable now, for every household', HHS().every(h => { const A = P.amounts(h); return A.identified + 1 >= A.eligible && A.eligible + 1 >= A.now; }));
    ck('Paths', 'Every path lists feasibility checks with owners and an approver; not-eligible households get only the specialist route', HHS().every(h => { const ps = P.paths(h); return ps.length && ps.every(p => p.feas.length && p.approver) && (D.elig(h).state !== 'ineligible' || (ps.length === 1 && ps[0].id === 'specialist')); }));
    ck('Paths', 'Exactly one suggested path per household', HHS().every(h => P.paths(h).filter(p => p.suggested).length === 1));
    /* events and intelligence */
    const mk = HHS().flatMap(hh => DATA.news.map(ev => { const r = X.eventForHH(ev, hh); return r.kind === 'market' && r.score > 1 ? D.ws4(ev, {hh, ...r}).size : null; })).filter(Boolean);
    ck('Events', 'Market-event sizes are labelled "estimated scenario impact"', mk.every(x => /estimated scenario impact/.test(x)), `${mk.length} sizes`);
    const n0 = D.queue().length, cat = D.catalog(); cat.forEach(it => { if(!it.auto) S.intelRun[it.id] = true; HHS().forEach(hh => D.intelFor(it, hh)); });
    ck('Intelligence', `Publishing and analyzing all ${cat.length} catalog items leaves the opportunity count unchanged`, D.queue().length === n0, `${n0} before and after`);
    ck('Intelligence', 'Superseded content is not evaluated; missing look-through is "not evaluated", not "no impact"', D.bookStatus(cat.find(x => x.rule === 'superseded')).k === 'na' && HHS().some(hh => D.intelFor(cat.find(x => x.rule === 'region-sector'), hh).state === 'unknown'));
    ck('Intelligence', 'Only approved, current items can be saved for a client meeting', cat.filter(x => x.client_use && x.rule !== 'superseded').every(x => x.type !== 'market'));
  } catch(err){ ck('Harness', 'Checks ran without errors', false, String(err)); }
  finally { S.disp = save.disp; S.promo = save.promo; S.intelRun = save.intelRun; }
  return out;
}
function showChecks(){
  const r = runChecks(), pass = r.filter(x => x.pass).length, el = document.getElementById('checks') || document.body.appendChild(Object.assign(document.createElement('div'), {id: 'checks', className: 'checks'}));
  const areas = [...new Set(r.map(x => x.area))];
  el.innerHTML = `<div class="checks-b" role="dialog" aria-label="Prototype checks"><div class="sec-h"><span class="k">Prototype checks</span><button class="btn sm" data-closechecks>Close</button></div>
    <p class="sub" style="margin:4px 0 10px"><b class="${pass === r.length ? 'up' : 'tw-warn'}">${pass} of ${r.length} passed</b>, run in this browser at ${new Date().toLocaleTimeString()}. Engine-level checks; nothing on screen is changed. All data is illustrative; nothing is saved.</p>
    ${areas.map(a => `<div class="k" style="margin-top:8px">${esc(a)}</div><ul class="ck">${r.filter(x => x.area === a).map(x => `<li class="${x.pass ? 'ok' : 'no'}"><span>${x.pass ? '✓' : '✕'}</span><div>${esc(x.name)}${x.info ? `<div class="sub">${esc(x.info)}</div>` : ''}</div></li>`).join('')}</ul>`).join('')}
    <p class="disc">Covers: one eligibility rule including look-through; readiness wording; assessment vs workflow; claim wording; attribution arithmetic; event labels; firm intelligence never creating work by itself.</p></div>`;
  el.hidden = false;
}
document.addEventListener('click', e => { if(e.target.closest('[data-checks]')) showChecks(); else if(e.target.closest('[data-closechecks]') || e.target.id === 'checks') document.getElementById('checks').hidden = true; });
</script>
