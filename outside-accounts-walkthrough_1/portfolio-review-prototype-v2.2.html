/* v2.1: AI touchpoints and CIO view */
:root{--ai:#6a4bd0;--ai-tint:#f2eefd}
:root[data-theme=dark]{--ai:#ab97f3;--ai-tint:#1d1832}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ai:#ab97f3;--ai-tint:#1d1832}}
.ai-zone{position:relative}
.ai-badge{display:none;align-items:center;gap:3px;border:1px solid var(--ai);color:var(--ai);background:var(--paper);border-radius:99px;padding:1px 8px;font-size:10px;font-weight:750;letter-spacing:.02em;cursor:pointer;line-height:1.6;min-height:0}
body.show-ai .ai-badge{display:inline-flex;margin-bottom:6px}
body.show-ai .ai-zone{border:1.5px dashed var(--ai);border-radius:9px;background:var(--ai-tint);padding:8px 11px 10px;margin:8px 0}
body.show-ai .ai-zone .lede{margin:0}
body.show-ai .ai-zone .talk-mini{margin:0;background:transparent;padding:0}
.ai-text{font-size:12.5px;color:var(--fg-2);line-height:1.55}
.preview-head .ai-zone{margin:12px 0 4px}
body:not(.show-ai) .ai-zone .ai-text{margin-top:10px}
.ai-toggle.on{border-color:var(--ai);color:var(--ai);background:var(--ai-tint)}
.ai-dot{color:var(--ai);font-size:16px;line-height:1}

function markLedes(){if(!AI_LEDE_STEPS.includes(S.step))return;let p=document.querySelector('#stage > p.lede');if(!p)return;let z=document.createElement('div');z.className='ai-zone';z.dataset.ai='step';z.innerHTML=aiBadge('step');p.replaceWith(z);z.appendChild(p)}
function paint(){paintMain()}
function useSelectedFund(){let pk=S.pick;if(!pk?.sel)return;let sym=pk.sel,l=LS();l.fill??={};if(pk.cls)l.fill[pk.cls]=sym;if(pk.context==='conc'){l.conc[pk.sym]??={to:.1,into:'fund',fund:sym};l.conc[pk.sym].fund=sym;l.conc[pk.sym].into='fund'}if(pk.context==='deep'){l.deep.selected=sym}S.sheet=null;S.pick=null;toast('Using '+sym+' for this change');paintMain()}
function chooseHH(id,step='overview'){if(!DATA.households[id])return;S.hid=id;S.step=step;S.holding=null;S.sheet=null;S.sideOpen=false;paintMain();window.scrollTo(0,0)}
function dismiss(){S.sheet=null;S.pick=null;paintSheet()}

 if(d.step){S.step=d.step;S.holding=null;if(S.step==='overview'&&EX().state==='proposal'&&!prop().groups.length)EX().state='today';paintMain();window.scrollTo({top:0,behavior:'instant'});return}
 if(d.drill!==undefined){let x=d.drill;if(x==='root'){S.step='overview';EX().path=[];S.holding=null}else if(x.startsWith('c:')){S.step='overview';EX().mode='class';EX().path=x.slice(2).split('/');S.holding=null}else if(x.startsWith('s:')){S.step='overview';EX().mode='sector';EX().path=[x.slice(2)];S.holding=null}else if(x.startsWith('h:')){S.step='overview';S.holding=S.holding===x.slice(2)?null:x.slice(2)}paintMain();return}

 else if(d.checkopen!==undefined){S.sheet='check';paintSheet();return}
