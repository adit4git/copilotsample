[project]
name = "skill-studio"
version = "1.0.0"
description = "Skill Studio: a registry of technical, business, policy and rules-driven skills that build on each other (proof of concept)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "pyyaml>=6.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
