<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg></div>
    <div><b>Skill Studio</b><span>Skills registry · prototype</span></div>
  </div>
  <nav class="tabs" aria-label="Views">
    <a href="#/registry" data-view="registry">Registry</a>
    <a href="#/map" data-view="map">Dependency map</a>
    <a href="#/run" data-view="run">Run a capability</a>
    <a href="#/create" data-view="create">Create from English</a>
  </nav>
  <span class="grow"></span>
  <span class="badge-ill" title="All managers, clients and figures are fictional">Illustrative data</span>
  <a class="btn ghost sm" href="/api/export" download="skill-registry-export.md" title="Every SKILL.md in one plain-text file">Export all</a>
  <button class="btn ghost sm" data-reset title="Restore the 19 seed skills">Reset demo</button>
  <button class="iconbtn" data-theme-toggle title="Switch light and dark" aria-label="Switch light and dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
</header>
<main id="view" aria-live="polite"></main>
<div id="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
