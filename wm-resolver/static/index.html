<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Advisor Copilot — Resolution POC</title>
<style>
  :root{
    --bg:#0f141b; --panel:#161d27; --panel2:#1c2531; --line:#2a3542;
    --ink:#e7edf4; --mut:#8b9bad; --dim:#5f7084;
    --accent:#6ea8fe; --accent2:#4b8bf4;
    --good:#3fb985; --warn:#e0a94a; --bad:#e2676b;
    --chip:#223044; --radius:14px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header .logo{width:26px;height:26px;border-radius:7px;
       background:linear-gradient(135deg,var(--accent),#8b6ef4)}
  header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
  header .spacer{margin-left:auto}
  header .mode{font-size:11.5px;color:var(--mut);
       border:1px solid var(--line);padding:4px 9px;border-radius:999px;font-family:var(--mono)}
  header .mode b{color:var(--accent)}
  /* engine toggle */
  .engsw{display:flex;align-items:center;gap:6px;margin-right:14px}
  .engsw .seg{display:flex;background:var(--panel2);border:1px solid var(--line);
       border-radius:999px;padding:2px;font-family:var(--mono);font-size:11.5px}
  .engsw .seg button{border:none;background:none;color:var(--mut);cursor:pointer;
       padding:4px 11px;border-radius:999px;transition:.12s}
  .engsw .seg button.on{background:var(--accent2);color:#fff}
  .engsw .lbl{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  .wrap{flex:1;display:grid;grid-template-columns:1fr 360px;min-height:0}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}
       .side{display:none}}

  /* chat column */
  .chat{display:flex;flex-direction:column;min-height:0}
  .scroll{flex:1;overflow:auto;padding:22px 20px;scroll-behavior:smooth}
  .msg{max-width:78%;margin:0 0 14px;padding:11px 14px;border-radius:var(--radius);
       font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{margin-left:auto;background:var(--accent2);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.bot.exec{border-color:#2e5a46;background:#15241d}
  .msg.bot.confirm{border-color:#6a5a2a;background:#241f12}
  .msg.bot.confirm .tag{color:var(--warn)}
  .msg .tag{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
       color:var(--dim);margin-bottom:5px;font-family:var(--mono)}
  .msg.bot.exec .tag{color:var(--good)}
  .msg strong{color:var(--ink)}
  .filecard{display:flex;gap:9px;align-items:center;margin-top:8px;padding:8px 10px;
       background:#101722;border:1px dashed var(--line);border-radius:10px;font-size:12px;color:var(--mut)}
  .filecard code{font-family:var(--mono);color:var(--accent);font-size:11px}

  /* clarification chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{cursor:pointer;font-size:12.5px;padding:7px 12px;border-radius:999px;
       background:var(--chip);border:1px solid var(--line);color:var(--ink);transition:.12s}
  .chip:hover{border-color:var(--accent);background:#263a52}
  .chip small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px;max-width:220px}

  /* composer */
  .composer{border-top:1px solid var(--line);background:var(--panel);
       padding:12px 14px;display:flex;gap:10px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;background:var(--panel2);border:1px solid var(--line);
       color:var(--ink);border-radius:12px;padding:11px 13px;font:14px/1.4 var(--sans);
       max-height:140px;min-height:44px;outline:none}
  .composer textarea:focus{border-color:var(--accent)}
  .iconbtn,.sendbtn{border:none;border-radius:11px;cursor:pointer;height:44px}
  .iconbtn{width:44px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-size:18px}
  .iconbtn:hover{color:var(--accent);border-color:var(--accent)}
  .sendbtn{padding:0 18px;background:var(--accent2);color:#fff;font-weight:600;font-size:14px}
  .sendbtn:disabled{opacity:.5;cursor:default}

  /* side panel */
  .side{background:var(--panel);border-left:1px solid var(--line);
       display:flex;flex-direction:column;min-height:0}
  .side h2{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);
       margin:0;padding:14px 16px 8px;font-family:var(--mono)}
  .side .body{overflow:auto;padding:0 16px 20px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
       padding:13px;margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
  .kv .k{color:var(--mut)}
  .kv .v{font-family:var(--mono);color:var(--ink);text-align:right}
  .pill{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 7px;border-radius:999px}
  .pill.ok{background:#14301f;color:var(--good)} .pill.miss{background:#331a1b;color:var(--bad)}
  .conf{height:6px;border-radius:999px;background:#0d1620;overflow:hidden;margin-top:6px}
  .conf > i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good))}
  .slotrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;border-top:1px solid #202b38}
  .slotrow:first-of-type{border-top:none}
  .slotrow .nm{color:var(--mut);font-family:var(--mono);min-width:92px}
  .slotrow .val{color:var(--ink);flex:1;text-align:right;word-break:break-word}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.on{background:var(--good)} .dot.off{background:var(--bad)}
  .action-badge{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;background:#0d1620;color:var(--mut)}
  details.ref summary{cursor:pointer;color:var(--mut);font-size:11.5px;padding:6px 0}
  details.ref .ex{font-size:11.5px;color:var(--dim);font-family:var(--mono);padding:2px 0 2px 10px}
  .empty{color:var(--dim);font-size:12.5px;padding:8px 0}
  .reset{margin:6px 16px 14px;font-size:11.5px;color:var(--dim);background:none;border:1px solid var(--line);
       border-radius:8px;padding:6px;cursor:pointer}
  .reset:hover{color:var(--bad);border-color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>Advisor Copilot <span style="color:var(--dim);font-weight:400">· entity &amp; intent resolution POC</span></h1>
  <div class="spacer"></div>
  <div class="engsw">
    <span class="lbl">engine</span>
    <div class="seg" id="engseg">
      <button data-eng="classic" class="on" title="Model returns JSON; code routes, gates &amp; executes.">classic</button>
      <button data-eng="hybrid" title="Model emits a tool call (proposal); the SAME gate executes.">hybrid</button>
    </div>
  </div>
  <div class="mode" id="mode">mode: <b>…</b></div>
</header>

<div class="wrap">
  <!-- CHAT -->
  <section class="chat">
    <div class="scroll" id="scroll"></div>
    <div class="composer">
      <input type="file" id="file" hidden/>
      <button class="iconbtn" id="attach" title="Attach statement or screenshot">📎</button>
      <textarea id="input" placeholder="e.g.  rebalance the Hendersons  ·  any losses to harvest for the Kims  ·  can the Garcias retire at 62"></textarea>
      <button class="sendbtn" id="send">Send</button>
    </div>
  </section>

  <!-- RESOLUTION TRACE -->
  <aside class="side">
    <h2>Resolution state</h2>
    <div class="body">
      <div class="card" id="statecard">
        <div class="empty">No active intent yet. Send a request to begin.</div>
      </div>

      <h2 style="padding-left:0">Last turn</h2>
      <div class="card" id="turncard"><div class="empty">—</div></div>

      <details class="ref">
        <summary>Skill catalog (what I can route to)</summary>
        <div id="catalog"></div>
      </details>
    </div>
    <button class="reset" id="reset">Reset conversation</button>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const scroll = $('#scroll');
let sessionId = null;
let engine = 'classic';          // current resolution engine

// ---- rendering --------------------------------------------------------
function bubble(role, text, extra){
  const d = document.createElement('div');
  d.className = 'msg ' + role + (extra?.exec ? ' exec':'') + (extra?.confirm ? ' confirm':'');
  if(extra?.tag){ const t=document.createElement('div'); t.className='tag'; t.textContent=extra.tag; d.appendChild(t); }
  const body=document.createElement('div');
  body.innerHTML = mdLite(text);
  d.appendChild(body);
  if(extra?.file){
    const f=document.createElement('div'); f.className='filecard';
    f.innerHTML = `📄 <span>${extra.file.name}</span> <code>parsed →</code> <span style="color:var(--mut)">${(extra.file.extracted_preview||'').slice(0,90)}…</span>`;
    d.appendChild(f);
  }
  if(extra?.options?.length){
    const c=document.createElement('div'); c.className='chips';
    extra.options.forEach(o=>{
      const chip=document.createElement('div'); chip.className='chip';
      chip.innerHTML = `${o.title}` + (o.description?`<small>${o.description}</small>`:'');
      chip.onclick = ()=>{ send(o.title); };
      c.appendChild(chip);
    });
    d.appendChild(c);
  }
  scroll.appendChild(d); scroll.scrollTop = scroll.scrollHeight;
}
function mdLite(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }

const ACTION_LABEL = {
  CLARIFY_INTENT:'clarify intent', CLARIFY_SLOT:'clarify slot',
  EXECUTE:'execute', FALLBACK:'fallback', CONFIRM:'confirm (gate)'};

function renderState(st, action){
  const card = $('#statecard');
  if(!st || !st.skill_id){ card.innerHTML='<div class="empty">No active intent yet. Send a request to begin.</div>'; return; }
  let slots = '';
  (st.required_slots||[]).forEach(nm=>{
    const on = st.entities && (nm in st.entities);
    slots += `<div class="slotrow"><span class="dot ${on?'on':'off'}"></span>
      <span class="nm">${nm}</span>
      <span class="val">${on?escapeHtml(String(st.entities[nm])):'<span style="color:var(--bad)">missing</span>'}</span></div>`;
  });
  // extra (optional) entities we captured
  Object.keys(st.entities||{}).filter(k=>!(st.required_slots||[]).includes(k)).forEach(nm=>{
    slots += `<div class="slotrow"><span class="dot on"></span>
      <span class="nm">${nm}</span><span class="val">${escapeHtml(String(st.entities[nm]))}</span></div>`;
  });
  card.innerHTML = `
    <div class="kv"><span class="k">skill</span><span class="v">${st.skill_title||'—'}</span></div>
    <div class="kv"><span class="k">sub-intent</span><span class="v" style="font-size:11px;color:var(--mut)">${st.skill_id}</span></div>
    <div class="kv"><span class="k">slots</span><span class="v">
       <span class="pill ${st.missing_slots.length?'miss':'ok'}">${(st.required_slots.length-st.missing_slots.length)}/${st.required_slots.length} filled</span></span></div>
    <div style="margin-top:8px">${slots||'<div class="empty">no slots</div>'}</div>`;
}

function renderTurn(tr, action){
  const card=$('#turncard');
  if(!tr){ card.innerHTML='<div class="empty">—</div>'; return; }
  const r = tr.llm_resolution||{};
  const conf = Math.round((r.confidence||0)*100);
  const viaLabel = {tool_call:'tool call', mock_tool_call:'tool call (mock)'}[r.via]
                   || (tr.engine==='hybrid' ? 'tool call' : 'JSON extract');
  card.innerHTML = `
    <div class="kv"><span class="k">engine</span><span class="v">${tr.engine||engine}</span></div>
    <div class="kv"><span class="k">proposed via</span><span class="v">${viaLabel}</span></div>
    <div class="kv"><span class="k">action</span><span class="v"><span class="action-badge">${ACTION_LABEL[action]||action}</span></span></div>
    <div class="kv"><span class="k">routed</span><span class="v">${r.sub_intent||'—'}</span></div>
    <div class="kv"><span class="k">confidence</span><span class="v">${conf}%</span></div>
    <div class="conf"><i style="width:${conf}%"></i></div>
    ${r.ambiguous_between?.length?`<div class="kv" style="margin-top:6px"><span class="k">ambiguous</span><span class="v" style="font-size:10.5px">${r.ambiguous_between.join('<br>')}</span></div>`:''}
    <div class="kv" style="margin-top:6px"><span class="k">why</span><span class="v" style="font-size:11px;color:var(--mut);max-width:200px">${escapeHtml(r.reasoning||'')}</span></div>`;
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// ---- networking -------------------------------------------------------
async function send(text){
  text = (text ?? $('#input').value).trim();
  if(!text) return;
  $('#input').value='';
  bubble('user', text);
  $('#send').disabled = true;
  try{
    const res = await fetch('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sessionId, text, engine})});
    const data = await res.json();
    sessionId = data.session_id;
    handle(data);
  }catch(e){ bubble('bot','⚠️ '+e.message); }
  $('#send').disabled=false; $('#input').focus();
}

async function upload(fileObj){
  bubble('user', `📎 ${fileObj.name}`);
  const fd=new FormData();
  fd.append('session_id', sessionId||'');
  fd.append('file', fileObj);
  fd.append('text', $('#input').value.trim());
  fd.append('engine', engine);
  $('#input').value='';
  try{
    const res=await fetch('/api/upload',{method:'POST',body:fd});
    const data=await res.json();
    sessionId=data.session_id;
    handle(data, data.file);
  }catch(e){ bubble('bot','⚠️ '+e.message); }
}

function handle(data, file){
  const tagMap={CLARIFY_INTENT:'Need to disambiguate',CLARIFY_SLOT:'Missing a detail',
    EXECUTE:'Resolved · running skill',FALLBACK:"Couldn't route",
    CONFIRM:'Confirm before running'};
  bubble('bot', data.message, {
    tag: tagMap[data.action],
    exec: data.action==='EXECUTE',
    confirm: data.action==='CONFIRM',
    options: data.options, file
  });
  if(data.action==='EXECUTE' && data.result?.data?.preview){
    bubble('bot', '```\n'+data.result.data.preview+'\n```', {tag:'extracted'});
  }
  renderState(data.state, data.action);
  renderTurn(data.trace, data.action);
}

// ---- catalog + mode ---------------------------------------------------
async function loadMeta(){
  const h=await (await fetch('/api/health')).json();
  $('#mode').innerHTML = `mode: <b>${h.mode}</b> · ${h.provider}`;
  const cat=await (await fetch('/api/catalog')).json();
  const el=$('#catalog');
  const byIntent={};
  cat.skills.forEach(s=>{(byIntent[s.intent]=byIntent[s.intent]||[]).push(s);});
  el.innerHTML = Object.entries(byIntent).map(([intent,skills])=>`
    <div style="margin:6px 0 2px;color:var(--accent);font-size:11px;font-family:var(--mono)">${intent}</div>
    ${skills.map(s=>`<div class="ex">· ${s.title} <span style="color:#415066">[${s.required_slots.join(', ')||'no req slots'}]</span></div>`).join('')}
  `).join('');
}

// ---- engine toggle ----------------------------------------------------
$('#engseg').addEventListener('click', async e=>{
  const btn = e.target.closest('button[data-eng]'); if(!btn) return;
  const next = btn.dataset.eng;
  if(next===engine) return;
  engine = next;
  document.querySelectorAll('#engseg button').forEach(b=>b.classList.toggle('on',b.dataset.eng===engine));
  // Fresh session per engine so a switch doesn't land mid-slot-fill.
  if(sessionId) await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,text:''})});
  sessionId=null; scroll.innerHTML=''; renderState(null); renderTurn(null);
  bubble('bot', `Switched to the **${engine}** engine. `+(engine==='hybrid'
    ? 'The model now proposes a **tool call**; the same gate still decides whether to run it.'
    : 'The model now returns **JSON**; code routes, gates, and executes.'), {tag:'engine'});
  greet();
});

// ---- wiring -----------------------------------------------------------
$('#send').onclick=()=>send();
$('#input').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('#attach').onclick=()=>$('#file').click();
$('#file').onchange=e=>{ if(e.target.files[0]) upload(e.target.files[0]); e.target.value=''; };
$('#reset').onclick=async()=>{
  if(sessionId) await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,text:''})});
  sessionId=null; scroll.innerHTML=''; renderState(null); renderTurn(null);
  greet();
};
function greet(){
  bubble('bot',"Hi — I'm your resolution copilot. Give me a terse request and I'll figure out the skill and the details, asking only for what I'm missing.\n\nTry: **rebalance the Hendersons**, **harvest losses for the Kims**, or attach a held-away statement with 📎.", {tag:'ready'});
}
loadMeta(); greet();
</script>
</body>
</html>
