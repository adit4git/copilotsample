<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Advisor Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --canvas:#E9EBEF;--paper:#FFFFFF;--paper-2:#F4F6F8;--inset:#EEF1F4;
  --fg:#161B24;--fg-2:#3F4856;--muted:#6B7482;--line:#DBE0E6;--line-2:#E7EAEF;
  --brand:#0C5D51;--brand-2:#0A4A41;--brand-tint:#E1EEEB;--brand-ink:#06382F;--on-brand:#F4FBF9;
  --amber:#9E5E12;--amber-tint:#F5EBDA;--red:#A2323E;--red-tint:#F4E2E4;--blue:#26548F;--blue-tint:#E4ECF6;
  --gain:#0B7A4B;--loss:#B23A3A;--focus:#1f8f7c;
  --c-equity:#2a78d6;--c-fixed:#eb6834;--c-alt:#1baf7a;--c-cash:#eda100;--c-sector:#2a78d6;
  --h0:#D5DAE1;--h1:#EC9D6B;--h2:#EF8C5A;--h3:#E0662C;--h4:#B84A17;--h5:#7F2F0B;
  --sh-1:0 1px 2px rgba(20,26,38,.05),0 1px 1px rgba(20,26,38,.04);
  --sh-2:0 10px 30px -12px rgba(20,26,38,.28);
  --sh-3:0 18px 40px -16px rgba(20,26,38,.38);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --canvas:#0B0E13;--paper:#141922;--paper-2:#1A202B;--inset:#10151D;
  --fg:#E6E9EF;--fg-2:#B6BDC9;--muted:#8A93A1;--line:#262E3B;--line-2:#1E2531;
  --brand:#3FB7A0;--brand-2:#2F9C88;--brand-tint:#10302A;--brand-ink:#8FE6D5;--on-brand:#04140F;
  --amber:#D79A46;--amber-tint:#2A2214;--red:#E2777C;--red-tint:#2C171A;--blue:#6FA0DA;--blue-tint:#14202F;
  --gain:#40C48D;--loss:#E0736F;--focus:#3FB7A0;
  --c-equity:#3987e5;--c-fixed:#d95926;--c-alt:#199e70;--c-cash:#c98500;--c-sector:#3987e5;
  --h0:#3A4250;--h1:#7E4424;--h2:#9C4A20;--h3:#D0612A;--h4:#EF8C5A;--h5:#F9C6A4;
  --sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 12px 32px -12px rgba(0,0,0,.7);--sh-3:0 18px 44px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0B0E13;--paper:#141922;--paper-2:#1A202B;--inset:#10151D;
  --fg:#E6E9EF;--fg-2:#B6BDC9;--muted:#8A93A1;--line:#262E3B;--line-2:#1E2531;
  --brand:#3FB7A0;--brand-2:#2F9C88;--brand-tint:#10302A;--brand-ink:#8FE6D5;--on-brand:#04140F;
  --amber:#D79A46;--amber-tint:#2A2214;--red:#E2777C;--red-tint:#2C171A;--blue:#6FA0DA;--blue-tint:#14202F;
  --gain:#40C48D;--loss:#E0736F;--focus:#3FB7A0;
  --c-equity:#3987e5;--c-fixed:#d95926;--c-alt:#199e70;--c-cash:#c98500;--c-sector:#3987e5;
  --h0:#3A4250;--h1:#7E4424;--h2:#9C4A20;--h3:#D0612A;--h4:#EF8C5A;--h5:#F9C6A4;
  --sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 12px 32px -12px rgba(0,0,0,.7);--sh-3:0 18px 44px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--canvas);color:var(--fg);font:14px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.serif{font-family:"Newsreader",Georgia,serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .pos{color:var(--gain)} .neg{color:var(--loss)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 22px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;text-decoration:none;color:var(--fg)}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand)}
.brand .nm{font-family:"Newsreader",serif;font-size:20px;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs a{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--fg-2);font-weight:600;font-size:13px;white-space:nowrap}
.tabs a.on{background:var(--paper);color:var(--fg);box-shadow:var(--sh-1)}
.tabs a svg{width:15px;height:15px}
.lbl-short{display:none}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)}
.who select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 8px}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:32px;height:32px;display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}

main{max-width:1240px;margin:0 auto;padding:22px 22px 70px}
h1{font-family:"Newsreader",serif;font-weight:500;font-size:30px;line-height:1.15;margin:0}
h2{font-family:"Newsreader",serif;font-weight:500;font-size:22px;margin:0}
h3{font-size:14px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--fg-2);font-weight:600;padding:4px 0;margin-bottom:12px}
.back:hover{color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.chip.flag{background:var(--amber-tint);border-color:transparent;color:var(--amber);font-weight:600}
button.chip{cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.seg.sm button{padding:3px 8px;font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ask atlas */
.ask{min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0}
.ask .inner{width:100%;max-width:640px}
.ask .hello{text-align:center;margin-bottom:22px}
.ask .hello .orb{width:46px;height:46px;border-radius:14px;margin:0 auto 14px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand);box-shadow:var(--sh-2)}
.ask .hello h1{font-size:32px}
.chatbox{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);overflow:hidden}
.stream{max-height:46vh;overflow-y:auto;padding:16px 16px 4px;display:flex;flex-direction:column;gap:10px}
.stream:empty{display:none}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--paper-2);border:1px solid var(--line-2);border-bottom-left-radius:4px}
.msg.a .act{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.msg.a ul{margin:6px 0 0;padding-left:18px}
.composer{display:flex;gap:8px;align-items:center;padding:10px 10px 10px 16px;border-top:1px solid var(--line-2)}
.stream:empty+.composer{border-top:0}
.composer input{flex:1;border:0;background:none;outline:none;font-size:15px;padding:8px 0;min-width:0}
.composer button{width:38px;height:38px;border-radius:10px;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.prompts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.bubble{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;box-shadow:var(--sh-1);display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
.bubble:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.bubble svg{width:16px;height:16px;color:var(--brand)}
.ask .foot{text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* page heads */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.phead .l{min-width:0}

/* heat map of bubbles */
.heat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:6px 2px 4px}
.hb{position:relative;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--h0);border-radius:10px;padding:14px 16px 13px;text-align:left;min-height:122px;display:flex;flex-direction:column;justify-content:space-between;color:var(--fg);box-shadow:var(--sh-1);transition:box-shadow .15s,border-color .15s}
.hb:hover{box-shadow:var(--sh-2)}
.hb.sel{border-color:var(--fg-2);box-shadow:0 0 0 1px var(--fg-2),var(--sh-2)}
.hb .t{font-weight:700;font-size:14px;line-height:1.25}
.hb .tg{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;font-weight:600}
.hb .n{font-family:"Newsreader",serif;font-size:30px;line-height:1;font-weight:500}
.hb .n small{font-family:"Public Sans",sans-serif;font-size:13px;font-weight:600;margin-left:4px;color:var(--fg-2)}
.hb .m{font-size:12.5px;color:var(--fg-2);margin-top:2px}
.hb.zero{box-shadow:none;color:var(--muted)}
.hb.zero .n{color:var(--muted)}
.hb.opp{min-height:150px}
.hb.opp .n{font-size:26px}
.oppd{margin-top:16px}
.oppd .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.oppg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;padding:14px 18px 18px}
.oppg ul{margin:8px 0 0;padding-left:18px;line-height:1.7}
.oppg p{margin:8px 0 12px}
@media (max-width:700px){.oppg{grid-template-columns:minmax(0,1fr)}.heat.og{grid-template-columns:minmax(0,1fr)}.hb.opp{min-height:0;gap:8px}}
.wf{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.wf-head .tg{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wf-head h1{margin:4px 0 4px}
.stepper{list-style:none;display:flex;gap:8px;padding:0;margin:16px 0;flex-wrap:wrap}
.stepper li{flex:1;min-width:150px}
.stepper button{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-weight:600;color:var(--fg-2);text-align:left}
.stepper button.on{border-color:var(--brand);color:var(--fg);box-shadow:0 0 0 1px var(--brand)}
.stepper button:disabled{opacity:.5;cursor:not-allowed}
.stepper .sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);border:1px solid var(--line);font-size:12px;flex:none}
.stepper .on .sn{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.stepper .done .sn{background:var(--brand-tint);color:var(--brand-ink);border-color:transparent}
.wf-sec{margin-bottom:16px}
.ai-z{border-left:3px solid #7c5cd6;background:color-mix(in srgb,#7c5cd6 7%,var(--paper));padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 18px 4px}
.ai-l{font-size:12px;font-weight:700;color:#6a4cc4}
:root[data-theme=dark] .ai-l{color:#b6a3f2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ai-l{color:#b6a3f2}}
.lede{font-size:15px;line-height:1.6;margin:6px 0 0}
.wf-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 24px;flex-wrap:wrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ocard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:14px 15px;box-shadow:var(--sh-1);transition:opacity .2s,transform .2s,box-shadow .2s}
.ocard:hover{box-shadow:var(--sh-2)}
.ocard.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand),var(--sh-2)}
.ocard.dim{opacity:.38;transform:scale(.97)}
.ocard.dim:hover{opacity:.8}
.ocard.add{border-style:dashed;border-left:4px dashed var(--line);background:var(--paper-2);justify-content:center}
.ocard .ot{font-weight:700}
.ocard .ob{font-size:12.5px;color:var(--fg-2);flex:1}
.otags{display:flex;gap:4px;flex-wrap:wrap}
.ofig{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:7px}
.ofig b{color:var(--fg)}
.hd2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.pad{padding:4px 18px 18px}
.trades{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.act{display:inline-block;min-width:44px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:1px 6px;margin-right:4px}
.act.sell{background:var(--red-tint);color:var(--red)}.act.buy{background:var(--brand-tint);color:var(--brand-ink)}.act.gift,.act.xfer{background:var(--blue-tint);color:var(--blue)}
table.imp td,table.imp th{padding:6px 8px}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmpr{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.cmpr .tr{position:relative;height:11px;background:var(--paper-2);border-radius:3px;margin:2px 0}
.cmpr .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0}
.cmpr .tr b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.shelf{margin-top:14px}
.shelf tr.go td{padding:7px 12px}
.shelf-f{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px}
.shelf-f input{width:150px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper)}
.report .rh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 22px;border-bottom:2px solid var(--fg)}
.report .tg{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.report .rh-r{text-align:right}.report .big{font-family:"Newsreader",serif;font-size:26px}
.report .rs{padding:14px 22px;border-bottom:1px solid var(--line-2)}
.report .rs h3{margin-bottom:8px}
.report .rs .ai-z{margin:0}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
tr.chg td{background:color-mix(in srgb,var(--brand) 5%,transparent)}
.wf-chat{position:sticky;top:72px;height:calc(100vh - 140px);min-height:420px;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1);overflow:hidden}
.wc-h{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.orb-s{width:28px;height:28px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.wc-x{margin-left:auto;display:none}
.wc-s{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.wc-s .msg{max-width:96%}
.wc-s .msg ul{margin:6px 0 0;padding-left:16px}
.wc-p{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:8px 12px;border-top:1px solid var(--line-2);max-height:200px;overflow-y:auto}
.wc-p .chip{background:var(--paper);cursor:pointer;white-space:normal;text-align:left}
.wc-f{padding:0 12px 10px}
.wf-chat .composer{border-top:1px solid var(--line-2)}
.fab{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:1100px){.wf{grid-template-columns:minmax(0,1fr)}
 .wf-chat{display:none;position:fixed;inset:auto 0 0 0;top:auto;height:78vh;border-radius:16px 16px 0 0;z-index:40;box-shadow:var(--sh-3)}
 body.chat-open .wf-chat{display:flex}
 .wc-x{display:grid}
 .fab{display:inline-flex;position:fixed;right:16px;bottom:16px;z-index:35;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;padding:12px 16px;border-radius:999px;box-shadow:var(--sh-3)}
 body.chat-open .fab{display:none}
 .rgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.stepper li{min-width:0}.stepper button{padding:8px;font-size:12.5px;gap:6px}.report .rh-r{text-align:left}.report .rs{padding:12px 14px}.cmpr{grid-template-columns:84px minmax(0,1fr) 56px}}
@media print{.top,.back,.stepper,.wf-nav,.wf-chat,.fab,.wf-head,#toast,.disc~*{display:none!important}body{background:#fff}main{padding:0;max-width:none}.wf{display:block}.card{box-shadow:none;border:0}.report .rs{break-inside:avoid}}
.glance .gl-h,.an-sec .gl-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.glance .gl-h{padding:16px 18px 0}
.glance .ai-z{margin:12px 18px 0}
.gl-kpis{padding:0 18px}
.gl-kpis .kpis{margin:12px 0 0}
.gl-ctl{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.gsplit{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px;align-items:start}
.gtbl td,.gtbl th{padding:7px 10px}
.gtbl tr.sub-row td:first-child{padding-left:28px;font-size:12.5px}
.gtbl tr.grp-row td{border-top:1px solid var(--line)}
.stance{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;white-space:nowrap}
.stance.overweight{color:var(--gain)}.stance.underweight{color:var(--loss)}.stance.neutral{color:var(--muted)}
.caption{font-size:12px;color:var(--muted);margin:10px 0 0}
.tmwrap{margin-top:4px}
.an-sec{margin:18px 0 6px}
.angrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}

/* ---------- Household opportunities: a heat map of actions for THIS household ----------

   (heat = impact on the household), with its evidence and a suggested next step. */
const OPP_HEAT=[.01,.03,.06,.10];           // share of household: ≤1%, ≤3%, ≤6%, ≤10%, >10%
const shareStep=x=>x<=0?0:x<=OPP_HEAT[0]?1:x<=OPP_HEAT[1]?2:x<=OPP_HEAT[2]?3:x<=OPP_HEAT[3]?4:5;
const nm=sym=>sym.length>8?SEC[sym].name:sym;
function opps(h){
  const m=M(h),out=[];
  const add=(k,o)=>{const e=ev(k,h);if(e)out.push({k,...o(e)})};
  add('advisory',e=>{const E=advElig(h);return{title:'Move brokerage assets to the Advisory program',big:money(e.v),share:e.v/m.aum,step:Math.max(3,shareStep(e.v/m.aum)),
    sub:`${E.short} · ${money(h.brk.commissions12m)} commissions in 12 months`,why:[`${money(e.v)} in brokerage (${pct(e.v/m.aum)} of the household); ${h.brk.trades12m} trades and ${money(h.brk.commissions12m)} in commissions over 12 months`,`Eligibility: ${esc(E.label)}`,...E.conds.map(c=>`${esc(c.t)} (owner: ${esc(c.o)})`),e.d.length?`Reasons for ongoing advice: ${e.d.map(c=>esc(CK[c].label.toLowerCase())).join(', ')}`:'Commissions are high for the assets'],
    next:E.status==='specialist'?'Refer the concentrated position to the specialist; consider enrolling the rest.':'Compare program strategies and the pace of the move, then propose. Deliver Form CRS and the program brochure first.',syms:brokerage(h).pos.map(x=>x.sym)}});
  add('downgrades',e=>({title:'Review downgraded holdings',big:money(e.v),share:e.v/m.aum,step:shareStep(e.v/m.aum),
    sub:e.d.map(x=>`${nm(x.sym)} ${SEC[x.sym].prev} → ${SEC[x.sym].rating}`).join(' · '),
    why:e.d.map(x=>`<b>${esc(nm(x.sym))}</b> <span class="dg">${esc(SEC[x.sym].prev)} → ${esc(SEC[x.sym].rating)}</span> on ${shortDate(SEC[x.sym].changed)} · ${money(x.mv)} (${pct(x.mv/m.aum)}) · unrealized ${x.allnocost?'n/a':signMoney(x.u)}`),
    next:'Review each position against Research’s replacement ideas, and check the tax cost of switching before you sell.',syms:e.d.map(x=>x.sym)}));
  add('maturing',e=>{const f=e.d[0],fs=SEC[f.sym];return{title:'Reinvest maturing bonds & CDs',big:money(e.v),share:e.v/m.aum,step:Math.max(shareStep(e.v/m.aum),days(fs.maturity)<=60?4:0),
    sub:`First: ${nm(f.sym)} on ${shortDate(fs.maturity)} (${days(fs.maturity)} days)`,
    why:e.d.map(x=>`${esc(SEC[x.sym].name)} · matures ${fmtDate(SEC[x.sym].maturity)} (${days(SEC[x.sym].maturity)} days) · ${money(x.mv)} at ${pct(SEC[x.sym].yld,2)}`),
    next:`Agree a reinvestment plan before ${shortDate(fs.maturity)}: extend the ladder or move into core bonds, keeping fixed income near its ${pct(m.t.fixed,0)} target (now ${pct(m.w.fixed)}).`,syms:e.d.map(x=>x.sym)}});
  add('concentration',e=>{const trim=e.d.reduce((a,x)=>a+Math.max(0,x.mv-.10*m.aum),0);return{title:'Reduce single-stock concentration',big:money(trim),share:trim/m.aum,step:Math.max(3,shareStep(trim/m.aum)),
    sub:e.d.map(x=>`${x.sym} ${pct(x.mv/m.aum)} of household`).join(' · ')+' · amount above 10%',
    why:e.d.map(x=>`<b>${esc(x.sym)}</b> ${money(x.mv)} = ${pct(x.mv/m.aum)} of the household; ${money(x.mv-.10*m.aum)} above the 10% guideline · unrealized ${x.allnocost?'n/a':signMoney(x.u)}${x.nocost?' (one lot has no basis)':''}`),
    next:'Trim toward 10% over several tax years within the gain budget, or consider an exchange fund, a collar, or gifting low-basis shares to charity.',syms:e.d.map(x=>x.sym)}});
  add('cash',e=>{const under=L1.filter(([g])=>g!=='cash'&&m.w[g]<m.t[g]-.01).map(([g,l])=>`${l} (${pts(m.w[g]-m.t[g])})`);return{title:'Put excess cash to work',big:money(e.v),share:e.v/m.aum,step:shareStep(e.v/m.aum),
    sub:`Cash ${pct(m.w.cash)} vs ${pct(m.t.cash,0)} target`,why:[`Cash ${money(m.l1.cash)} = ${pct(m.w.cash)} of the household; target ${pct(m.t.cash,0)}`,under.length?`Below target: ${under.join(', ')}`:'No group is below target'],
    next:`Invest the excess in stages${under.length?' toward '+under.map(x=>x.split(' (')[0].toLowerCase()).join(' and '):''}, keeping enough cash for known withdrawals.`,syms:['CASH']}});
  add('drift',e=>({title:'Rebalance to target',big:money(e.v),share:e.v/m.aum,step:shareStep(e.v/m.aum),
    sub:`${L1L[m.drift.k]} ${pts(m.drift.d)} from target`,why:L1.map(([g,l])=>`${l}: ${pct(m.w[g])} vs ${pct(m.t[g],0)} target (${pts(m.w[g]-m.t[g])})`),
    next:'Rebalance toward target, using cash and maturing bonds first and tax-loss sales next, to keep realized gains low.',syms:[]}));
  add('harvest',e=>{const L=m.pos.filter(x=>!x.allnocost&&x.u<0&&x.sym!=='CASH').sort((a,b)=>a.u-b.u);return{title:'Harvest tax losses',big:money(e.v),share:e.v/m.aum,step:shareStep(e.v/m.aum),
    sub:`Largest: ${nm(L[0].sym)} ${signMoney(L[0].u)}`,why:L.slice(0,6).map(x=>`<b>${esc(nm(x.sym))}</b> ${signMoney(x.u)} on ${money(x.mv)}`),
    next:'Sell positions with losses and buy similar (not identical) exposure to keep the allocation; observe the 30-day wash-sale rule.',syms:L.map(x=>x.sym)}});
  add('gains',e=>{const G=m.pos.filter(x=>!x.allnocost&&x.u>0).sort((a,b)=>b.u-a.u);return{title:'Plan for embedded gains',big:money(e.v),share:e.v/m.aum,step:shareStep(e.v/m.aum),
    sub:`Largest: ${nm(G[0].sym)} ${signMoney(G[0].u)}`,why:G.slice(0,5).map(x=>`<b>${esc(nm(x.sym))}</b> ${signMoney(x.u)} on ${money(x.mv)}`),
    next:'Spread sales across tax years, offset with harvested losses, and consider gifting appreciated shares.',syms:G.slice(0,5).map(x=>x.sym)}});
  add('basis',e=>({title:'Fix missing cost basis',big:money(e.v),share:e.v/m.aum,step:Math.max(2,shareStep(e.v/m.aum)),
    sub:e.d.map(x=>x.sym).join(', ')+' without basis on file',why:e.d.map(x=>`<b>${esc(nm(x.sym))}</b> · ${money(x.mv)} has at least one lot with no cost basis`),
    next:'Request the basis from the client or the transferring firm before any sale, so gains can be reported correctly.',syms:e.d.map(x=>x.sym)}));
  add('behind',e=>{const g=h.ytdReturn-m.bench;return{title:'Explain the performance gap',big:`${g.toFixed(1)} pts`,share:null,step:g<-4?5:g<-3?4:3,
    sub:`YTD ${h.ytdReturn.toFixed(1)}% vs ${m.bench.toFixed(1)}% benchmark`,why:[`Benchmark for a ${esc(h.risk)} profile: ${m.bench.toFixed(1)}% year to date`,`Largest drift: ${L1L[m.drift.k]} ${pts(m.drift.d)}`],
    next:'Use performance attribution to show whether the allocation or the holdings caused the gap, before the next review.',syms:[]}});
  add('meetings',e=>({title:'Prepare for the upcoming meeting',big:meetWhen(h.nextMeeting.inDays),share:null,step:h.nextMeeting.inDays<=3?5:h.nextMeeting.inDays<=7?4:3,
    sub:h.nextMeeting.type,why:[esc(h.nextMeeting.note)],next:'Bring the top opportunities on this page to the meeting, with the figures above.',syms:[]}));
  add('cio',e=>({title:'Align with the CIO house view',big:'High',share:null,step:3,sub:h.cio.view,why:[esc(h.cio.view)],
    next:'Discuss the difference from the house view; document the client’s reasons if they want to keep it.',syms:[]}));
  add('programs',e=>({title:'Offer eligible programs',big:String(e.d.length),share:null,step:e.d.length>=7?3:2,sub:e.d.slice(0,3).join(', ')+(e.d.length>3?` +${e.d.length-3}`:''),
    why:e.d.map(x=>esc(x)),next:'Pick the one or two that fit the client’s goals and raise them at the next meeting.',syms:[]}));
  return out.sort((a,b)=>b.step-a.step||(b.share||0)-(a.share||0));
}

function portfolio(h){

     ${tblCap('Asset classes','Target splits each group’s target by the house model')}<div class="tw"><table><thead><tr><th>Class</th><th class="num">Value</th><th class="num">Current</th><th class="num">Target</th><th class="num">Difference</th><th class="num">Positions</th><th></th></tr></thead><tbody>${trs}</tbody></table></div>`;
  }

     <div class="bars">${bars}</div><div class="lg" style="margin-top:10px"><span><i style="background:var(--c-sector)"></i>Client</span><span><i style="background:var(--fg-2);width:2px;height:12px;border-radius:1px"></i>Benchmark</span><span class="muted">Select a sector to see the holdings behind it.</span></div>
     ${tblCap('Sectors','% of equity')}<div class="tw"><table><thead><tr><th>Sector</th><th class="num">Exposure</th><th class="num">Client</th><th class="num">Benchmark</th><th class="num">Difference</th><th>Largest contributors</th><th></th></tr></thead><tbody>
     ${ks.map(k=>{const w=(m.sect[k]||0)/m.eq,b=DATA.benchSect[k]||0;return`<tr class="go" tabindex="0" data-go="${lvlHref(h,'holdings','s:'+k)}"><td>${DATA.sectors[k]}</td><td class="num">${money(m.sect[k]||0)}</td><td class="num">${pct(w)}</td><td class="num">${pct(b)}</td><td class="num ${w-b>.10?'neg':''}">${pts(w-b)}</td><td class="small">${esc(top(k))}</td><td class="arrow">›</td></tr>`}).join('')}</tbody></table></div>`;
  }

  let label=null;
  if(f&&f.startsWith('c:')){const c=f.slice(2);pos=pos.filter(x=>x.s.l2===c);label=L2[c][1]}
  if(f&&f.startsWith('o:')){const o=opps(h).find(o=>o.k===f.slice(2));if(o){const set=new Set(o.syms);pos=pos.filter(x=>set.has(x.sym));label='Positions behind: '+o.title}}
  if(f&&f.startsWith('s:')){const k=f.slice(2);pos=pos.map(x=>{const lk=x.s.sector?{[x.s.sector]:1}:(L2[x.s.l2][0]==='equity'?DATA.look[x.s.look]||{}:{});return{...x,exp:x.mv*(lk[k]||0)}}).filter(x=>x.exp>0).sort((a,b)=>b.exp-a.exp);label=DATA.sectors[k]+' (look-through)'}
  const sectorMode=f&&f.startsWith('s:');

  return`${label?filterBar(h,label):''}${tm}<div class="lg" style="margin-top:10px">${L1.map(([k,l])=>`<span><i style="background:var(--c-${k})"></i>${l}</span>`).join('')}<span class="muted">Tile size is value${sectorMode?' of sector exposure':''}.</span></div>

let BAR_MAX=.8;

/* SVG: donut */
function donut(items,center,sub){
  const W=260,R=110,r=70,cx=W/2,cy=W/2,tot=items.reduce((a,x)=>a+x.v,0);let a0=-Math.PI/2,out='';
  for(const it of items){const a1=a0+it.v/tot*2*Math.PI,large=a1-a0>Math.PI?1:0,p=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
    const[x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);
    const d=items.length===1?`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`:`M${x0} ${y0}A${R} ${R} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${large} 0 ${x3} ${y3}Z`;
    out+=`<path d="${d}" fill="${it.c}" stroke="var(--paper)" stroke-width="2" style="cursor:pointer" data-go="${it.href}" data-tip="${esc(it.l)}: ${money(it.v)} · ${pct(it.v/tot)}"/>`;a0=a1}
  return`<svg class="svgchart" viewBox="0 0 ${W} ${W}" width="100%" style="max-width:300px;display:block;margin:0 auto" role="img" aria-label="Asset groups donut chart">${out}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-family="Newsreader,serif" font-size="26" fill="var(--fg)">${esc(center)}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(sub)}</text></svg>
   <div class="lg" style="justify-content:center;margin-top:8px">${items.map(i=>`<span><i style="background:${i.c}"></i>${esc(i.l)} ${pct(i.v/tot,0)}</span>`).join('')}</div>`;
}
/* SVG: squarified treemap */
function treemap(items){
  items=items.filter(x=>x.v>0).sort((a,b)=>b.v-a.v);if(!items.length)return'<div class="empty">No holdings.</div>';
  const W=1000,H=360;let rects=[];const tot=items.reduce((a,x)=>a+x.v,0),scale=W*H/tot;
  const nodes=items.map(x=>({...x,a:x.v*scale}));
  function worst(row,w){const s=row.reduce((a,x)=>a+x.a,0),mx=Math.max(...row.map(x=>x.a)),mn=Math.min(...row.map(x=>x.a));return Math.max(w*w*mx/(s*s),s*s/(w*w*mn))}
  function lay(row,x,y,w,h){const s=row.reduce((a,n)=>a+n.a,0);if(w>=h){const rw=s/h;let yy=y;for(const n of row){const nh=n.a/rw;rects.push({...n,x,y:yy,w:rw,h:nh});yy+=nh}return[x+rw,y,w-rw,h]}else{const rh=s/w;let xx=x;for(const n of row){const nw=n.a/rh;rects.push({...n,x:xx,y,w:nw,h:rh});xx+=nw}return[x,y+rh,w,h-rh]}}
  let x=0,y=0,w=W,h=H,row=[],i=0;
  while(i<nodes.length){const side=Math.min(w,h),n=nodes[i];if(!row.length||worst([...row,n],side)<=worst(row,side)){row.push(n);i++}else{[x,y,w,h]=lay(row,x,y,w,h);row=[]}}
  if(row.length)lay(row,x,y,w,h);
  const body=rects.map(r=>{const show=r.w>70&&r.h>34;return`<g><rect x="${r.x+1}" y="${r.y+1}" width="${Math.max(0,r.w-2)}" height="${Math.max(0,r.h-2)}" rx="4" fill="${r.c}" data-tip="${esc(r.tip)}"/>${show?`<text x="${r.x+9}" y="${r.y+22}" font-size="14" font-weight="700" fill="${r.ink}" pointer-events="none">${esc(r.l.length>Math.floor(r.w/8.5)?r.l.slice(0,Math.max(3,Math.floor(r.w/8.5)-1))+'…':r.l)}</text>${r.h>52?`<text x="${r.x+9}" y="${r.y+40}" font-size="12.5" fill="${r.ink}" opacity=".92" pointer-events="none">${money(r.v)}</text>`:''}`:''}</g>`}).join('');
  return`<svg class="svgchart tm" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;height:auto;aspect-ratio:${W}/${H};max-height:380px" role="img" aria-label="Holdings treemap">${body}</svg>`;
}

/* =================== Opportunity workflow: 1 Recap · 2 Solutions · 3 Proposal =================== */
const TAX_RATE=.238;               // illustrative long-term federal rate incl. 3.8% NIIT; state tax excluded
const VOL={USL:.16,USM:.20,INTL:.17,EM:.22,UST:.06,CORE:.055,MUNI:.045,CORP:.07,HY:.09,CD:.01,PE:.22,RE:.15,HF:.08,CASH:.005};
const RHO={equity:{equity:.85,fixed:.1,alt:.6,cash:0},fixed:{equity:.1,fixed:.6,alt:.2,cash:0},alt:{equity:.6,fixed:.2,alt:.5,cash:0},cash:{equity:0,fixed:0,alt:0,cash:1}};
const REP={USL:'VTI',USM:'IJH',INTL:'IEFA',EM:'VWO',UST:'IEF',CORE:'AGG',MUNI:'MUB',CORP:'LQD',HY:'LQD',CD:'TBILL',PE:'ALT-MULTI',RE:'VNQ',HF:'ALT-MULTI',CASH:'CASH'};
const SWAP={VXUS:'IEFA',IEFA:'VEA',VEA:'IEFA',AGG:'BND',BND:'AGG',MUB:'MUNI-LAD',LQD:'CORP-LAD',QQQ:'VOO',ARKK:'IJH',VWO:'IEMG',IEF:'UST-LAD',HYG:'LQD',VTI:'VOO',VOO:'VTI',IJH:'IWM',VGT:'VOO',ESGV:'VTI',SCHD:'DIV-SMA'};
const WF={};                        // per household+opportunity: {opt, custom, showShelf, shelfSel, shelfAmt, chat}
const wfKey=(h,k)=>h.id+':'+k;
const W=(h,k)=>WF[wfKey(h,k)]??={opt:null,custom:null,showShelf:false,shelfSel:[],shelfAmt:null,shelfL1:'all',chat:[]};
const isTaxable=h=>!/Foundation|Institutional/.test(h.entity+' '+h.segment);
const repFor=(h,c)=>c==='MUNI'||(c==='CORE'&&false)?(isTaxable(h)?'MUB':'AGG'):REP[c];

/* ---- trade engine: apply trades to a copy of the holdings ---- */
function applyTrades(h,trades){
  const hs=h.holdings.map(x=>({...x}));let realized=0,unknown=0,proceeds=0,gifts=0,buys=0;const done=[];
  for(const t of trades.filter(t=>t.act==='move')){const lots=hs.filter(x=>x.sym===t.sym&&x.acct==='BRK'&&(t.nb===undefined||(x.cost==null)===t.nb));let a=0;for(const l of lots){l.acct='ADV';a+=l.mv}if(a>=1)done.push({...t,amt:a,gain:0})}
  for(const t of trades.filter(t=>t.act!=='buy'&&t.act!=='move')){
    const lots=hs.filter(x=>x.sym===t.sym&&(t.nb===undefined||(x.cost==null)===t.nb)),tot=lots.reduce((a,x)=>a+x.mv,0),amt=Math.min(t.amt,tot);if(amt<1)continue;
    let r=0,carried=0;
    for(const l of lots){const sh=l.mv/tot*amt;if(l.cost!=null){const cp=l.cost*sh/l.mv;if(t.act==='sell')r+=sh-cp;carried+=cp;l.cost-=cp}else if(t.act==='sell')unknown+=sh;l.mv-=sh}
    realized+=r;if(t.act==='gift')gifts+=amt;else proceeds+=amt;
    done.push({...t,amt,gain:t.act==='sell'?r:0,carried});
  }
  let want=trades.filter(t=>t.act==='buy').reduce((a,t)=>a+t.amt,0);
  const cashLot=()=>hs.find(x=>x.sym==='CASH')||(hs.push({sym:'CASH',mv:0,cost:0,acct:hs.some(x=>x.acct==='BRK')&&!hs.some(x=>x.acct==='ADV')?'BRK':'ADV'}),hs[hs.length-1]);
  const avail=proceeds+cashLot().mv;const scale=want>avail?avail/want:1;
  const carry=done.filter(t=>t.act==='xfer').reduce((a,t)=>a+t.carried,0),xferAmt=done.filter(t=>t.act==='xfer').reduce((a,t)=>a+t.amt,0);
  for(const t of trades.filter(t=>t.act==='buy')){const a=t.amt*scale;if(a<1)continue;buys+=a;
    const cost=t.inkind&&xferAmt?a*carry/xferAmt:a;hs.push({sym:t.sym,mv:a,cost,acct:t.acct||(hs.some(x=>x.acct==='ADV')?'ADV':'BRK')});done.push({...t,amt:a,gain:0})}
  const c=cashLot();c.mv+=proceeds-buys;c.cost=c.mv;
  return{holdings:hs.filter(x=>x.mv>=1),realized,unknown,gifts,trades:done,tax:Math.max(0,realized)*TAX_RATE};
}
/* ---- key metrics for a set of holdings ---- */
function KM(h,res,mgr=0,brk0){
  const m=M(h);let v=0;const cls=Object.entries(m.l2);
  for(const[a,wa]of cls)for(const[b,wb]of cls){const ga=L2[a][0],gb=L2[b][0];v+=(wa/m.aum)*(wb/m.aum)*VOL[a]*VOL[b]*(a===b?1:RHO[ga][gb])}
  const stocks=m.pos.filter(x=>SEC[x.sym].kind==='stock'),top=stocks[0];
  let dmax=0;for(const[g]of L1)dmax=Math.max(dmax,Math.abs(m.w[g]-m.t[g]));
  return{aum:m.aum,eq:m.w.equity,fixed:m.w.fixed,alt:m.w.alt,cash:m.w.cash,drift:dmax,top:top?top.mv/m.aum:0,topSym:top?top.sym:'—',inc:m.inc,yld:m.yld,vol:Math.sqrt(v),unreal:m.unreal,
    dg:m.pos.filter(x=>isDown(SEC[x.sym])).reduce((a,x)=>a+x.mv,0),npos:m.pos.length,adv:h.holdings.filter(x=>x.acct!=='BRK').reduce((a,x)=>a+x.mv,0)/m.aum,cost:annualCost(h,mgr,brk0).total,te:GA(h).te,harvTax:res&&isTaxable(h)?-res.trades.filter(x=>x.act==='sell'&&x.gain<0).reduce((a,x)=>a+x.gain,0)*TAX_RATE:0,taxMgd:isTaxable(h)&&mgr>0?h.holdings.filter(x=>x.acct!=='BRK'&&L2[SEC[x.sym].l2][0]==='equity').reduce((a,x)=>a+x.mv,0):0,realized:res?res.realized:0,tax:res?res.tax:0,gifts:res?res.gifts:0};
}
/* ---- building blocks for options ---- */
function gapBuys(h,amt,groups){
  const m=M(h);let gaps={};
  for(const c of Object.keys(L2)){const g=L2[c][0];if(g==='cash'||(groups&&!groups.includes(g)))continue;const t=m.t[g]*(DATA.l2split[g][c]||0);const d=t-(m.l2[c]||0)/m.aum;if(d>0)gaps[c]=d}
  if(!Object.keys(gaps).length){for(const c of Object.keys(L2)){const g=L2[c][0];if(g==='cash'||(groups&&!groups.includes(g)))continue;const t=m.t[g]*(DATA.l2split[g][c]||0);if(t>0)gaps[c]=t}}
  if(!Object.keys(gaps).length)gaps={USL:1};
  const tot=Object.values(gaps).reduce((a,b)=>a+b,0),buys={};
  for(const[c,d]of Object.entries(gaps)){const s=repFor(h,c);buys[s]=(buys[s]||0)+amt*d/tot}
  return Object.entries(buys).filter(([,a])=>a>=1000).map(([sym,a])=>({act:'buy',sym,amt:Math.round(a)}));
}
function overweightSells(h,frac){
  const m=M(h),out=[];
  for(const[g]of L1){const ex=(m.w[g]-m.t[g])*m.aum*frac;if(ex<=1000)continue;
    if(g==='cash'){out.push({act:'sell',sym:'CASH',amt:Math.round(ex)});continue}
    let left=ex;const ps=m.pos.filter(x=>L2[SEC[x.sym].l2][0]===g).sort((a,b)=>(a.allnocost?1e9:a.u/a.mv)-(b.allnocost?1e9:b.u/b.mv));
    for(const p of ps){if(left<=0)break;const a=Math.min(p.mv,left);out.push({act:'sell',sym:p.sym,amt:Math.round(a)});left-=a}}
  return out;
}
/* wash-sale guard: never buy back a security sold at a loss in the same proposal; use its swap instead */
function noWash(ts){const lossy=new Set(ts.filter(t=>t.act==='sell'&&t.loss).map(t=>t.sym));const alt=x=>{let y=SWAP[x]||REP[SEC[x].l2];if(lossy.has(y))y=SWAP[y]&&!lossy.has(SWAP[y])?SWAP[y]:'TBILL';return y};
  const out=[],by={};for(const t of ts){if(t.act==='buy'&&lossy.has(t.sym)){const y=alt(t.sym);const k=y+'|'+(t.acct||'');if(by[k])by[k].amt+=t.amt;else{by[k]={...t,sym:y};out.push(by[k])}}else out.push(t)}return out}
const sumSells=ts=>ts.filter(t=>t.act==='sell'||t.act==='xfer').reduce((a,t)=>a+t.amt,0);
const rebalance=(h,frac)=>{const s=overweightSells(h,frac),u=L1.filter(([g])=>g!=='cash'&&M(h).w[g]<M(h).t[g]).map(([g])=>g);return[...s,...gapBuys(h,sumSells(s),u.length?u:null)]};

/* ---- options for each opportunity ---- */
function optionsFor(h,k){
  if(k==='advisory')return ev(k,h)?advOptions(h):[];
  const m=M(h),e=ev(k,h),O=[];const add=(id,title,blurb,trades,note)=>O.push({id,title,blurb,trades,note});
  if(!e)return O;
  switch(k){
  case'concentration':{const x=e.d[0],trim=Math.round(x.mv-.10*m.aum);
    add('trim','Trim to 10% and diversify',`Sell ${money(trim)} of ${x.sym} now and invest it where the household is below target.`,[{act:'sell',sym:x.sym,amt:trim},...gapBuys(h,trim)]);
    add('phase','Phase the trim over 3 years',`Sell a third (${money(trim/3)}) this year to spread the tax; repeat in 2027 and 2028.`,[{act:'sell',sym:x.sym,amt:Math.round(trim/3)},...gapBuys(h,Math.round(trim/3))],'Shows year one only.');
    const g=Math.round(Math.min(trim*.4,.05*m.aum));add('gift','Gift low-basis shares',`Give ${money(g)} of ${x.sym} to the donor-advised fund: no capital gains tax and a charitable deduction.`,[{act:'gift',sym:x.sym,amt:g}],'Assets leave the household; the deduction is not shown.');
    add('collar','Protect with a collar',`Keep the shares; a zero-cost collar sets a floor and a cap on ${x.sym} for 12 months.`,[],'No change to holdings; limits downside and upside.');break}
  case'maturing':{const P=Math.round(e.v),sells=e.d.map(x=>({act:'sell',sym:x.sym,amt:Math.round(x.mv)}));
    add('ladder','Extend the ladder',`Reinvest the ${money(P)} into a 2–5 year Treasury ladder to lock in today’s yields.`,[...sells,{act:'buy',sym:'UST-LAD',amt:P}],'Shown as if reinvested at maturity.');
    const core=isTaxable(h)?'MUNI-LAD':'AGG';add('core',isTaxable(h)?'Municipal ladder (tax-free income)':'Move to core bonds',`Reinvest into ${SEC[core].name}.`,[...sells,{act:'buy',sym:core,amt:P}],'Shown as if reinvested at maturity.');
    add('gaps','Fill allocation gaps',`Use the proceeds to bring under-weight groups back toward target.`,[...sells,...gapBuys(h,P)],'Shown as if reinvested at maturity.');
    add('cash','Hold as cash for planned spending','Keep the proceeds in cash for known withdrawals.',sells,'Shown as if matured into cash.');break}
  case'cash':{const X=Math.round(e.v);
    add('now','Invest now toward target',`Invest the ${money(X)} excess where the household is below target.`,[{act:'sell',sym:'CASH',amt:X},...gapBuys(h,X)]);
    add('steps','Invest in 3 monthly steps',`Invest ${money(X/3)} now and the same in each of the next two months.`,[{act:'sell',sym:'CASH',amt:Math.round(X/3)},...gapBuys(h,Math.round(X/3))],'Shows the first step only.');
    add('tbill','Treasury bill ladder',`Keep it liquid but earn more: move the excess into a 0–12 month T-bill ladder.`,[{act:'sell',sym:'CASH',amt:X},{act:'buy',sym:'TBILL',amt:X}]);break}
  case'drift':case'cio':{
    add('full','Rebalance fully to target','Sell what is above target (lowest-gain lots first) and buy what is below.',rebalance(h,1));
    add('half','Go halfway now','Close half the gap now and the rest at the next review.',rebalance(h,.5));
    const ex=Math.max(0,Math.round((m.w.cash-m.t.cash)*m.aum));

    if(k==='cio')add('keep','Keep and document','Keep the current positioning and record the client’s reasons.',[]);break}
  case'harvest':{const L=m.pos.filter(x=>!x.allnocost&&x.u<0&&x.sym!=='CASH').sort((a,b)=>a.u-b.u);
    const swap=list=>noWash(list.flatMap(x=>{const to=SWAP[x.sym]||REP[SEC[x.sym].l2];return[{act:'sell',sym:x.sym,amt:Math.round(x.mv),loss:true},{act:'buy',sym:to,amt:Math.round(x.mv)}]}));

  case'downgrades':{const D=e.d,rep=list=>list.flatMap(x=>{const c=SEC[x.sym].l2,to=c==='CORP'||c==='MUNI'||c==='HY'?(isTaxable(h)&&c==='MUNI'?'MUNI-LAD':'CORP-LAD'):repFor(h,c);return[{act:'sell',sym:x.sym,amt:Math.round(x.mv)},{act:'buy',sym:to,amt:Math.round(x.mv)}]});
    add('replace','Replace with recommended alternatives','Sell each downgraded holding and buy a recommended product in the same asset class.',rep(D));

  case'gains':{const G=m.pos.filter(x=>!x.allnocost&&x.u>0&&x.sym!=='CASH').sort((a,b)=>b.u-a.u),x=G[0];
    const g=Math.round(Math.min(.05*m.aum,x.mv*.25));add('gift','Gift appreciated shares',`Give ${money(g)} of ${nm(x.sym)} to charity or family instead of cash.`,[{act:'gift',sym:x.sym,amt:g}],'Assets leave the household; the deduction is not shown.');
    const L=m.pos.filter(y=>!y.allnocost&&y.u<0&&y.sym!=='CASH'),loss=-L.reduce((a,y)=>a+y.u,0),sellAmt=Math.round(Math.min(x.mv,loss/(x.u/x.mv)));
    add('offset','Sell gains offset by losses',loss>0?`Sell ${money(sellAmt)} of ${nm(x.sym)} and harvest ${money(loss)} of losses so the net gain is close to zero.`:'No losses to offset with.',loss>0?noWash([{act:'sell',sym:x.sym,amt:sellAmt},...L.map(y=>({act:'sell',sym:y.sym,amt:Math.round(y.mv),loss:true})),...gapBuys(h,sellAmt+L.reduce((a,y)=>a+y.mv,0))]):[]);
    add('hold','Hold for the long term','Keep the positions; gains are not taxed until sold, and heirs may receive a step-up in basis.',[]);break}
  case'basis':add('prior','Request basis from the prior firm','Send a cost-basis request to the transferring firm.',[]);add('client','Ask the client for records','Ask for trade confirmations or gift records.',[]);add('restrict','Restrict sales until resolved','Flag the lots so they are not sold before the basis is known.',[]);break;
  case'behind':{const off=m.pos.filter(x=>['ARKK','QQQ','VGT','HYG'].includes(x.sym)||isDown(SEC[x.sym]));
    add('rebal','Rebalance to target','Bring the allocation back to the risk profile’s target.',rebalance(h,1));
    if(off.length)add('core','Swap satellite funds into core',`Move ${off.map(x=>nm(x.sym)).join(', ')} into core index funds in the same asset class.`,off.flatMap(x=>[{act:'sell',sym:x.sym,amt:Math.round(x.mv)},{act:'buy',sym:repFor(h,SEC[x.sym].l2),amt:Math.round(x.mv)}]));
    add('review','Review attribution first','Explain the gap with performance attribution before changing anything.',[]);break}
  case'meetings':{const top=opps(h).filter(o=>o.k!=='meetings').slice(0,3).map(o=>o.title.toLowerCase());
    add('opps','Opportunity-led agenda',`Lead with: ${top.join('; ')||'portfolio review'}.`,[]);add('annual','Standard annual review','Goals, risk profile, performance and the plan for next year.',[]);add('short','Short check-in','Confirm cash needs and any life changes.',[]);break}
  case'programs':{for(const p of e.d.slice(0,3)){const di=/Direct indexing/.test(p),v=M(h).pos.find(x=>x.sym==='VTI'||x.sym==='VOO');
    add(p,p,di&&v?`Move ${money(v.mv)} of ${v.sym} in kind into a direct indexing account to harvest losses stock by stock.`:`Introduce ${p.toLowerCase()} at the next meeting.`,di&&v?[{act:'xfer',sym:v.sym,amt:Math.round(v.mv)},{act:'buy',sym:'DI-US',amt:Math.round(v.mv),inkind:true}]:[])}break}
  }
  return O;
}

  case'concentration':{const x=e.d[0],t=Math.round(x.mv-.10*m.aum);return{sells:[{act:'sell',sym:x.sym,amt:t}],amt:t,label:`Sell ${money(t)} of ${x.sym}`}}
  case'maturing':return{sells:e.d.map(x=>({act:'sell',sym:x.sym,amt:Math.round(x.mv)})),amt:Math.round(e.v),label:`Proceeds of the maturing bonds and CDs`};
  case'downgrades':return{sells:e.d.map(x=>({act:'sell',sym:x.sym,amt:Math.round(x.mv)})),amt:Math.round(e.v),label:'Sell the downgraded holdings'};
  case'harvest':{const L=m.pos.filter(x=>!x.allnocost&&x.u<0&&x.sym!=='CASH');return{sells:L.map(x=>({act:'sell',sym:x.sym,amt:Math.round(x.mv)})),amt:Math.round(L.reduce((a,x)=>a+x.mv,0)),label:'Sell the positions with losses'}}
  case'drift':case'cio':case'behind':{const s=overweightSells(h,1);return{sells:s,amt:Math.round(sumSells(s)),label:'Sell what is above target'}}
  default:{const c=Math.round(Math.max((m.w.cash-m.t.cash)*m.aum,0)||m.l1.cash*.5);return{sells:[{act:'sell',sym:'CASH',amt:c}],amt:c,label:'Cash'}}

function allOptions(h,k){const w=W(h,k),O=optionsFor(h,k);if(w.custom)O.push(w.custom);

    best(x=>x.tax,-1).forEach(o=>(o.tags??=[]).push('Lowest tax'));best(x=>Math.round(x.inc),1).forEach(o=>(o.tags??=[]).push('Most income'));best(x=>+x.drift.toFixed(4),-1).forEach(o=>(o.tags??=[]).push('Closest to target'));if(k==='advisory'){best(x=>+x.te.toFixed(4),-1).forEach(o=>(o.tags??=[]).push('Lowest tracking error'));best(x=>Math.round(x.taxMgd/1e3),1).forEach(o=>(o.tags??=[]).push('Most tax-managed'))}}

/* ---- AI-style recap (deterministic in the prototype, grounded on the figures) ---- */
function recap(h,k){
  if(k==='advisory')return advRecap(h);
  const m=M(h),e=ev(k,h),o=opps(h).find(x=>x.k===k);let p='';
  switch(k){
  case'concentration':{const x=e.d[0];p=`${x.sym} has grown from a cost of ${x.allnocost?'an unknown amount':money(x.cost)} to ${money(x.mv)} and is now ${pct(x.mv/m.aum)} of the ${h.name}, more than ${Math.floor(x.mv/m.aum/.1)} times the 10% single-stock guideline. That leaves ${money(x.mv-.1*m.aum)} above the guideline. Because most of it is gain, selling it at once would realize a large taxable gain, so the choice is about pace and method as much as amount.`;break}
  case'maturing':{const f=e.d[0];p=`${e.d.length===1?'One holding matures':e.d.length+' holdings mature'} in the next ${S.book.horizon} months, ${money(e.v)} in all, starting with ${SEC[f.sym].name} on ${fmtDate(SEC[f.sym].maturity)}. Without a plan the proceeds fall into cash at ${pct(SEC.CASH.yld,1)}, and fixed income (now ${pct(m.w.fixed)} vs a ${pct(m.t.fixed,0)} target) would drop.`;break}
  case'cash':p=`Cash is ${money(m.l1.cash)}, ${pct(m.w.cash)} of the household against a ${pct(m.t.cash,0)} target: ${money(e.v)} more than planned. ${L1.filter(([g])=>g!=='cash'&&m.w[g]<m.t[g]-.01).map(([g,l])=>`${l} is ${pts(m.w[g]-m.t[g])} below target`).join('; ')||'No other group is below target'}.`;break;
  case'drift':case'cio':p=`The allocation has moved away from the ${h.risk} target: ${L1.filter(([g])=>Math.abs(m.w[g]-m.t[g])>.01).map(([g,l])=>`${l.toLowerCase()} ${pct(m.w[g])} vs ${pct(m.t[g],0)}`).join(', ')}. Moving back would shift about ${money(ev('drift',h)?ev('drift',h).v:0)}.${k==='cio'?` The CIO alignment score is High: ${h.cio.view.toLowerCase()}.`:''}`;break;
  case'harvest':p=`${money(e.v)} of unrealized losses sit in the portfolio, mostly in ${o.sub.replace('Largest: ','')}. Harvesting them now would bank losses to offset gains elsewhere (the household also has ${money(m.gain)} of unrealized gains) without changing the allocation, if the proceeds go into similar funds.`;break;
  case'downgrades':p=`Research has downgraded ${e.d.length===1?'one holding':e.d.length+' holdings'} in the last 90 days: ${e.d.map(x=>`${nm(x.sym)} from ${SEC[x.sym].prev} to ${SEC[x.sym].rating} on ${shortDate(SEC[x.sym].changed)}`).join('; ')}. Together they are ${money(e.v)}, ${pct(e.v/m.aum)} of the household.`;break;
  case'gains':p=`Unrealized gains total ${money(e.v)}, ${pct(e.v/m.aum)} of the household; ${o.sub.replace('Largest: ','the largest is ')}. Any rebalancing or trimming will realize part of this, so it shapes every other decision.`;break;
  case'basis':p=`${e.d.map(x=>nm(x.sym)).join(', ')} ${e.d.length>1?'have':'has'} lots worth ${money(e.v)} with no cost basis on file, so any sale would be reported without a basis. This needs fixing before the position can be trimmed or harvested.`;break;
  case'behind':p=`The household is up ${h.ytdReturn.toFixed(1)}% this year against ${m.bench.toFixed(1)}% for a ${h.risk} benchmark, ${(h.ytdReturn-m.bench).toFixed(1)} pts behind. The largest difference from target is ${L1L[m.drift.k].toLowerCase()} at ${pts(m.drift.d)}.`;break;
  case'meetings':p=`${h.nextMeeting.type} ${meetWhen(h.nextMeeting.inDays).toLowerCase()}. ${h.nextMeeting.note} ${opps(h).length-1} other opportunities are open for this household.`;break;
  case'programs':p=`The household is eligible for ${e.d.length} programs or overlays it does not use yet: ${e.d.join(', ')}.`;break;
  }
  const extra=[];if(k!=='meetings'&&h.nextMeeting&&h.nextMeeting.inDays<=21)extra.push(`The next meeting is ${meetWhen(h.nextMeeting.inDays).toLowerCase()} (${h.nextMeeting.type.toLowerCase()}), a natural moment to raise it.`);
  if(k!=='cio'&&h.cio.score!=='Low')extra.push(`CIO view for this client: ${h.cio.view}.`);
  return p+(extra.length?' '+extra.join(' '):'');
}

  const row=IMP.find(r=>r[1].toLowerCase()===lab)||(RISKK[lab]?IMP.find(r=>r[0]===RISKK[lab]):null);
  if(!row)return`I can explain the figures in the impact table for “${esc(sel.title)}”.`;
  const[key,l,f]=row,a=base[key],b=sel.km[key],tr=sel.res.trades,big=(x,n=3)=>[...x].sort((p,q)=>q.amt-p.amt).slice(0,n).map(t=>`${esc(nm(t.sym))} ${money(t.amt)}`).join(', ');
  const sells=tr.filter(t=>t.act==='sell'),buys=tr.filter(t=>t.act==='buy'),moves=tr.filter(t=>t.act==='move'||t.act==='xfer');
  const sum=x=>x.reduce((s,t)=>s+t.amt,0);let why='';
  if(['eq','fixed','alt','cash','drift','te','vol'].includes(key))why=sells.length||buys.length?`It sells ${money(sum(sells))}${sells.length?` (${big(sells)})`:''} and buys ${money(sum(buys))}${buys.length?` (${big(buys)})`:''}, moving the mix toward the ${esc(h.risk)} target.`:'This option makes no trades, so the mix does not change.';
  else if(key==='top'){const s=sells.filter(t=>t.sym===base.topSym);why=s.length?`It sells ${money(sum(s))} of ${esc(base.topSym)}.`:`${esc(base.topSym)} is not sold in this option.`}
  else if(key==='tax'||key==='realized'){const g=sells.filter(t=>t.gain>0).sort((p,q)=>q.gain-p.gain);why=g.length?`Gains come from ${g.slice(0,3).map(t=>`${esc(nm(t.sym))} (${money(t.gain)})`).join(', ')}${sells.some(t=>t.gain<0)?`, offset by ${money(-sells.filter(t=>t.gain<0).reduce((s,t)=>s+t.gain,0))} of losses`:''}; tax at ${pct(TAX_RATE)}.`:'No gains are realized.'}
  else if(key==='harvTax'){const L=sells.filter(t=>t.gain<0);why=L.length?`Losses harvested: ${L.slice(0,3).map(t=>`${esc(nm(t.sym))} (${money(-t.gain)})`).join(', ')}, each replaced with a similar fund.`:'No losses are harvested.'}
  else if(key==='inc'||key==='yld')why=buys.length?`New income comes from ${big(buys)}; sales remove the income of ${sells.length?big(sells):'nothing'}.`:'Income changes only through the sales.';
  else if(key==='dg'){const s=sells.filter(t=>isDown(SEC[t.sym]));why=s.length?`It sells downgraded ${big(s)}.`:'No downgraded holding is sold.'}
  else if(key==='adv'||key==='taxMgd')why=`${money(sum(moves))} moves in kind${buys.length?` and ${money(sum(buys))} is bought inside the program`:''}.`;
  else if(key==='unreal')why=`Selling realizes gains and losses, so less stays unrealized.`;
  return`<b>${esc(l)}</b> for “${esc(sel.title)}”: ${f(a)} → <b>${f(b)}</b>. ${why}`;
}

  if(c.kind==='guide')guideStart(h,k);

      chips:[{label:`Select “${a.title}”`,kind:'select',val:a.id},{label:`Select “${b.title}”`,kind:'select',val:b.id}]})}

function cioKey(t){for(const[k,l]of CIO_LBL())if(t.includes(l))return k;return null}
function cioAnswer(k,h){const g=k.startsWith('g:'),x=k.slice(2),st=g?CIO.groups[x]:CIO.classes[x],lab=g?L1L[x]:L2[x][1];let fit='';
  if(h){const m=M(h),w=g?m.w[x]:(m.l2[x]||0)/m.aum,t=g?m.t[x]:tl2(m,x),d=w-t;

/* ---- the book's priorities: used on Book view, and for "where should I start?" anywhere ---- */
function bookPriorities(){
  const H=HH(),out=[];
  for(const it of workItems().filter(x=>x.due).slice(0,2))out.push({html:`<b>${esc(it.h.name)}</b>: ${esc(lc(it.title))}, ${esc(dueLabel(it.r.rem.at))} (${esc(it.r.rem.what.toLowerCase())})`,act:{label:`Resume ${shortName(it.h)}`,href:it.href}});
  {const it=workItems().find(x=>!x.due&&!x.snz);if(it)out.push({html:`<b>${esc(it.h.name)}</b>: you left ${esc(lc(it.title))} at Step ${it.r.step} ${esc(whenLabel(it.r.upd))}${it.r.optTitle?` (${esc(lc(it.r.optTitle))})`:''}`,act:{label:`Resume ${shortName(it.h)}`,href:it.href}})}
  const mat=H.flatMap(h=>{const e=ev('maturing',h);return e?e.d.map(x=>({h,x,d:days(SEC[x.sym].maturity)})):[]}).filter(z=>z.d>=0).sort((a,b)=>a.d-b.d)[0];
  if(mat&&mat.d<=45)out.push({html:`<b>${esc(mat.h.name)}</b>: ${esc(SEC[mat.x.sym].name)} (${money(mat.x.mv)}) matures in ${mat.d} days`,act:{label:`Start with ${shortName(mat.h)}`,href:oppHref(mat.h,'maturing')}});
  const mt=H.filter(h=>h.nextMeeting&&h.nextMeeting.inDays<=7).map(h=>[h,opps(h).filter(o=>!['meetings','programs','cio'].includes(o.k)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]||a[0].nextMeeting.inDays-b[0].nextMeeting.inDays)[0];
  if(mt)out.push({html:`<b>${esc(mt[0].name)}</b>: ${esc(mt[0].nextMeeting.type.toLowerCase())} ${meetWhen(mt[0].nextMeeting.inDays).toLowerCase()}, with ${mt[1]} open opportunities`,act:{label:`Prepare ${shortName(mt[0])}`,href:`#/client/${mt[0].id}`}});
  const ye=Math.round((new Date(ASOF.getFullYear(),11,31)-ASOF)/864e5);
  const hv=H.map(h=>[h,ev('harvest',h)]).filter(x=>x[1]).sort((a,b)=>b[1].v-a[1].v)[0];
  if(hv)out.push({html:`<b>${esc(hv[0].name)}</b>: ${money(hv[1].v)} of losses to harvest, ${ye} days before year-end`,act:{label:`Harvest for ${shortName(hv[0])}`,href:oppHref(hv[0],'harvest')}});
  const ad=H.map(h=>[h,ev('advisory',h)]).filter(x=>x[1]&&advElig(x[0]).status!=='specialist').sort((a,b)=>b[1].v-a[1].v)[0];
  if(ad){const K=advKey(ad[0]);out.push({html:`<b>${esc(ad[0].name)}</b>: ${money(ad[1].v)} in brokerage; tracking error ${pct(K.a.te,1)} → ${pct(K.b.te,1)} in the program`,act:{label:`Move ${shortName(ad[0])}`,href:oppHref(ad[0],'advisory')}})}
  return out.slice(0,3);
}

/* ---- why a household is on a criterion ---- */
function reasonFor(k,h,e){const m=M(h);
  switch(k){
    case'advisory':{const K=advKey(h);return`${money(e.v)} in brokerage; ${K.b.te<K.a.te-.001?`tracking error ${pct(K.a.te,1)} → ${pct(K.b.te,1)}`:`drift ${(K.a.drift*100).toFixed(1)} pts`}${K.losses>1?`, ${money(K.losses)} of losses to harvest in the move`:''}${advElig(h).status==='specialist'?' (specialist review first)':''}`}
    case'concentration':return e.d.map(x=>`${x.sym} is ${pct(x.mv/m.aum)} of the household`).join('; ');
    case'maturing':{const x=e.d[0];return`${money(e.v)} maturing; first ${nm(x.sym)} in ${days(SEC[x.sym].maturity)} days`}
    case'downgrades':return`${money(e.v)} downgraded: ${e.d.map(x=>`${nm(x.sym)} ${SEC[x.sym].prev} → ${SEC[x.sym].rating}`).join(', ')}`;
    case'cash':return`${money(e.v)} above target (cash ${pct(m.w.cash)} vs ${pct(m.t.cash,0)})`;
    case'drift':return`${L1L[m.drift.k]} ${pts(m.drift.d)} from target`;
    case'behind':return`${(h.ytdReturn-m.bench).toFixed(1)} pts behind its ${m.bench.toFixed(1)}% benchmark`;
    case'harvest':return`${money(e.v)} of unrealized losses`;
    case'gains':return`${money(e.v)} of embedded gains`;
    case'basis':return`${e.d.map(x=>x.sym).join(', ')} without cost basis`;
    case'meetings':return`${h.nextMeeting.type} ${meetWhen(h.nextMeeting.inDays).toLowerCase()}`;
    default:{const o=opps(h).find(x=>x.k===k);return o?o.sub:`${money(e.v)} ${CK[k].unit}`}}}

  if(c.kind==='book'){const s=summary(c.k);if(!s.n)return{html:`No households meet “${esc(CK[c.k].label)}” right now.`};
    const L=ranked(c.k),[h,e]=L[0],n2=L[1];

      acts:[{label:`Open ${shortName(h)}`,href:oppHref(h,c.k),primary:true},...(n2?[{label:`Why ${shortName(n2[0])}?`,q:`Why is ${n2[0].name} on this list?`}]:[])]}}

      acts:[{label:`Prepare ${shortName(wk[0][0])}`,href:`#/client/${wk[0][0].id}`,primary:true}]}}

function critAnswer(k,t,named){const s=summary(k),L=ranked(k);

function atlasAnswer(q){
  const t=q.toLowerCase().trim(),c=ctxOf();
  if(/take me|^book view|client dashboard/.test(t))return answer(q);
  if(/where (do|should) i start|start (today|with)|worth my time|focus (on )?today|priorit(y|ies) (today|this week)/.test(t))return prioritiesMsg();
  if(/on my plate|my work|in progress|left off|where was i|reminders?\b|what'?s due|what is due/.test(t)&&!/remind me/.test(t))return workAnswer();
  if(/remind me|revisit|follow up on|nudge me/.test(t)){const h=c.kind==='client'?c.h:nameHit(t);if(h){const r=reminderFromText(h,null,q);setTimeout(rerenderKeep,450);return r}return{html:'Which client? Open the client or the opportunity and ask again, or use <b>Remind me</b> in the workflow.'}}
  const named=nameHit(t);
  if(/cio|house view|stance|overweight|underweight/.test(t)){const k=cioKey(t);if(k)return{html:cioAnswer(k,c.kind==='client'?c.h:named)}}
  if(named&&/raise|meeting|prepare|brief|tell me about|summar|overview/.test(t))return clientAnswer(named,t)||answer(q);
  if(c.kind==='client'&&(!named||named.id===c.h.id)){const r=clientAnswer(c.h,t);if(r)return r}
  if(c.kind==='book'&&c.k){const r=critAnswer(c.k,t,named);if(r)return r}
  if(c.kind==='clients'&&/call|this week|most open|open items|who should/.test(t)){const L=HH().map(h=>[h,opps(h).filter(o=>!['meetings','programs','cio'].includes(o.k))]).sort((a,b)=>b[1].length-a[1].length).slice(0,4);
    return{html:`Most open items:<ul>${L.map(([h,O])=>`<li><b>${esc(h.name)}</b>: ${O.length} (${O.slice(0,2).map(o=>esc(lc(o.title))).join(', ')})${h.nextMeeting&&h.nextMeeting.inDays<=7?` · meeting ${meetWhen(h.nextMeeting.inDays).toLowerCase()}`:''}</li>`).join('')}</ul>`,acts:[{label:`Open ${shortName(L[0][0])}`,href:`#/client/${L[0][0].id}`,primary:true}]}}
  return answer(q);
}

/* =================== Work in progress and reminders ===================
   Each household + opportunity keeps a work record: status, the step reached, the option chosen, when it was last worked on,
   a snapshot of its key figures, and an optional reminder (a date, days before maturity, before the next meeting, or a cadence).
   Times are shown at day level: today, yesterday, a weekday, last week, or a date.
   Prototype: kept in this browser (localStorage) and seeded with sample work; "today" can be moved forward to show reminders firing. */
if(S.dayOff===undefined)S.dayOff=0;
const PROG={};
const isoD=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const TODAY=()=>new Date(ASOF.getTime()+S.dayOff*864e5);
const todayISO=()=>isoD(TODAY());
const addDays=(s,n)=>isoD(new Date(new Date(s+'T12:00:00').getTime()+n*864e5));
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const wkday=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'});
function whenLabel(s){const d=dayDiff(s,todayISO());return d<=0?'today':d===1?'yesterday':d<7?'on '+wkday(s):d<14?'last week':'on '+shortDate(s)}
function dueLabel(s){const d=dayDiff(todayISO(),s);return d<0?`overdue since ${shortDate(s)}`:d===0?'due today':d===1?'due tomorrow':d<7?`due ${wkday(s)}`:`due ${shortDate(s)}`}
const meetISO=h=>h.nextMeeting?addDays(isoD(ASOF),h.nextMeeting.inDays):null;
const ST_L={progress:'In progress',option:'Option chosen',drafted:'Proposal drafted',done:'Done'};
const pkey=(h,k)=>h.id+':'+k;
const workOf=(h,k)=>PROG[pkey(h,k)]||null;
const isDue=r=>r&&r.rem&&r.st!=='done'&&r.rem.at<=todayISO();
const isSnoozed=r=>r&&r.rem&&r.st!=='done'&&r.rem.at>todayISO();

/* ---- keep it across reloads (prototype: this browser only) ---- */
const WSTORE='atlas-work-v1';
function saveWork(){try{const wf={};for(const[k,w]of Object.entries(WF)){if(!PROG[k])continue;wf[k]={opt:w.opt==='custom'?null:w.opt,budget:w.budget,guide:w.guide,chat:(w.chat||[]).filter(m=>!m.typing).slice(-30)}}
  localStorage.setItem(WSTORE,JSON.stringify({dayOff:S.dayOff,prog:PROG,wf}))}catch(e){}}
function loadWork(){try{const d=JSON.parse(localStorage.getItem(WSTORE)||'null');if(!d)return false;S.dayOff=d.dayOff||0;Object.assign(PROG,d.prog||{});
  for(const[k,w]of Object.entries(d.wf||{}))WF[k]=Object.assign({opt:null,custom:null,showShelf:false,shelfSel:[],shelfAmt:null,shelfL1:'all',chat:[]},w);return true}catch(e){return false}}

/* ---- the figures we compare when someone comes back ---- */
function firstMat(h){const e=ev('maturing',h);if(!e)return null;const x=[...e.d].sort((a,b)=>SEC[a.sym].maturity<SEC[b.sym].maturity?-1:1)[0];return{sym:x.sym,date:SEC[x.sym].maturity,mv:x.mv}}
function snapOf(h,k){const w=W(h,k);let tax=null;if(w.opt){const{O}=allOptions(h,k),o=O.find(x=>x.id===w.opt);if(o)tax=o.km.tax}
  const fm=k==='maturing'?firstMat(h):null;return{md:fm?days(fm.date):null,tax,drift:M(h).drift.d,te:GA(h).te,aum:M(h).aum}}
function changesSince(h,k,a){if(!a)return[];const b=snapOf(h,k),out=[];
  if(a.md!=null&&b.md!=null&&a.md!==b.md){const fm=firstMat(h);out.push(`${nm(fm.sym)} now matures in ${b.md} days (was ${a.md})`)}
  if(a.tax!=null&&b.tax!=null&&Math.abs(a.tax-b.tax)>500)out.push(`tax for the chosen option ${money(b.tax)} (was ${money(a.tax)})`);
  if(Math.abs(a.drift-b.drift)>.002)out.push(`largest drift ${pts(b.drift)} (was ${pts(a.drift)})`);
  if(Math.abs(a.aum-b.aum)>a.aum*.005)out.push(`household ${money(b.aum)} (was ${money(a.aum)})`);
  return out}

/* ---- record a visit to the workflow; welcome the advisor back on a later day ---- */
function trackVisit(h,k,step){
  const key=pkey(h,k),t=todayISO(),entering=S.lastWf!==key,w=W(h,k);S.lastWf=key;guideOpen(h,k);
  let r=PROG[key];
  if(entering&&r&&r.st!=='done'&&r.upd&&r.upd<t){const ch=changesSince(h,k,r.snap);
    const gq=r.guide?`, guide question ${r.guide[0]} of ${r.guide[1]}`:'';
    w.chat.push({who:'a',html:`<b>Welcome back.</b> You left this ${whenLabel(r.upd)} at Step ${r.step}${r.optTitle?` with “${esc(r.optTitle)}” selected`:''}${gq}. ${ch.length?`Since then: ${ch.join('; ')}.`:'No changes in the figures since then.'}${isDue(r)?` This was your reminder (${esc(r.rem.label)}).`:''}`})}
  if(entering&&isDue(r)){if(r.rem.every){r.rem.at=addDays(t,r.rem.every);r.rem.label=remLabel(r.rem)}else delete r.rem}
  /* a glance at step 1 is not work yet: start a record once the advisor reaches step 2, picks an option or starts the guide */
  if(!r&&step<2&&!w.opt&&!(w.guide&&w.guide.i!=null)){saveWork();return}
  r=PROG[key]=r||{st:'progress',start:t,step:1};
  r.step=step;r.upd=t;if(w.opt&&r.st==='progress')r.st='option';if(!w.opt&&r.st==='option')r.st='progress';
  r.opt=w.opt||null;r.optTitle=null;if(w.opt){const{O}=allOptions(h,k),o=O.find(x=>x.id===w.opt);r.optTitle=o?o.title:null}
  r.guide=w.guide&&w.guide.i!=null&&w.guide.i<gqs(h,k).length?[w.guide.i+1,gqs(h,k).length]:null;
  r.snap=snapOf(h,k);saveWork();
}

/* ---- reminders ---- */
function remLabel(r){return r.every?`${r.every===7?'Weekly':r.every===30?'Monthly':'Quarterly'} · next ${shortDate(r.at)}`:`${r.what} · ${shortDate(r.at)}`}
function remindOptions(h,k){const t=todayISO(),out=[],add=(o,s)=>{if(o.at<=t)return;o.label=remLabel(o);if(!out.some(x=>x.label===o.label))out.push({...o,suggested:!!s})};
  const fm=firstMat(h),mt=meetISO(h);
  if(k==='maturing'&&fm){add({what:'2 days before maturity',at:addDays(fm.date,-2)},1);add({what:'30 days before maturity',at:addDays(fm.date,-30)})}
  if(k==='meetings'&&mt)add({what:'The day before the meeting',at:addDays(mt,-1)},1);
  if(k==='harvest')add({what:'Before the year-end window',at:`${TODAY().getFullYear()}-12-15`},1);
  if(k==='concentration')add({what:'Quarterly',every:91,at:addDays(t,91)},1);
  if(k==='basis')add({what:'Follow up with Operations',at:addDays(t,7)},1);
  if(!out.length&&mt)add({what:'Before the next meeting',at:addDays(mt,-1)},1);
  add({what:'Weekly',every:7,at:addDays(t,7)},!out.length);
  add({what:'Tomorrow',at:addDays(t,1)});add({what:'Next week',at:addDays(t,7)});
  if(mt)add({what:'Before the next meeting',at:addDays(mt,-1)});
  add({what:'Monthly',every:30,at:addDays(t,30)});
  return out}
function setReminder(h,k,o){const key=pkey(h,k),r=PROG[key]||(PROG[key]={st:'progress',start:todayISO(),step:1,upd:todayISO(),snap:snapOf(h,k)});
  r.rem={what:o.what,at:o.at,every:o.every||0,label:o.label||remLabel(o)};saveWork();return r.rem}
function parseReminder(h,k,t){const O=remindOptions(h,k),T=todayISO();let m;
  if(m=t.match(/(\d+)\s*days?\s*before\s*(the\s*)?(bond|cd|matur)/)){const fm=firstMat(h);if(fm)return{what:`${m[1]} days before maturity`,at:addDays(fm.date,-+m[1])}}
  if(/before (the )?(next )?meeting/.test(t)&&meetISO(h))return{what:'Before the next meeting',at:addDays(meetISO(h),-1)};
  if(/tomorrow/.test(t))return{what:'Tomorrow',at:addDays(T,1)};
  if(m=t.match(/in (\d+) days/))return{what:`In ${m[1]} days`,at:addDays(T,+m[1])};
  if(/weekly|every week/.test(t))return{what:'Weekly',every:7,at:addDays(T,7)};
  if(/monthly|every month/.test(t))return{what:'Monthly',every:30,at:addDays(T,30)};
  if(/quarterly|every quarter/.test(t))return{what:'Quarterly',every:91,at:addDays(T,91)};
  if(/next week|in a week/.test(t))return{what:'Next week',at:addDays(T,7)};
  return O.find(o=>o.suggested)||O[0]}
const OPP_HINT=[['maturing',/bond|cd\b|matur/],['harvest',/harvest|loss/],['advisory',/advisory|brokerage/],['concentration',/concentrat|single.stock/],['meetings',/meeting/],['cash',/cash/],['drift',/drift|rebalanc/],['downgrades',/downgrad/]];
function reminderFromText(h,k,q){const t=q.toLowerCase();if(!k){const O=opps(h);const hit=OPP_HINT.find(([kk,re])=>re.test(t)&&O.some(o=>o.k===kk));k=hit?hit[0]:(O[0]||{}).k}
  if(!k)return{html:`${esc(h.name)} has no open opportunity to set a reminder on.`};
  const o=parseReminder(h,k,t);if(!o||o.at<=todayISO())return{html:'That date has already passed; pick a later one from <b>Remind me</b> in the workflow.'};
  const rem=setReminder(h,k,{...o,label:remLabel({...o,every:o.every||0})});const ot=(opps(h).find(x=>x.k===k)||{title:CK[k].label}).title;
  return{html:`Reminder set for <b>${esc(h.name)}</b> · ${esc(ot)}: ${esc(rem.label)}. It will show under the bell and at the top of Book view when it is due.`,acts:[{label:'Open it',href:`#/client/${h.id}/opp/${k}/${(workOf(h,k)||{}).step||1}`}]}}

/* analytics for any holdings set */
function GA(h){
  const m=M(h),w=Object.fromEntries(Object.keys(L2).map(c=>[c,(m.l2[c]||0)/m.aum]));
  const cov=(a,b)=>VOL[a]*VOL[b]*(a===b?1:RHO[L2[a][0]][L2[b][0]]);
  let v=0,te=0,er=0;const ks=Object.keys(L2),d=Object.fromEntries(ks.map(c=>[c,w[c]-tl2(m,c)]));
  for(const a of ks){er+=w[a]*ER[a];for(const b of ks){v+=w[a]*w[b]*cov(a,b);te+=d[a]*d[b]*cov(a,b)}}
  const vol=Math.sqrt(v),sc=Object.fromEntries(Object.entries(SCEN).map(([k,[,r]])=>[k,ks.reduce((s,c)=>s+w[c]*r[c],0)]));
  const worst=Object.keys(sc).sort((a,b)=>sc[a]-sc[b])[0];
  const hy=m.pos.filter(x=>SEC[x.sym].l2==='HY'||/^BB|^B$|^CCC/.test(SEC[x.sym].rating||'')).reduce((s,x)=>s+x.mv,0)/m.aum;
  const fees=m.pos.reduce((s,x)=>s+x.mv*fee(x.sym),0)/m.aum;
  const top=m.pos.filter(x=>x.sym!=='CASH'&&SEC[x.sym].kind==='stock')[0];
  return{m,w,vol,te:Math.sqrt(Math.max(0,te)),er,sharpe:(er-SEC.CASH.yld)/vol,sc,worst,hy,fees,top};
}

  if(!best)return null;const{O}=allOptions(h,best.k),o=O.find(x=>x.id===best.w.opt);return o?{k:best.k,o,label:`Proposal: ${o.title}`}:null}

function analytics(h,P){
  const a=GA(h),b=P?GA(P.o.h2):null,band=BAND[h.risk]||[0,1];
  const card=(l,f,note)=>{const v=f(a),w=b?f(b):null;return`<div class="an"><div class="l">${l}</div><div class="v">${v}${b&&w!==v?` <span class="muted" style="font-size:15px">→</span> ${w}`:''}</div><div class="s">${note}</div></div>`};
  return`<section class="an-sec"><div class="gl-h" style="padding:0 2px 8px"><h2>Investment analytics</h2><span class="sub">${b?'Today → '+esc(P.label.toLowerCase()):'Estimates from illustrative capital-market assumptions'}</span></div><div class="angrid">
   ${card('Expected return',x=>pct(x.er),'Long-term capital-market assumption, weighted by asset class.')}
   ${card('Expected risk',x=>pct(x.vol),`Estimated volatility; ${esc(h.risk)} band ${pct(band[0],0)}–${pct(band[1],0)}.`)}
   ${card('Sharpe ratio',x=>x.sharpe.toFixed(2),'Expected return above cash, divided by risk.')}
   ${card('Tracking error vs target',x=>pct(x.te),'Expected yearly difference from the target allocation.')}
   ${card('Yield · income',x=>pct(x.m.yld,2),`${money((b||a).m.inc)} a year before taxes.`)}
   ${card('Fund costs',x=>x.fees.toFixed(1)+' bp','Value-weighted fund and manager fees.')}
   ${card('Largest single stock',x=>x.top?`${x.top.sym} ${pct(x.top.mv/x.m.aum)}`:'—','Direct holdings; guideline 10%.')}
   ${card('Worst past event',x=>pct(x.sc[x.worst]),`${SCEN[a.worst][0]}, replayed on today’s mix. Past results do not predict future ones.`)}
   ${card('Below investment grade',x=>pct(x.hy),'High yield and bonds rated below BBB−.')}
   ${card('Unrealized gain/loss',x=>signMoney(x.m.unreal),'Before tax; lots without basis excluded.')}
  </div></section>`;
}
/* SVG sunburst: inner ring L1, outer ring L2 */
function sunburst(inner,outer,center,sub){
  const W=300,cx=150,cy=150,r0=62,r1=98,r2=140,tot=inner.reduce((a,x)=>a+x.v,0)||1;
  const arc=(a0,a1,ra,rb)=>{const p=(a,r)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];if(a1-a0>=2*Math.PI-1e-6)a1=a0+2*Math.PI-1e-4;const L=a1-a0>Math.PI?1:0,[x0,y0]=p(a0,rb),[x1,y1]=p(a1,rb),[x2,y2]=p(a1,ra),[x3,y3]=p(a0,ra);return`M${x0} ${y0}A${rb} ${rb} 0 ${L} 1 ${x1} ${y1}L${x2} ${y2}A${ra} ${ra} 0 ${L} 0 ${x3} ${y3}Z`};
  let a=-Math.PI/2,s='';
  for(const it of inner){const a1=a+it.v/tot*2*Math.PI;s+=`<path d="${arc(a,a1,r0,r1)}" fill="${it.c}" stroke="var(--paper)" stroke-width="2" style="cursor:pointer" data-go="${it.href}" data-tip="${esc(it.l)}: ${pct(it.v)}"/>`;
    let b=a;for(const o of outer.filter(o=>o.g===it.k)){const b1=b+o.v/tot*2*Math.PI;s+=`<path d="${arc(b,b1,r1+3,r2)}" fill="${o.c}" stroke="var(--paper)" stroke-width="2" style="cursor:pointer" data-go="${o.href}" data-tip="${esc(o.l)}: ${pct(o.v)}"/>`;b=b1}
    a=a1}
  return`<svg class="svgchart" viewBox="0 0 ${W} ${W}" width="100%" style="max-width:320px;display:block;margin:0 auto" role="img" aria-label="Allocation sunburst: asset groups inside, asset classes outside">${s}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-family="Newsreader,serif" font-size="24" fill="var(--fg)">${esc(center)}</text><text x="${cx}" y="${cy+17}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(sub)}</text></svg>
   <div class="lg" style="justify-content:center;margin-top:8px">${inner.map(i=>`<span><i style="background:${i.c}"></i>${esc(i.l)} ${pct(i.v,0)}</span>`).join('')}</div>`;
}

  start(){this.i=0;document.body.classList.add('touring');this.show()},

  next(){if(this.i<TOUR_STEPS.length-1){this.i++;this.show()}else this.end()},
  prev(){if(this.i>0){this.i--;this.show()}},
  target(){const st=TOUR_STEPS[this.i];if(!st.sel)return null;for(const s of[].concat(st.sel)){const el=document.querySelector(s);if(el&&el.getClientRects().length&&getComputedStyle(el).display!=="none")return el}return null},
  show(){
    const st=TOUR_STEPS[this.i];st.pre&&st.pre();
