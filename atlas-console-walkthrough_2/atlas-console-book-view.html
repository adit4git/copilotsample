    if(cur!==st.route)location.hash=st.route;else render();
    setTimeout(()=>{if(st.pre)render();const el=this.target();if(el){const r=el.getBoundingClientRect(),top=scrollY+r.top-(innerHeight-Math.min(r.height,innerHeight*.55))/2;scrollTo({top:Math.max(0,top-(innerWidth<=700?60:0)),behavior:'instant'})}else scrollTo({top:0,behavior:'instant'});this.paint()},90);
  },
  paint(){
    if(this.i<0)return;const st=TOUR_STEPS[this.i],el=this.target();
    let back=document.getElementById('tour-back');if(!back){back=document.createElement('div');back.id='tour-back';document.body.appendChild(back)}
    let ring=document.getElementById('tour-ring');if(!ring){ring=document.createElement('div');ring.id='tour-ring';document.body.appendChild(ring)}
    let pop=document.getElementById('tour-pop');if(!pop){pop=document.createElement('div');pop.id='tour-pop';pop.setAttribute('role','dialog');pop.setAttribute('aria-live','polite');document.body.appendChild(pop)}
    pop.innerHTML=`<div class="tp-n">${this.i+1} of ${TOUR_STEPS.length} · Atlas tour</div><h3>${esc(st.t)}</h3><p>${esc(st.b)}</p><div class="tp-b"><button class="btn" data-tour="end">Close</button><span class="row"><button class="btn" data-tour="prev" ${this.i?'':'disabled'}>Back</button><button class="btn primary" data-tour="next">${this.i===TOUR_STEPS.length-1?'Finish':'Next'}</button></span></div>`;
    back.style.display=el?'none':'block';ring.style.display=el?'block':'none';
    const phone=innerWidth<=700;
    if(el){const r=el.getBoundingClientRect(),pad=6,t=Math.max(6,r.top-pad),b=Math.min(innerHeight-6,r.bottom+pad);
      Object.assign(ring.style,{left:Math.max(4,r.left-pad)+'px',top:t+'px',width:Math.min(innerWidth-8,r.width+pad*2)+'px',height:Math.max(20,b-t)+'px'});
      if(phone){const low=r.top+r.height/2>innerHeight/2;Object.assign(pop.style,{left:'12px',right:'12px',width:'auto',top:low?'12px':'auto',bottom:low?'auto':'12px'})}
      else{const pw=Math.min(360,innerWidth-24);pop.style.width=pw+'px';pop.style.right='auto';pop.style.bottom='auto';const ph=pop.offsetHeight;
        let top=b+12,left=Math.min(Math.max(12,r.left),innerWidth-pw-12);
        if(top+ph>innerHeight-12){top=t-ph-12;if(top<12){top=Math.min(innerHeight-ph-12,Math.max(12,r.top+12));left=r.right+16+pw<innerWidth?r.right+16:Math.max(12,r.left-pw-16)}}
        pop.style.top=top+'px';pop.style.left=left+'px'}}
    else{const pw=Math.min(420,innerWidth-24);Object.assign(pop.style,{width:pw+'px',left:(innerWidth-pw)/2+'px',right:'auto',bottom:'auto'});pop.style.top=Math.max(12,(innerHeight-pop.offsetHeight)/2)+'px'}
    pop.querySelector('[data-tour=next]').focus({preventScroll:true});
  }};
document.addEventListener('click',e=>{const t=e.target.closest('[data-tour]');if(!t)return;e.stopPropagation();const a=t.dataset.tour;if(a==='start')TOUR.start();else if(a==='next')TOUR.next();else if(a==='prev')TOUR.prev();else TOUR.end()},true);
document.addEventListener('keydown',e=>{if(TOUR.i<0)return;if(e.key==='Escape')TOUR.end();else if(e.key==='ArrowRight')TOUR.next();else if(e.key==='ArrowLeft')TOUR.prev()});
addEventListener('scroll',()=>TOUR.i>=0&&TOUR.paint(),{passive:true});addEventListener('resize',()=>TOUR.i>=0&&TOUR.paint());

const TOUR_ACTIVE=()=>TOUR.i>=0;

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const bl=e.target.closest('[data-bell]');if(bl){const p=document.getElementById('bellp');p.hidden=!p.hidden;if(!p.hidden)p.innerHTML=bellHtml();return}
  if(!e.target.closest('#bellp')&&!document.getElementById('bellp').hidden&&!e.target.closest('[data-go]'))document.getElementById('bellp').hidden=true;
  const dof=e.target.closest('[data-dayoff]');if(dof){const n=+dof.dataset.dayoff;S.dayOff=n?S.dayOff+n:0;for(const k of Object.keys(MC))delete MC[k];S.lastCtx=null;S.lastWf=null;saveWork();render();document.getElementById('bellp').innerHTML=bellHtml();return}
  if(e.target.closest('[data-resetwork]')){resetWork();for(const k of Object.keys(MC))delete MC[k];render();document.getElementById('bellp').innerHTML=bellHtml();toast('Sample work restored.');return}
  const ro=e.target.closest('[data-remopen]');if(ro){S.remOpen=S.remOpen===ro.dataset.remopen?null:ro.dataset.remopen;rerenderKeep();return}
  const rm=e.target.closest('[data-rem]');if(rm){const p=parse(),h=byId(p[1]),k=p[3];if(rm.dataset.rem==='x'){const r=workOf(h,k);if(r)delete r.rem;saveWork();toast('Reminder removed.')}else{const o=remindOptions(h,k)[+rm.dataset.rem];setReminder(h,k,o);toast(`Reminder set: ${o.label}.`)}S.remOpen=null;rerenderKeep();return}
  const wd=e.target.closest('[data-wdone]');if(wd){const p=parse(),h=byId(p[1]),k=p[3],r=workOf(h,k);if(r){r.st=wd.dataset.wdone==='1'?'done':(W(h,k).opt?'option':'progress');if(r.st==='done')delete r.rem;saveWork()}toast(wd.dataset.wdone==='1'?'Marked done.':'Reopened.');rerenderKeep();return}
  const aq=e.target.closest('[data-askq]');if(aq){e.preventDefault();e.stopPropagation();const q=aq.dataset.askq,p=parse();if(p[0]==='client'&&p[2]==='opp'){if(S.atlas==='min'){S.atlas='dock';rerenderKeep()}openChat(true);wfAsk(q)}else{if(S.atlas==='min'){S.atlas='dock';rerenderKeep()}openChat(true);ask(q)}return}
  const rq=e.target.closest('[data-rqsec]');if(rq){const i=+rq.dataset.rqsec,cur=S.rq===undefined?0:S.rq;S.rq=cur===i?null:i;rerenderKeep();return}
  const am=e.target.closest('[data-atlas]');if(am){S.atlas=am.dataset.atlas;if(S.atlas!=='min'){S.railNew=false}rerenderKeep();if(S.atlas==='full')openChat(true);return}
  const ci=e.target.closest('[data-cite]');if(ci){e.preventDefault();openCite(+ci.dataset.cite);return}
  if(document.body.classList.contains('atlas-full')&&!e.target.closest('.wf-chat,.top,#tour,.tour')){S.atlas='dock';rerenderKeep();return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();document.getElementById('bellp').hidden=true;if(g.dataset.opps){go(g.dataset.go);setTimeout(()=>document.getElementById('opps')?.scrollIntoView({block:'start'}),40);return}const to=g.dataset.go,here=parse()[0];if(to.startsWith('#/client/')&&here!=='client')S.from=here==='book'?'book/'+(S.book.crit||''):here==='ask'?'ask':'clients';go(to);return}
  const p=e.target.closest('[data-prompt]');if(p){ask(p.dataset.prompt);return}
  const c=e.target.closest('[data-crit]');if(c){const k=c.dataset.crit;if(S.book.crit===k){S.book.crit=null;go('#/book/')}else go('#/book/'+k);setTimeout(()=>{if(S.book.crit)document.getElementById('crit')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})},30);return}
  const r=e.target.closest('tr[data-client]');if(r){S.from=r.dataset.from;go('#/client/'+r.dataset.client);return}
  const mm=e.target.closest('[data-minmat]');if(mm){S.book.minMat=+mm.dataset.minmat;render();document.getElementById('crit')?.scrollIntoView({block:'start'});return}
  const hz=e.target.closest('[data-hz]');if(hz){S.book.horizon=+hz.dataset.hz;render();document.getElementById('crit')?.scrollIntoView({block:'start'});return}
  const sg=e.target.closest('[data-cseg]');if(sg){S.clients.seg=sg.dataset.cseg;render();return}
  const so=e.target.closest('[data-sort]');if(so){const k=so.dataset.sort;if(S.clients.sort===k)S.clients.dir*=-1;else{S.clients.sort=k;S.clients.dir=k==='name'||k==='meet'?1:-1}render();return}
  const op=e.target.closest('[data-opp]');if(op){const id=parse()[1],r=PROG[id+':'+op.dataset.opp];go(`#/client/${id}/opp/${op.dataset.opp}/${r&&r.st!=='done'?r.step||1:1}`);return}
  const oo=e.target.closest('[data-opt]');if(oo){const p=parse(),h=byId(p[1]),w=W(h,p[3]);const id=oo.dataset.opt;w.opt=!id||w.opt===id?null:id;w.ts=Date.now();w.showShelf=false;if(w.opt&&!TOUR_ACTIVE())guideReact(h,p[3]);rerenderKeep();return}
  const wc2=e.target.closest('[data-wfchip]');if(wc2){const[i,j]=wc2.dataset.wfchip.split(':').map(Number);guideChip(i,j);return}
  const wg=e.target.closest('[data-wfguide]');if(wg){const p=parse(),h=byId(p[1]);openChat(true);guideStart(h,p[3]);paintWf(h,p[3]);return}
  const sh=e.target.closest('[data-shelf]');if(sh){const p=parse(),w=W(byId(p[1]),p[3]);w.showShelf=sh.dataset.shelf==='1';if(w.showShelf)w.opt=null;rerenderKeep();if(w.showShelf)document.querySelector('.shelf')?.scrollIntoView({block:'nearest'});return}
  const sl=e.target.closest('[data-shelfl1]');if(sl){const p=parse();W(byId(p[1]),p[3]).shelfL1=sl.dataset.shelfl1;rerenderKeep();return}
  const pk=e.target.closest('[data-pick]');if(pk){const p=parse(),w=W(byId(p[1]),p[3]),sy=pk.dataset.pick;w.shelfSel=w.shelfSel.includes(sy)?w.shelfSel.filter(x=>x!==sy):[...w.shelfSel,sy].slice(-4);rerenderKeep();return}
  const sa=e.target.closest('[data-shelfadd]');if(sa){const p=parse(),h=byId(p[1]),w=W(h,p[3]);const a=document.getElementById('shelfamt');if(a)w.shelfAmt=+a.value;w.custom=customOption(h,p[3]);w.opt=w.custom?'custom':null;w.ts=Date.now();w.showShelf=false;rerenderKeep();return}
  const qs=e.target.closest('[data-qsec]');if(qs){const i=+qs.dataset.qsec;S.qsec=S.qsec===i?null:i;render();return}
  const ws=e.target.closest('[data-wfsec]');if(ws){const p=parse(),h=byId(p[1]),k=p[3],i=+ws.dataset.wfsec,w=W(h,k),cur=document.querySelector('.qs-t .on');w.qsec=cur&&+cur.dataset.wfsec===i?null:i;rerenderKeep();return}
  const bg=e.target.closest('[data-budget]');if(bg){const p=parse(),w=W(byId(p[1]),p[3]);w.budget=+bg.dataset.budget;rerenderKeep();return}
  if(e.target.closest('[data-print]')){window.print();return}
  if(e.target.closest('[data-propose]')){const p=parse(),r=workOf(byId(p[1]),p[3]);if(r){r.st='drafted';saveWork()}toast('Saved as a draft proposal for review (prototype: not sent anywhere).');rerenderKeep();return}
  const wq=e.target.closest('[data-wfq]');if(wq){openChat(true);wfAsk(wq.dataset.wfq);return}
  const wc=e.target.closest('[data-wfchat]');if(wc){const on=wc.dataset.wfchat==='1';if(!on&&S.atlas==='full'){S.atlas='dock';applyAtlas()}openChat(on);return}
  const sw=e.target.closest('[data-show]');if(sw){S.dd.show=sw.dataset.show;rerenderKeep();return}
  const lv=e.target.closest('[data-lvl]');if(lv){const id=parse()[1];go(`#/client/${id}/${lv.dataset.lvl}`);setTimeout(()=>document.getElementById('portfolio')?.scrollIntoView({block:'start'}),20);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.atlas==='full'&&(typeof TOUR==='undefined'||TOUR.i<0)){S.atlas='dock';rerenderKeep();return}if(e.key==='Enter'){const r=e.target.closest('tr[data-client],tr[data-go]');if(r)r.click()}});
document.addEventListener('submit',e=>{if(e.target.id==='composer'){e.preventDefault();const q=document.getElementById('q');ask(q.value);q.value=''}if(e.target.id==='wfform'){e.preventDefault();const q=document.getElementById('wfq');wfAsk(q.value);q.value=''}});
function rerenderKeep(){const y=scrollY,c=document.getElementById('wcs'),cy=c?c.scrollTop:0,open=document.body.classList.contains('chat-open');render();scrollTo({top:y,behavior:'instant'});const c2=document.getElementById('wcs');if(c2)c2.scrollTop=c2.scrollHeight;document.body.classList.toggle('chat-open',open)}
function openChat(on){document.body.classList.toggle('chat-open',on);if(on){S.railNew=false;document.querySelector('.fab.new')?.classList.remove('new')}if(on)setTimeout(()=>{const s=document.getElementById('wcs')||document.querySelector('#rail #stream');if(s)s.scrollTop=s.scrollHeight},0)}
function toast(t){let d=document.getElementById('toast');if(!d){d=document.createElement('div');d.id='toast';d.setAttribute('role','status');document.body.appendChild(d)}d.textContent=t;d.classList.add('on');clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove('on'),2600)}
document.addEventListener('input',e=>{if(e.target.id==='cq'){S.clients.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('cq');n.focus();n.setSelectionRange(pos,pos)}});
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.textContent=t.dataset.tip;tip.style.opacity=1;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=e.clientY+16+tip.offsetHeight>innerHeight?e.clientY-tip.offsetHeight-10:e.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px'});
/* advisor + theme */
const adv=document.getElementById('adv');adv.innerHTML=Object.entries(DATA.advisors).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');
adv.addEventListener('change',()=>{S.adv=adv.value;S.book.crit=null;S.chat=[];const p=parse()[0];go(p==='client'?'#/clients':location.hash||'#/ask');render()});
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;try{t?localStorage.setItem('atlas-theme',t):localStorage.removeItem('atlas-theme')}catch(e){}render()}
try{const t=localStorage.getItem('atlas-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;applyTheme(dark?'light':'dark')});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>render());
if(!loadWork())seedWork();
render();
</script>
