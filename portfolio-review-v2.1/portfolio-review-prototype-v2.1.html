/* v2.1: AI touchpoints and CIO view */
:root{--ai:#6a4bd0;--ai-tint:#f2eefd}
:root[data-theme=dark]{--ai:#ab97f3;--ai-tint:#1d1832}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ai:#ab97f3;--ai-tint:#1d1832}}
.ai-zone{position:relative}
.ai-badge{display:none;align-items:center;gap:3px;border:1px solid var(--ai);color:var(--ai);background:var(--paper);border-radius:99px;padding:1px 8px;font-size:10px;font-weight:750;letter-spacing:.02em;cursor:pointer;line-height:1.6;min-height:0}
body.show-ai .ai-badge{display:inline-flex;margin-bottom:6px}
body.show-ai .ai-zone{border:1.5px dashed var(--ai);border-radius:9px;background:var(--ai-tint);padding:8px 11px 10px;margin:8px 0}
body.show-ai .ai-zone .lede{margin:0}
body.show-ai .ai-zone .talk-mini{margin:0;background:transparent;padding:0}
.ai-text{font-size:12.5px;color:var(--fg-2);line-height:1.55}
.preview-head .ai-zone{margin:12px 0 4px}
body:not(.show-ai) .ai-zone .ai-text{margin-top:10px}
.ai-toggle.on{border-color:var(--ai);color:var(--ai);background:var(--ai-tint)}
.ai-dot{color:var(--ai);font-size:16px;line-height:1}

 else if(d.pickconc){let sym=d.pickconc;openPicker({title:'Choose reinvestment for '+sym,context:'conc',sym,sel:LS().conc[sym]?.fund||'VTV'});return}
 else if(d.pickstyle){let sym=d.pickstyle,klass=Object.entries(DATA.funds[sym]?.classes||{}).sort((a,b)=>b[1]-a[1])[0]?.[0]||'LCV';openPicker({title:'Compare alternatives to '+sym,cls:klass,context:'deep',sel:sym});return}
 else if(d.style){openPicker({title:'Investment research · '+d.style,cell:d.style,context:'deep'});return}
 else if(d.concinto){let [sym,intent]=d.concinto.split('=');LS().conc[sym]??={to:.1,into:'gaps',fund:'VTV'};LS().conc[sym].into=intent}
 else if(d.goalfile!==undefined){LS().goal=structuredClone(HH().goals[+d.goalfile])}
 else if(d.goaltype){let m=base();LS().goal=d.goaltype==='income'?{type:'income',annual_income:Math.round(m.income*1.1/10000)*10000}:d.goaltype==='return'?{type:'return',target_return:Math.ceil(m.er*1.1*400)/400}:{type:'downside',max_loss:.25,scenario:'gfc'}}
 else if(d.scen){LS().stress.sid=d.scen}
 else if(d.dgpick){let [stock,alt]=d.dgpick.split('=');LS().downgrade??={};LS().downgrade[stock]=alt}
 else if(d.dgnote){let dow=DATA.downgrades.find(x=>x.sym===d.dgnote),holder=dow?.holders.find(x=>x.household_id===HH().id),alt=LS().downgrade?.[d.dgnote]||dow?.alternatives[0]?.sym;addGroup('dg:'+d.dgnote,'Discuss '+d.dgnote+' with manager','dg',[{action:'note',sym:d.dgnote,text:`Ask ${holder.decides} about the ${d.dgnote} downgrade and ${alt} as an alternative.`}],{sym:d.dgnote,alt});return}
 else if(d.why){S.why=d.why;paintSide();return}
 else if(d.ptabp!==undefined){PS().active=+d.ptabp;S.why='vol'}
 else if(d.newp!==undefined){let p=newProposal(PS().next++);PS().list.push(p);PS().active=PS().list.length-1;toast(p.name+' created')}
 else if(d.dup!==undefined||d.dupidx!==undefined){let index=d.dupidx!==undefined?+d.dupidx:PS().active;let original=PS().list[index],p=structuredClone(original);p.id=PS().next++;p.name='Proposal '+String.fromCharCode(64+p.id);p.pick=false;p.tp=null;PS().list.push(p);PS().active=PS().list.length-1;toast(p.name+' duplicated')}
 else if(d.delp!==undefined){if(PS().list.length>1){PS().list.splice(PS().active,1);PS().active=Math.max(0,PS().active-1)}}
 else if(d.rmg){let p=prop();p.groups=p.groups.filter(g=>g.key!==d.rmg);p.tp=null}
 else if(d.clear!==undefined){prop().groups=[];prop().tp=null;prop().pick=false}
 else if(d.checkopen!==undefined){S.sheet='check';paintSheet();return}
 else if(d.accept!==undefined){let failed=checksFor(prop()).filter(x=>!x[2]);let exe=failed.some(x=>x[0]==='Executable');S.exc=document.querySelector('#exc')?.value||S.exc;if(exe){toast('Resolve executable checks before accepting.');return}if(failed.length&&!S.exc.trim()){toast('Record a reason for the exception before accepting.');return}prop().pick=true;dismiss();toast('Accepted for client discussion · added to summary (not saved)')}
 else if(d.ptab){S.pick.tab=d.ptab;paintSheet();return}
 else if(d.choose){S.pick.sel=d.choose;paintSheet();return}
 else if(d.fav){let k=d.fav;if(S.favs.has(k))S.favs.delete(k);else S.favs.add(k);try{localStorage.setItem('atlas.pr.favorites',JSON.stringify([...S.favs]))}catch(e){}paintSheet();return}
 else if(d.favadd!==undefined){let vals=(document.querySelector('#favadd')?.value||'').toUpperCase().split(/[\s,]+/).filter(k=>DATA.funds[k]);if(!vals.length)toast('None of those are on the prototype fund shelf');else{vals.forEach(k=>S.favs.add(k));try{localStorage.setItem('atlas.pr.favorites',JSON.stringify([...S.favs]))}catch(e){}paintSheet()}return}
 else if(d.pickuse!==undefined){useSelectedFund();return}
 else if(d.close!==undefined){dismiss();return}
 else if(d.hh){chooseHH(d.hh,'dg');return}
 else if(d.activate!==undefined){PS().active=+d.activate}
 else if(d.regen!==undefined){let p=PS().list.find(p=>p.id===+d.regen);if(p)p.tp=null}
 else if(d.copy!==undefined){let p=PS().list.find(p=>p.id===+d.copy);if(p){let t=p.tp??talking(p);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>toast('Client talking points copied')).catch(()=>{copyFallback(t);toast('Client talking points copied')})}else{copyFallback(t);toast('Client talking points copied')}}return}
 else if(d.print!==undefined){window.print();return}
 else if(d.sidetoggle!==undefined){S.sideOpen=!S.sideOpen;paintSide();return}
 else if(d.aitoggle!==undefined){S.showAI=!S.showAI;document.body.classList.toggle('show-ai',S.showAI);toast(S.showAI?'AI touchpoints highlighted':'AI touchpoints hidden');paintTop();return}
 else if(d.aiinfo!==undefined){S.aiFocus=d.aiinfo||null;S.sheet='ai';paintSheet();return}
 else if(d.aigo){let a=AI[d.aigo];S.sheet=null;S.aiFocus=null;S.showAI=true;S.step=a.step;S.holding=null;paintMain();paintSheet();window.scrollTo({top:0,behavior:'instant'});setTimeout(()=>document.querySelector(`[data-ai="${d.aigo}"]`)?.scrollIntoView({block:'center'}),40);return}
 else if(d.themeToggle!==undefined){let cur=document.documentElement.dataset.theme||'light';document.documentElement.dataset.theme=cur==='dark'?'light':'dark';return}
 paintMain()}
function copyFallback(t){let input=document.createElement('textarea');input.value=t;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();try{document.execCommand('copy')}catch(e){}input.remove()}
let repaintTimer=null;
function actionInput(e){let d=e.target.dataset;if(d.range){let [g,k]=d.range.split('.');LS()[g][k]=+e.target.value;clearTimeout(repaintTimer);repaintTimer=setTimeout(()=>paintMain(),140);let label=e.target.closest('.ctl')?.querySelector('strong');if(label)label.textContent=e.target.value+'%';return}if(d.conc){LS().conc[d.conc]??={into:'gaps',fund:'VTV',to:.1};LS().conc[d.conc].to=+e.target.value/100;clearTimeout(repaintTimer);repaintTimer=setTimeout(()=>paintMain(),140);return}if(d.tp!==undefined){let p=PS().list.find(p=>p.id===+d.tp);if(p)p.tp=e.target.value;e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+12+'px';return}}
function actionChange(e){let d=e.target.dataset;if(e.target.id==='hhSel'){chooseHH(e.target.value);return}if(d.pname!==undefined){prop().name=e.target.value||'Untitled proposal';paintMain();return}if(d.amt){let pos=d.amt.lastIndexOf(':');let key=d.amt.slice(0,pos),id=d.amt.slice(pos+1);let g=prop().groups.find(x=>x.key===key),line=g?.lines.find(x=>x.id===id);if(line){line.amount=Math.max(0,Number(e.target.value.replace(/[$,\s]/g,''))||0);prop().tp=null}paintMain();return}if(d.check){let [g,k]=d.check.split('.');LS()[g][k]=e.target.checked;paintMain();return}if(d.num){let [g,k]=d.num.split('.');LS()[g][k]=+e.target.value;paintMain();return}if(d.goalval!==undefined){let g=LS().goal||structuredClone(HH().goals[0])||{type:'return',target_return:.07};let n=Math.max(0,+e.target.value||0);if(g.type==='income')g.annual_income=n;else if(g.type==='return')g.target_return=n/100;else g.max_loss=n/100;LS().goal=g;paintMain();return}if(d.goalsc!==undefined){LS().goal??=structuredClone(HH().goals[0])||{type:'downside',max_loss:.25,scenario:'gfc'};LS().goal.scenario=e.target.value;paintMain();return}if(d.pick!==undefined){let p=PS().list[+d.pick];if(p)p.pick=e.target.checked;paintMain();return}if(e.target.id==='exc'){S.exc=e.target.value;return}if(d.aishow!==undefined){S.showAI=e.target.checked;document.body.classList.toggle('show-ai',S.showAI);paintTop();return}}
document.addEventListener('click',actionClick);
document.addEventListener('input',actionInput);
document.addEventListener('change',actionChange);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)dismiss();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-drill],[data-choose]')){e.preventDefault();e.target.click()}});
document.getElementById('scrim').addEventListener('click',dismiss);
const tip=document.getElementById('tip');document.addEventListener('mousemove',e=>{let t=e.target.closest?.('[data-tip]');if(!t){tip.style.display='none';return}tip.textContent=t.getAttribute('data-tip');tip.style.display='block';let x=Math.min(window.innerWidth-tip.offsetWidth-10,e.clientX+14),y=Math.min(window.innerHeight-tip.offsetHeight-10,e.clientY+14);tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'});
deriveSuggestions();paint();
</script></body></html>
