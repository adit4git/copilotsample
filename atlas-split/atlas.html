<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Atlas Advisor Console — guided tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/core-1-tokens-shell-primitives.css">
<link rel="stylesheet" href="css/core-2-today-tables-chat-client-tax.css">
<link rel="stylesheet" href="css/core-3-workbenches-onboarding-mobile.css">

</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <aside class="rail">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>
      </div>
      <div>
        <div class="name">Atlas</div>
        <div class="sub">Meridian Private Wealth</div>
      </div>
      <button class="rail-toggle" id="railToggle" type="button" title="Collapse sidebar  [" aria-label="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">WORKSPACE</div>
      <button data-nav="today" class="on"></button>
      <button data-nav="book"></button>
      <button data-nav="chat"></button>
      <div class="lbl">PROGRAMS</div>
      <button data-nav="tax"></button>
      <button data-nav="crosssell"></button>
      <button data-nav="shelf"></button>
      <button data-nav="guide"></button>
    </nav>
    <div class="foot">
      <div class="av" id="faAvatar">DW</div>
      <div style="min-width:0;flex:1">
        <div class="who" id="faWho">Dana Whitfield</div>
        <select id="faSwitch" title="Switch advisor / book of business" style="font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);background:transparent;border:none;padding:0;margin-top:1px;cursor:pointer;max-width:100%"></select>
      </div>
      <button class="tog" id="themeToggle" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="topbar">
      <div class="crumb" id="crumb"><b>Today</b></div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="globalSearch" placeholder="Search clients, holdings, programs…" />
        <span class="kbd">/</span>
      </div>
      <span class="standalone-pill" title="Standalone file: full details for the 11 clients used in the tour, prompts and conversion map. Answers and numbers were captured from the Atlas server; product search and vehicle comparison run in the page. No server needed.">Standalone</span>
      <button id="tourBtn" class="tour-btn" type="button">Show me around</button>
      <button id="engineToggle" title="Rule engine is active — verdicts derived from client facts + policy pack" aria-pressed="true" style="display:inline-flex;align-items:center;font:inherit;font-size:12px;font-weight:600;color:var(--fg);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:8px 13px;margin-left:10px;cursor:pointer;white-space:nowrap;flex:0 0 auto"></button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<!-- MOBILE TABS -->
<nav class="mtabbar" id="mtabbar"></nav>

<script src="atlas-products.js"></script>
<script src="atlas-data.js"></script>
<script src="js/standalone-api.js"></script>

<script src="js/app-01-foundation.js"></script>
<script src="js/app-02-nav-today.js"></script>
<script src="js/app-03-book.js"></script>
<script src="js/app-04-ask-atlas.js"></script>
<script src="js/app-05-draft-review.js"></script>
<script src="js/app-06-transition-workbench.js"></script>
<script src="js/app-07-vehicle-comparison.js"></script>
<script src="js/app-08-product-shelf.js"></script>
<script src="js/app-09-conversion-map.js"></script>
<script src="js/app-10-onboarding-guide-tour.js"></script>
<script src="js/app-11-sidebar-router-events-boot.js"></script>

<!-- ============ Atlas add-on: tax personalization (TEM overlays, tax lots, TEM Style Manager options) ============ -->
<link rel="stylesheet" href="css/tax-personalization.css">

<script src="js/tax-personalization.js"></script>

<!-- ============ Atlas add-on: CIO Model Fit (brokerage accounts against their CIO strategic model) ============ -->
<link rel="stylesheet" href="css/cio-model-fit.css">

<script src="js/cio-model-fit.js"></script>

</body>
</html>
